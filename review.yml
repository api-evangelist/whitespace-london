  specs:
  - file: openapi/whitespace-london-platform-openapi.yml
    title: Whitespace Platform API
    openapiVersion: 3.0.0
    infoVersion: 0.1.0
    specSelfDatedAs: Last update 29th May 2025
    paths: 113
    schemas: 26
    sourceURL: https://swagger.whitespace.co.uk/index.spec.js
    sourceHttpStatus: 200
    fetched: '2026-07-25'
    extraction: >-
      The document is served as the JavaScript object literal assigned to `const spec` in
      index.spec.js. The leading `const spec =` assignment was stripped. The served bytes
      contain regular-expression backslash sequences (\d, \., \$, \B, \U) inside JSON string
      values that are legal in JavaScript but invalid JSON escapes; each such lone backslash
      was doubled so the document parses, preserving the author's evident regex intent. No
      keys, paths, schemas, servers, security or descriptions were added, removed or altered.
      The resulting object was serialised to YAML.
    servers:
    - url: https://sandbox.whitespace.co.uk/
      description: Sandbox Environment
    - url: https://tess.whitespace.co.uk/
      description: Tess Environment
    - url: https://beta.whitespace.co.uk/
      description: Staging/test environment (declared "Beta Environment")
    - url: https://staging.whitespace.co.uk/
      description: Staging Environment
    serversNote: >-
      No production server is declared in the spec. Production access is arranged separately
      with Whitespace Support after Sandbox testing, per the Getting Started guide.
  specsCount: 1
  insuranceVerbs:
    quote:
      exposed: true
      audience: agent-facing (brokers and underwriters at contracted London-market firms)
      endpoints:
      - POST /api/risks/{riskID}/quoteOnRequest
      - POST /api/risks/{riskID}/saveQuoteDetails
      - GET /api/risks/{riskID}/getQuoteDetails
      - POST /api/risks/{riskID}/showQuoteToBroker
      - POST /api/risks/{riskID}/declineQuoteRequest
      - POST /api/risks/{riskID}/markAsIndicative
      - POST /api/risks/{riskID}/notTakeUpQuotation
      - POST /api/risks/{riskID}/forwardAsQuoteRequest
      - POST /api/risks/{quoteID}/createDraftFromQuote
    bind:
      exposed: true
      audience: agent-facing
      endpoints:
      - POST /api/risks/{riskID}/createBindableQuote
      - POST /api/risks/{riskID}/draftToFirmOrder
      - POST /api/risks/{riskID}/markAsFirmOrder
      - POST /api/risks/{riskID}/declineFirmOrder
      - POST /api/risks/{riskID}/withdrawFirmOrder
      - POST /api/risks/{riskID}/writeLine
      - POST /api/risks/{riskID}/recordLine
      - POST /api/risks/{riskID}/requestWrittenLineSets
      - POST /api/risks/{riskID}/acceptWrittenLine/{writtenLineSetID}
      - POST /api/risks/{riskID}/rejectWrittenLine/{writtenLineSetID}
      - POST /api/risks/{riskID}/signSets
      - POST /api/risks/{riskID}/reSignSets
      - POST /api/risks/{riskID}/rollbackSigned
      - POST /api/bindNotifyParties
    issue:
      exposed: true
      note: >-
        Contract document production rather than carrier policy issuance — Whitespace produces
        the agreed digital MRC contract, not a policy schedule from a policy admin system.
      endpoints:
      - GET /api/risks/{riskID}/getExtendedMRC
      - POST /export/pdf/{riskID}
      - GET /api/documents/{docID}
      - GET /api/attachments/{rootID}
    fnol:
      exposed: false
      note: >-
        No FNOL, claim, loss or notification endpoint exists. Whitespace is a placing
        platform; claims are out of scope for the product. Absence is a correct finding.
  acord:
    posture: >-
      ACORD-native: authored the JSON Market Reform Contract (JMRC) and donated it to ACORD
      for the Global Reinsurance and Large Commercial data standards; the Defined Data API
      returns an ACORDGPM tagset alongside MRC headings.
    evidence:
    - source: https://apidocs.whitespace.co.uk/JMRC%20ACORD%20Specification%20V0.5%20-%20Defined%20Data.pdf
      status: 200
      quote: >-
        "The JMRC (JSON Market Reform Contract) is the resulting digital placing standard that
        Whitespace has now donated to ACORD, the standards-setting body for the global
        insurance industry, and which will be incorporated into ACORD's industry-owned Global
        Reinsurance and Large Commercial Data Standards, which are widely used through the
        global insurance value chain." (JMRC Specification Version 0.5, published 21/10/2021)
    - source: openapi/whitespace-london-platform-openapi.yml
      quote: >-
        tagset path parameter described as "An alternative tagset to the default. Currently
        supported ACORDGPM", example "ACORDGPM"; response examples carry tags including
        ACORDGPM:InsuredName, ACORDGPM:BrokerContractReference, ACORDGPM:InceptionDate,
        ACORDGPM:ExpiryDate, ACORDGPM:InstructionType and ACORDGPM:InsuredAddress* paired with
        their mrcHeading values. 34 ACORD references appear in the spec.
    - source: https://www.whitespace.co.uk/integration/
      status: 200
      note: References work with partner systems to produce CDR (Core Data Record) compliant data.
    al3: not applicable / no reference found (AL3 and IVANS are US agency rails, not London-market)
    ivans: no reference found
    ngds: >-
      Not named as NGDS, but the JMRC donation targets ACORD's Global Reinsurance and Large
      Commercial (GRLC) data standards, which is the same standards family.
  auth:
    model: HTTP bearer JWT service token, issued out of band and IP-allowlisted
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    selfServe: false
    detail: >-
      Whitespace Support supplies a JSON file per service account or platform user containing
      token, kid (for revocation) and expiry. The token value is sent as
      "Authorization: Bearer <token>". Calls are rejected with 401 and
      {"error":true,"reason":"Invalid WSAUTH"} if the token is expired or revoked, if the
      associated platform user is not Live or ReadOnly, or if the source IP address is not
      allowlisted. Maximum token lifetime is one year. A separate refresh-token flow is
      documented. No OAuth2 authorization server, no OIDC discovery, no mTLS, no API key.
    onboardingPath: >-
      Request Sandbox user accounts, an API service account and service bus queues from
      support@whitespace.co.uk; test on Sandbox; then request Production service account(s)
      and queue(s). Commercial terms are governed by the Whitespace Interchange Agreement.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://sandbox.whitespace.co.uk/
    documented: true
    note: Sandbox is the documented base URL; production hostname is provided on onboarding.
  - protocol: AMQP / Azure Service Bus queues
    documented: true
    specPublished: false
    note: >-
      Per-client (and per-team) queues carry an activity message for every platform action —
      time-stamped, with an activity code, document reference and message id — which the
      client system consumes and then calls back into the REST API. Queues are provisioned by
      Whitespace Support. This is the platform's event mechanism.
  - protocol: Webhooks
    documented: false
    note: No webhook registration endpoint or event catalog is published. Queues replace webhooks.
  - protocol: AsyncAPI
    documented: false
    note: No AsyncAPI document is published for the queue surface.
  - protocol: GraphQL
    documented: false
    note: POST to /graphql on sandbox returns nginx 405 Not Allowed. No GraphQL surface.
  - protocol: gRPC
    documented: false
    note: No .proto files published.
  postman:
    published: false
    note: >-
      No public Postman workspace or collection was found. https://www.postman.com/whitespace
      returns the generic Postman SPA shell with no Whitespace Software workspace content.
  sdks:
    published: false
    note: >-
      No first-party SDK or client library is published. The docs provide a C# access example
      PDF and bash/curl samples for macOS/Unix and Windows command line only.
  corporate:
    legalName: Whitespace Software Limited
    companyNumber: '02020348'
    registeredIn: England & Wales
    registeredAddress: 26th Floor, 22 Bishopsgate, London, EC2N 4BQ, United Kingdom
    parent: Verisk (via Sequel)
    lloydsStatus: >-
      Granted fully recognised status by Lloyd's for electronic placement; one of two
      Lloyd's-approved placing platforms.
    platformVersion: 3.7.0 (build 2026-07-03, per anonymous GET /api/version on sandbox)
