aid: whitespace-london
name: Whitespace
homeMarket: United Kingdom
tier: market-infrastructure
review:
  question: >-
    Does Whitespace publish a real, public developer portal and downloadable API
    specification for the London-market placing platform, and what is its ACORD posture?
  answer: true
  date: '2026-07-25'
  reviewer: API Evangelist
  gated: true
  gatedNote: >-
    Documentation is fully public and unauthenticated; CREDENTIALS are not. Sandbox and
    production service tokens are issued by Whitespace Support to contracted broker, carrier
    and vendor organisations, are restricted to allowlisted IP addresses, and expire within
    one year. There is no self-serve signup, no free tier, and no public key issuance.
findings:
  summary: |
    Whitespace is the rare insurance-sector record where the API surface is genuinely
    documented in public. apidocs.whitespace.co.uk returns HTTP 200 with no login and acts
    as a real developer portal: an API index that links endpoint documentation on Swagger,
    an access/token guide set, an Azure Service Bus queues integration guide set, a data
    persistence and Defined Data corpus, and step-by-step use-case guides for brokers and
    carriers. swagger.whitespace.co.uk returns HTTP 200 and is a stock Swagger UI
    distribution whose spec is inlined in index.spec.js as a JavaScript object literal
    (const spec = {...}); there is no /openapi.json, /swagger.json, /api-docs, /spec or
    /redoc — all return 404. Extracting the object literal yields a complete OpenAPI 3.0.0
    document, "Whitespace Platform API" version 0.1.0, dated "Last update 29th May 2025",
    with 113 paths, 26 component schemas, four declared servers, and a single bearerAuth
    (HTTP bearer, JWT) security scheme applied globally. That spec is the only machine
    readable artifact published and it is saved verbatim in this repo.

    The four insurance verbs split cleanly. QUOTE and BIND are richly covered because
    Whitespace is a placing platform for the subscription market: quoteOnRequest,
    saveQuoteDetails, getQuoteDetails, showQuoteToBroker, declineQuoteRequest,
    markAsIndicative and notTakeUpQuotation on the quote side; createBindableQuote,
    draftToFirmOrder, markAsFirmOrder, declineFirmOrder, withdrawFirmOrder, writeLine,
    recordLine, requestWrittenLineSets, acceptWrittenLine, rejectWrittenLine, signSets,
    reSignSets and rollbackSigned on the bind/line side, plus a full endorsement lifecycle
    (createEndorsement, showEndorsement, acceptEndorsement, completeEndorsement,
    deleteEndorsement, endorsementFollowers). ISSUE is covered as contract document
    production rather than policy issuance: getExtendedMRC, POST /export/pdf/{riskID} and
    GET /api/documents/{docID}. FNOL and claims are entirely absent and correctly so —
    Whitespace does not do claims. The audience is agent/partner-facing (brokers and
    underwriters at contracted London-market firms and their vendor systems), never
    consumer-facing.

    The ACORD posture is the strongest of any company likely to appear in this data set,
    and it is verifiable rather than marketing. Whitespace authored the JSON Market Reform
    Contract (JMRC) standard — the Market Reform Contract expressed in JSON — and, per its
    own published specification, "donated to ACORD for industry-wide use", to be
    "incorporated into ACORD's industry-owned Global Reinsurance and Large Commercial Data
    Standards". The JMRC ACORD Specification v0.5 is published as a public PDF on the docs
    site. In the API itself, the Defined Data endpoints (/api/v22.04/data/{riskID} and
    /api/v23.09/data/{riskID}, with /tagset/{tagset} and /verify variants) accept an
    alternative tagset parameter documented as "Currently supported ACORDGPM" and return
    contract values carrying tags such as ACORDGPM:InsuredName,
    ACORDGPM:BrokerContractReference, ACORDGPM:InceptionDate and
    ACORDGPM:InsuredAddressNumberAndStreet alongside the corresponding MRC headings. The
    integration page additionally references work to produce CDR (Core Data Record)
    compliant data with partner systems. No AL3, IVANS, agency-download, Applied Epic or
    Vertafore reference appears, which is expected — those are US agency-system rails, not
    London-market ones.

    Events are real but are not webhooks. Whitespace publishes two guides describing
    per-client Azure Service Bus queues: every user action creates an activity document
    which is placed on the client's queue as a time-stamped message carrying an activity
    code, document reference and message id, which the client system then uses to call back
    into the REST API. Queues are provisioned by Whitespace Support per organisation or
    team. No AsyncAPI document, no webhook registration endpoint and no public event catalog
    exists. No public Postman workspace or collection was found. No GraphQL surface exists:
    POST to https://sandbox.whitespace.co.uk/graphql returns nginx 405 Not Allowed. No
    .proto files are published. /.well-known/openid-configuration and
    /.well-known/oauth-authorization-server on sandbox.whitespace.co.uk return the Angular
    single-page-application shell rather than discovery documents, and return 404 on the
    marketing domain — so there is no OAuth/OIDC discovery despite the JWT bearer scheme;
    tokens are minted and revoked by Whitespace Support out of band, with a documented kid
    for revocation.
