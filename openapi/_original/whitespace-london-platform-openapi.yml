      requestBody:
        content:
          application/json:
            schema:
              properties:
                templateID:
                  type: string
                  description: The unique ID of the template
                  example: IC4E211C90-FA0D-4B87-83CD-7F35CC443D9C
                contractRev:
                  type: string
                  description: Revision of the contract
                  example: 2-779b4a910939f5f5fb2196edc7aa854a
