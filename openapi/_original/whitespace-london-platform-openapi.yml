                    type: string
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: string
                    example: IC9326FED7-A802-4C86-B625-6E078470CA83
                    description: ID of the merged risk
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
