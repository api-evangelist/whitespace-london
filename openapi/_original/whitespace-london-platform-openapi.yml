  /api/risks/{riskID}/declineFirmOrder:
    post:
      summary: Declines a firm order - Underwriter Only
      description: An underwriter may only decline a firm order before adding a written line.
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The full unique ID of the firm order, ending in ::FO::{companyId}::{teamId}. Please make sure that the companyId and teamId are correct and relevant for the team you are declining for, as a broker may send a firm order on the same contract to multiple teams and/or Whitespace corporate accounts at your organisation.
        example: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL
      requestBody:
        description: Payload depends on the type of the contract and whether it is sectioned. See below for examples.
        required: true
        content:
          application/json:
            examples:
              Open Market/Facility:
                description: Open Market or Facility
                value:
                - {}
              Declaration:
                description: Declaration
                value:
                - associatedFacilityID:
                    facilityID: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
              Sectioned Open Market/Facility:
                description: Sectioned Open Market or Facility
                value:
                - sectionID: '1'
              Sectioned Declaration:
                description: Sectioned Declaration
                value:
                - sectionID: '1'
                  associatedFacilityID:
                    facilityID: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
            schema:
              type: array
              items:
                type: object
                example: {}
      responses:
        '200':
          description: succesfully declined Firm Order
          content:
            application/json:
              example:
              - rev: 1-f1363da19c65a9928ecce76a74a63bb8
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::ARCH::2E365330-46EB-4841-9ECC-431474D2BE8A
              - rev: 1-835f0c80fe9b8705f956a73a8d058320
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::ACTI::5E35C3E8-2D61-4BB9-BD84-0A09723E87F1
              - rev: 2-8d65daf913586207660d2570ee587970
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::LGUS
              - rev: 3-b376e2514217166c2ae6de972d603db8
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL
              - rev: 1-335ee730cde9c14ab513ebdbf9e4a733
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FOD::TOMYUNDERWRITING::ALL
  /api/risks/{riskID}/withdrawFirmOrder:
    post:
      summary: Withdraw a firm order from an underwriter - Broker Only
      description: Retract a request for a written line. A firm order can only be withdrawn before the underwriter writes a line.
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the firm order, starting with 'IC' and ending in '::FO'
        example: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO
      requestBody:
        description: The payload required varies by contract type and whether it is sectioned. See below for examples.
        required: true
        content:
          application/json:
            examples:
              Open Market/Facility:
                description: Unsectioned Open Market or Facility Agreement
                value:
                - channel: tomyunderwriting_ALL
              Sectioned Open Market/Facility:
                description: Sectioned Open Market or Facility Agreement
                value:
                - channel: tomyunderwriting_ALL
                  sectionID: '1'
              Declaration:
                description: Unsectioned Declaration
                value:
                - channel: tomyunderwriting_ALL
                  associatedFacilityID:
                    facilityID: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
              Sectioned Declaration:
                description: Sectioned Declaration
                value:
                - channel: tomyunderwriting_ALL
                  associatedFacilityID:
                    facilityID: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
                  sectionID: '1'
            schema:
              type: array
              items:
                type: object
                properties:
                  channel:
                    type: string
      responses:
        '200':
          description: successfully withdrew Firm Order
          content:
            application/json:
              example:
              - rev: 1-f1363da19c65a9928ecce76a74a63bb8
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::ARCH::2E365330-46EB-4841-9ECC-431474D2BE8A
              - rev: 1-835f0c80fe9b8705f956a73a8d058320
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::ACTI::5E35C3E8-2D61-4BB9-BD84-0A09723E87F1
              - rev: 2-8d65daf913586207660d2570ee587970
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::LGUS
