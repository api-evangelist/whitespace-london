  /bodapi/risks/from:
    post:
      tags:
      - Risks
      summary: Create a new risk/template using the Contract Library
      description: Uses blockIDs (The IDs of line items in the contract Library) to create a new risk or template. Currently you can grab these blockIDs by going through the process to create the contract in the UI Contract Library. Just before you publish it, you also get access to the 'API Call Preview' button which opens a window showing the exact payload needed to perform the same creation via API.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blockIDs:
                  type: array
                  items:
                    type: string
                    description: The ID of the Library block (line item) you want to use
                    example: Bod::8D4D3C79-0BFF-4C43-BBD7-D4177E5B884D::BB
                layoutID:
                  type: string
                  description: Optional. The ID of the Library layout guide (contract structure outline) you want to use
                  example: Bod::BA8E6129-7257-491F-B3D6-4FFA920A8569::LD
      parameters:
      - in: query
        required: true
        name: UMR
        description: Unique market reference (required if creating a risk, but optional for a template)
        example: B123123123123
        schema:
          type: string
      - in: query
        required: true
        name: insuranceType
        description: Type of insurance
        schema:
          type: string
          enum:
          - Insurance
          - Reinsurance
      - in: query
        required: true
        name: contractType
        description: Type of contract
        schema:
          type: string
          enum:
          - Open Market/ Declaration
          - FacilityAgreement
      - in: query
        required: true
        name: mode
        description: Is this a facility agreement?
        schema:
          type: string
          enum:
          - normal
          - facility
      - in: query
        required: true
        name: insuredName
        description: Name of the insured
        schema:
          type: string
          example: Acme Widgets Inc
      - in: query
        required: true
        name: teamChannel
        description: Whitespace team channel name
        example: lloydsbroker_AVIATION
        schema:
          type: string
      - in: query
        required: true
        name: placementType
        description: Is the contract a template or a risk?
        schema:
          type: string
          enum:
          - FullContract
          - Template
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: string
                    example: IC0000000-000-00
                  rev:
                    type: string
                    description: Revision number of the newly created Risk
                    example: 1-K23K2J2JL323IEOW
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/editLineItemWithBB:
    post:
      tags:
      - Risks
      summary: Add or edit a heading in a risk using a lineitem from the Clause Library
      description: Similar to the /editLineItem call except you use the bodleyID of the library line item rather than fill out the details of the line item yourself
      parameters:
      - in: path
        name: riskID
        required: true
        schema:
          type: string
          description: The unique ID of the risk document, starting with IC and having parts delimited by '::'
          example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
      requestBody:
        description: Data specifying the line item update
        required: true
        content:
          application/json:
            schema:
              properties:
                op:
                  type: string
                  description: select whether to insert or edit a line item in the risk
                  enum:
                  - insert
                  - edit
                rev:
                  type: string
                  description: the revision number of the risk document
                  example: 3-7984cfdf73dfca82ccd1178ec066b005
                index:
                  type: number
                  description: the index number of the risk line item to be changed
                  example: 6
                bodleyID:
                  type: string
                  description: the bodleyID of the Library line item you want to add
                  example: Bod::A0DAC989-CF7A-4D2C-9BA0-DE6EE5AB2460::BB
      responses:
        '200':
          description: successfully edited/added line item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RWPlacing'
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/recordLine:
    post:
      tags:
      - Risks
      summary: Record an off-platform line - Broker Only
      description: <p>You can use this call to record a line for an off-platform company on 'FullContracts' OR for an off-platform team of a live company on an off-platform contract.</p> <p>You can use an existing stamp or, for an off-platform carrier, create a new stamp yourself. If you want to use an existing stamp for an off-platform carrier, you can grab the list of existing stamps by calling /documents/{docID}, where docID in this case is Extra-{companyId}.</p> <p>Always set saveStamps as False.</p> <p>There are number of stamp types you can choose but for now via API we are only allowing nonBureau stamps. See example below</p>
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the Firm Order or Bindable Quote
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
      requestBody:
        content:
          application/json:
            examples:
              Non Bureau Stamp:
                description: Non-bureau stamp
                value:
                  _rev: 2-e61bf2c6aa5ff799b4e4e17b57c003ee
                  items:
                  - lines:
                    - sectionIDs: []
                      impressions:
                      - references:
                        - reference: AFFFFF
                          riskCodes: ''
                        writtenPercentage: '12'
                        stampID: ''
                        bureauMarket: ''
                        businessUnit: Non Bureau MGA Example
                        bureauMarketCode: ''
                        bureauSubMarket: ''
                        stampType: other
                        shortName: Non Bureau 5123
                        category: NonBureauMGA
                        splitStampData:
                        - code: '61232131'
                          pseudonym: ''
                        coverholder: false
                      conditions:
                        lineConditions: []
                        subjectivities: []
                      leadUnderwriter: false
                      writtenDate: 1748003486
                    uwrChannel: offlineberkshirehathaway_ALL
                    saveStamps: true
            schema:
              type: object
              properties:
                _rev:
                  type: string
                  example: 2-7066db9d64dbbe1dbf2a531bd33bf631
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            sectionIDs:
                              type: array
                              items:
                                type: string
                                example: 1
                            impressions:
                              type: array
                              items:
                                type: object
                                properties:
                                  references:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        reference:
                                          type: string
                                          example: DSFSDFSDF
                                        riskCodes:
                                          type: string
                                          example: ''
                                  writtenPercentage:
                                    type: string
                                    example: '100'
                                  stampID:
                                    type: string
                                    example: ST610A6AE7-A17F-47DE-9894-42B16B843733
                                  bureauMarket:
                                    type: string
                                    example: Lloyd''s
                                  businessUnit:
                                    type: string
                                    example: Lloyd''s Underwriter Syndicate No. 6543 BLE
                                  bureauMarketCode:
                                    type: string
                                    example: '6543'
                                  bureauSubMarket:
                                    type: string
                                    example: ''
                                  stampType:
                                    type: string
                                    example: lloyds
                                  shortName:
                                    type: string
                                    example: ''
                                  mirrorStampsData:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        references:
                                          type: array
                                          items:
                                            type: string
                                            example: FSDFSDF
                                        businessUnit:
                                          type: string
                                          example: Blenheim Underwriting Limited
                                        bureauMarket:
                                          type: string
                                          example: XIS
                                        bureauMarketCode:
                                          type: string
                                          example: B1234
                                        bureauSubMarket:
                                          type: string
                                          example: ''
                                        stampID:
                                          type: string
                                          example: ST4F172B8C-4860-49A3-B140-A17B804D220A
                                        stampType:
                                          type: string
                                          example: other
                                        shortName:
                                          type: string
                                          example: ''
                                        mirrorStampCustomDescription:
                                          type: string
                                          example: Custom
                            conditions:
                              type: object
                              properties:
                                lineConditions:
                                  type: array
                                  items: {}
                                  description: details of any line conditions
                                subjectivities:
                                  type: array
                                  items: {}
                                  description: details of any no deadline subjectivities
                            leadUnderwriter:
                              type: boolean
                              description: are they the lead underwriter or not
                            writtenDate:
                              type: integer
                              example: 1747654790
                              description: Date in unix epoch time
                      uwrChannel:
                        type: string
                        example: offlineblenheimsyndicate_ALL
                      saveStamps:
                        type: boolean
                        description: Choose whether to save a stamp. Only works for off-platform entities.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
  /api/risks/{riskID}/forwardAsQuoteRequest:
    post:
      summary: Forwards a quote as a new quote request - Broker Only
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The ID of the quote to forward. The POST payload has several optional parameters -- 'userId' specifies the uniqueID of a specific user to show the draft to, 'messages' includes a broker''s message with the contract, and 'attachments' identifies attachments to share with the request.
        example: ICD57AF686-6EB7-4D6B-A43A-5978F2C2681F::MU999AF919-3FDB-49F2-B4C5-D42614B02E70::UQ1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  description: The carrier team to send the quote request to. All uppercase, no spaces
                  example: MARINEHULL
                companyId:
                  type: string
                  description: The carrier company to send the quote request to. All uppercase, no spaces
                  example: WHITECLIFFS
                userId:
                  type: string
                  description: Optional -- include the MU identifier of an individual underwriter to send the quote request to them specifically
                  example: MUD10D799A-7AEB-4F84-A4D9-9FDA73D057DE
                facilityID:
                  type: string
                  description: Required if the risk is a declaration. Specifies the facility agreement that the quote request is being shown under.
                  example: ICCDA7C650-47DB-40E5-B8C0-588867E6BB6D
                messages:
                  type: array
                  description: Optional -- include to send an accompanying broker''s message
                  items:
                    type: object
                    properties:
                      channel:
                        type: string
                        description: The receipient''s channel ID
                        example: whitecliffs_MARINEHULL
                      elements:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                              example: Please agree
                              description: The body of the message
                            index:
                              type: integer
                              example: 0
                      greeting:
                        type: string
                        example: Hello
                        description: The header text of the message
                      closing:
                        type: string
                        example: Best regards
                        description: The footer text of the message
                attachments:
                  type: array
                  description: Optional -- include to specify the attachment/s to share along with the quote request
                  items:
                    type: object
                    properties:
                      attachID:
                        type: string
                        example: A-77C8A342-DCDA-410B-9292-B3CD3105FC10
                        description: The ID of the attachment
                      docID:
                        type: string
