  /api/risks/{riskID}/completeEndorsement:
    post:
      tags:
      - Risks
      summary: Complete a Endorsement and bind any notify parties to it - Broker Only
      description: This endpoint can only be used once the Leader and any agreement parties on the endorsement (if they exist) have agreed to it. The normal payload accompanying the endorsement ID is just a blank object, but it can be used to share attachments with notify parties.
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the Endorsement
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::SIGNED::EN1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      docID:
                        type: string
                        example: IC6FD42DF7-989A-4AB4-8638-1EB5870E70CD::ATCH::A-68FDB77D-B32B-40CB-A6CC-258544DB0502
                        description: the docID of the attachment
                      attachID:
                        type: string
                        description: the attachmentID of the attachment
                        example: A-68FDB77D-B32B-40CB-A6CC-258544DB0502
                      channels:
                        type: array
                        description: the channels of the notify parties to share the attachment with
                        items:
                          type: string
                          example: whitesails_ALL
      responses:
        '200':
          description: successfully completed Endorsement
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Endorsement Completed
                    description: a message indicating success
  /api/sections/{rootID}/save:
    post:
      summary: Saves an array of section identifiers for the risk - Broker Only
      description: Called by the broker in specifying the sections that apply. Note that the data can be fetched via /api/documents/$RootID::MS or alongside other data via /api/overview/$RootID
      tags:
      - Sections
      parameters:
      - in: path
        name: rootID
        schema:
          type: string
        required: true
        description: The first part of the riskID, starting IC and stopping before any '::' delimiters
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      requestBody:
        description: JMRC object
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  index:
                    type: number
                    example: 2
                    description: index, starting at 1, to set the order of the sections
                  multiSectionId:
                    type: string
                    example: '2'
                    description: numeric title for the section, for when space is short
                  multiSectionName:
                    type: string
                    example: Cargo
                    description: textual title for the section
            examples:
              normal:
                value:
                - index: 1
                  multiSectionId: '1'
                  multiSectionName: Hull
                - index: 2
                  multiSectionId: '2'
                  multiSectionName: Cargo
                - index: 3
                  multiSectionId: '3'
                  multiSectionName: Liability
      responses:
        '200':
          description: Successful response contains document id and revision
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: the document ID for the section document, being $RootID::MS
                      example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::MS
                    rev:
                      type: string
                      description: the revision for the section document
                      example: 1-98bbeb9b566269e39f14a2f59bc489c2
                    ok:
                      type: boolean
                      description: true if the data was saved
                      example: true
  /api/shared/corporate:
    get:
      summary: List of all companies operating on the platform, with teams and users
      description: <p>Note that the users' email addresses are removed for reasons of data protection.</p> <p>This list can be loaded and cached for reference purposes, with a periodic refresh.</p>
      tags:
      - Shared
      responses:
        '200':
          description: array of Company objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorporateDetail'
  /api/shared/compressedCorporate:
    get:
      summary: Returns the full list of corporate data in a compressed format
      description: <p>Please note that to perform the compression, the API call requires the Accept-Encoding header with the value 'deflate'.</p> <p>This list can be loaded and cached for reference purposes, with a periodic refresh.</p>
      tags:
      - Shared
      parameters:
      - name: Accept-Encoding
        in: header
        required: true
        schema:
          type: string
          enum:
          - deflate
        example: deflate
      responses:
        '200':
          description: Array of Company objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorporateDetail'
  /api/shared/corporate/memberStates:
    get:
      summary: List of values for the state of a member
      tags:
      - Shared
      responses:
        '200':
          description: reference array of values for a mamber's current state
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                - Draft
                - Live
                - Suspended
                - Digitiser
                - ReadOnly
