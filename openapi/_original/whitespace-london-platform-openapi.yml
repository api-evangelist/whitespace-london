  /api/risks/{riskID}/changeHeadings:
    post:
      summary: Delete contract headings from a risk.
      description: To delete one or more contract headings, use the Delete array in the request and leave the Insert and Modify arrays blank. Please note that certain headings, such as UMR, cannot be deleted.
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk, starting IC and having parts delimited by '::'
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                insert:
                  type: array
                  items:
                    type: string
                  description: Leave blank
                delete:
                  type: array
                  description: The index numbers of the headings to be deleted.
                  items:
                    type: number
                    example: 5
                modify:
                  type: array
                  description: Leave blank
                  items:
                    type: string
                _rev:
