        associatedPlacingID:
          type: string
          example: IC006DD9DA-A6EF-4320-BD23-C12D845282FF::FO
          description: The Unique ID of the Firm Order that this line guidance applies to
        _id:
          type: string
          description: The unique ID of this document
          example: IC006DD9DA-A6EF-4320-BD23-C12D845282FF::FO::CATANIA::ALL::LGUS
        _rev:
          type: string
          description: The revision number of this document
          example: 1-304aa44d6b3231c380ed83bbda5d8f08
        channels:
          type: array
          items:
            type: string
            example: catania_ALL
        Provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        type:
          type: string
          description: The named JMRC type descriptor for this document
          example: RWLineGuidance
    RWNoCoverGivenLinesStorer:
      type: object
      properties:
        _id:
          type: string
          example: IC5FF93255-74CA-4788-A668-0080992DAED9::FO::TOMYUNDERWRITING::ALL::NoCoverGivenLines::D163405E-94AD-4964-881D-B7335827843A
          description: The unique ID of this document
        _rev:
          example: 1-087952cf08f44dae740c1c001e2d5ab2
          type: string
          description: The revision number of this document
        channels:
          type: array
          items:
            type: string
            example: akhil_ALL
            description: The team channel names of the users who can see the risk that this document relates to
        createdAt:
          type: string
          example: '2024-02-21 15:05:47'
          description: The creation time of this document in YYYY-MM-DD HH:MM:SS format
        line:
          type: array
          items:
            $ref: '#/components/schemas/RWQuotedLine/properties/line/items'
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        type:
          type: string
          description: The JMRC type of this document. Always RWNoCoverGivenLinesStorer
          example: RWNoCoverGivenLinesStorer
        updatedAt:
          type: string
          example: '2024-02-21 15:05:47'
          description: The date and time that this document was last updated in YYYY-MM-DD HH:MM:SS format
        isValid:
          type: boolean
          example: true
          description: False if the broker rejects the no cover given line
        associatedFirmOrderDocID:
          type: string
          example: ICD0645233-E126-4768-AB15-0A8828F5F08C::FO::TOMYUNDERWRITING::ALL
          description: The unique ID of the RWPlacing document describing the firm order this no cover given line was written in response to
      required:
