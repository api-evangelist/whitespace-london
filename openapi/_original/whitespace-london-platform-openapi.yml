  /api/risks/{riskID}/writeLine:
    post:
      summary: Writes a line to the risk - Underwriter Only
      description: <p>The payload must include one stamp detailed as line percentage, year and stamp ID, with references. It can optionally include section ID references, multiple stamps, and details of line conditions or subjectivities.</p>
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk's firm order, starting with IC and having parts delimited by '::FO::{COMPANYID}::{TEAMID}'
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO::TOMYUNDERWRITING::MARINE
      requestBody:
        description: JSON payload
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                _rev:
                  type: string
                  description: The system-generated version number of the firm order for the line to be written to. The number before the - is generated sequentially, starting at 1'
                  example: 1-a302cd4445e3d12c33fdabf467e2789b
                line:
                  type: object
                  properties:
                    sectionIDs:
                      type: array
                      description: The section number of the risk that the written line applies to.
                      items:
                        type: string
                        example: '1'
                    impressions:
                      type: array
                      items:
                        type: object
                        properties:
                          writtenPercentage:
                            type: string
                            description: The percentage of the risk to write as a line. This must meet the line guidance in the firm order.
                            example: '60'
                          stampID:
                            type: string
                            description: The document ID of the stamp to be used in writing the line, beginning with ST. A company''s stamp list can be retrieved using /documents/Corporate-{companyID}
                            example: ST1843A345-1F69-435D-84E9-187BB3DD0F23
                          yearOfAccount:
                            type: string
                            description: The year of accounting for the line. Only needed for the lead line.
                            example: '2022'
                          references:
                            type: array
                            items:
                              type: object
                              properties:
                                reference:
                                  type: string
                                  description: The underwriter''s reference code for the line.
                                  example: 22FB238273XX
                                riskCodes:
                                  type: string
                                  description: The category code describing the subject of the line.
                                  example: H3
                                description:
                                  type: string
                                  description: A free text comment field for the line.
                                  example: Ref:0023
                          mirrorStampData:
                            type: array
                            items:
                              type: object
                              properties:
                                mirrorStampReferences:
                                  type: array
                                  description: the mirror stamp reference code
                                  items:
                                    example: 22FB238
                                mirrorStampDescriptions:
                                  type: array
                                  description: A free text comment field for the mirror stamp.
                                  items:
                                    example: REF:025
                                    type: string
                                mirrorStampID:
                                  type: string
                                  example: STDECAA286-05B2-4FEA-942E-09A3EC352030
                                  description: The document ID of the stamp to be used as a mirror, beginning with ST. A company''s stamp list can be retrieved using /documents/Corporate-{companyID}
                                mirrorStampCustomDescription:
                                  type: string
                                  example: Applying to EEA risks
                                  description: The text description of the cover associated with the mirror stamp.
                    conditions:
                      type: object
                      properties:
                        lineConditions:
                          type: array
                          description: The set of line conditions added by the underwriter
                          items:
                            type: string
                            example: Line To stand
                        subjectivityMode:
                          type: string
                          enum:
                          - unchosen
                          - holdingCover
                          - noCoverGiven
                          description: Whether the line provides ongoing cover while the specified subjectivity requirements are being agreed
                        subjectivities:
                          type: array
                          description: Details of subjectivity requirements added by the underwriter
                          items:
                            type: object
                            properties:
                              deadline:
                                type: string
                                example: '1708560000.0'
                                description: The deadline for accepting the subjectivity response, in unix epoch time
                              identifier:
                                type: string
                                example: ''
                                description: The uniqueID of the subjectivity. Leave blank, as the platform will auto-generate this
                              text:
                                type: string
                                example: Sample Subjectivity
                                description: Text detailing the requirement of the subjectivity
                        subjectivitiesDeadlineNotRequired:
                          type: string
                          description: Text detailing any subjectivity requirements which do not have a deadline
            examples:
              simple:
                value:
                  _rev: 1-1fb5b6812cb938636e5b1a3de968ce6a
                  line:
                    sectionIDs: []
                    impressions:
                    - references:
                      - reference: 22FB238273XX
                        riskCodes: X1
                        description: Ref:0023
                      writtenPercentage: '100'
                      stampID: ST1843A345-1F69-435D-84E9-187BB3DD0F23
                      yearOfAccount: '2022'
                    conditions:
                      lineConditions: []
                      subjectivities: []
              conditionsAndSubjectivities:
                value:
                  _rev: 1-0f9d0731df4d917b0daba4974b7a647e
                  line:
                    sectionIDs: []
                    impressions:
                    - references:
                      - reference: LINECONSSUBS
                        riskCodes: ''
                        description: ''
                      writtenPercentage: '100'
                      stampID: ST1843A345-1F69-435D-84E9-187BB3DD0F23
                      yearOfAccount: '2022'
                    conditions:
                      lineConditions:
                      - LINE TO STAND
                      - COPY POLICY WORDING
                      subjectivityMode: holdingCover
                      subjectivities:
                      - approvedStatus: notYetResponded
                        text: Survey required
                        deadline: '1661295600'
                        identifier: ''
                      deadlineNotRequired: All claims to be filed electronically.
              mirrorStamps:
                value:
                  _rev: 5-14d501d94a1160c1f6b151633afd733f
                  line:
                    sectionIDs: []
                    impressions:
                    - references:
                      - reference: SADASD
                        riskCodes: ''
                        description: ''
                      mirrorStampData:
                      - mirrorStampReferences:
                        - DSDSAD
                        mirrorStampDescriptions:
                        - ''
                        mirrorStampID: STDECAA286-05B2-4FEA-942E-09A3EC352030
                        mirrorStampCustomDescription: Applying to EEA risks
                      writtenPercentage: '100'
                      stampID: STDCEB5FD2-E54C-4596-B0D8-4C50B63F27BA
                    conditions:
                      lineConditions: []
                      subjectivities: []
              multipleStamps:
                value:
                  _rev: 3-e745086500eb2da786bb628b8d62dd4e
                  line:
                    sectionIDs: []
                    impressions:
                    - references:
                      - reference: REF1
                        riskCodes: ''
                        description: ''
                      writtenPercentage: '50'
                      stampID: STDCEB5FD2-E54C-4596-B0D8-4C50B63F27BA
                    - references:
                      - reference: REF2
                        riskCodes: ''
                        description: ''
                      writtenPercentage: '50'
                      stampID: STDECAA286-05B2-4FEA-942E-09A3EC352030
                    conditions:
                      lineConditions: []
                      subjectivities: []
      responses:
        '200':
          description: successfully written lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Wrote line.
                    description: Success is confirmed by the message 'Wrote line.'
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/newDraft:
    post:
      tags:
      - Risks
      summary: Creates a draft risk using a simplified input format - Broker Only
      parameters:
      - in: query
        name: teamChannel
        required: true
        schema:
          type: string
        description: The team channel where the new Draft Risk is to be created. This string always takes the format "company_DEPARTMENT" and a full list of available channels for a user can be seen in the response to a GET request to /api/user/myDetails. This value is the equivalent of selecting a Team in the "Create for Team" dropdown box when creating a new Risk in the web UI
      requestBody:
        description: <p>An array of simplified line items. Note that each should have either text, for a single line, or array for several paragraphs. Dates, amounts etc will be picked out as placeholders if they follow our conventions. If both are supplied the array takes precedence.</p>
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  heading:
                    type: string
                    description: the heading for the line item
                    example: Insured
                  text:
                    type: string
                    description: a single line of text for the line item detail
                    example: GBP 250,000
                  array:
                    type: array
                    description: one line per paragraph for the line item detail
                    items:
                      type: string
                    example:
                    - From 1 April 2020
                    - To 31 March 2021
            example:
            - heading: UMR
              text: B0999JC0212211614
            - heading: Insured
              text: Swagger Widgets Inc
            - heading: Contract Type
              text: Cyber Insurance
            - heading: Period
              array:
              - From 1 April 2021
              - To 31 March 2022
            - heading: Premium
              text: USD 25,000
            - heading: Limit of Liability
              text: USD 40,000,000
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                id: IC4F06B6BD-20EE-41BC-87F7-1292B7750C9B
                rev: 1-141df67df9e5eaacd0830c65e47a0bf9
                ok: true
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/root/{rootID}:
    get:
      tags:
      - Risks
      summary: Get a list of documents associated with a risk
      parameters:
      - in: path
        name: rootID
        schema:
          type: string
        required: true
        description: 'The root ID of the risk, stopping before the :: suffix'
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::QR1
                      description: The full ID of the document
                    type:
                      type: string
                      example: RWPlacing
                      description: The type of the document, which will always be RWPlacing
                    channels:
                      type: array
                      items:
                        type: string
                      description: The channels of the user teams that can see the document
                      example:
                      - ajc_ALL
                      - messina_ALL
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{rootID}/related/{type}:
    get:
      tags:
      - Risks
      summary: returns documents of a certain type for a risk
      parameters:
      - in: path
        name: rootID
        schema:
          type: string
        required: true
        description: 'The root ID of the risk, stopping before the :: suffix'
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      - in: path
        name: type
        schema:
          type: string
        required: true
        description: The document type to be fetched, for instance RWComment, RWLineGuidanceSet, RWWrittenLineSet, RWSignedLineSet
        example: RWComment
      responses:
        '200':
          description: An array of documents for the required type
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: documents of the specified type
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
