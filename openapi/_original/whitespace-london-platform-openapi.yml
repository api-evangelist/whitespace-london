                description: The maximum requested line percentage
              minString:
                type: string
                example: '30'
                description: The minimum requested line percentage
              suggestedStamps:
                $ref: '#/components/schemas/CorporateDetail/properties/stamps/items'
              role:
                description: Facility participation role
                type: string
                enum:
                - leader
