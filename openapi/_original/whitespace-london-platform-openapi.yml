              examples:
                ACORDGPM:
                  description: Note that some of the tag values in the ACORDGPM tagset have a prefix of ACORDGPM and a suffix without underscores
                  value:
                    definedData:
                    - originalHeading: Contract Type
                      mrcHeading: ContractType
                      parentID: ICA18B8998-6A42-45EF-BD9F-F8F58B182B99::DR1
                      tag: Insurance_Type
                      controlled: true
                      section: RiskDetails
                      value: Insurance
                    - originalHeading: Unique Market Reference
                      mrcHeading: UMR
                      parentID: ICA18B8998-6A42-45EF-BD9F-F8F58B182B99::DR1
                      tag: ACORDGPM:BrokerIdentification
                      controlled: true
                      section: RiskDetails
                      value: '1312'
                    - originalHeading: Unique Market Reference
                      mrcHeading: UMR
                      parentID: ICA18B8998-6A42-45EF-BD9F-F8F58B182B99::DR1
                      tag: ACORDGPM:BrokerIdentificationAgency
                      value: Lloyd's of London
                      section: RiskDetails
                      controlled: true
                    metadata:
                      userID: MU9FCFC64E-7694-420A-BE61-2ABEDB3E8F52
                      tagSet: ACORDGPM
                      fetchedAt: '2023-11-27 10:01:02'
                      documentID: ICA18B8998-6A42-45EF-BD9F-F8F58B182B99::DR1
                      env: apitest
