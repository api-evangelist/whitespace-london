  /api/risks/{riskID}/applyTemplate:
    post:
      tags:
      - Risks
      summary: Merge the data from a risk with the text, data and other material from a template, preserving all the risk''s data while replacing all its other content - Broker Only
      description: You need the ID and current revision number of both the risk and the template you are trying to merge. You can fetch the revision number of a risk with /risks/{riskID} and check the ._rev field. Can only be done on a risk stage that has not been shown to underwriters.
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk
