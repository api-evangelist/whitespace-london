  /api/risks/{riskID}/lineitem/{mrcHeading}:
    get:
      summary: Gets the line item by index, or all line items for a specified heading
      description: The final parameter can be a numeric index, or a specific heading such as Period, Premium etc. <p/> The endpoint /api/lookup/headings gives list of the available headings. <p/> Note that the API returns an array as there could be more than one line item with the chosen heading.
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        required: true
        schema:
          type: string
          description: The unique ID of the risk, starting IC and having parts delimited by '::'
          example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
      - in: path
        name: mrcHeading
        required: true
        schema:
          type: string
          description: Enumerated value for MRC Heading, or a numeric index
          example: ContractType
      responses:
        '200':
          description: array of MRCLineItem
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: The MRCLineItem object, often referred to as 'Line Item', comprises a single contract heading and its associated text and other data.</p><p>Contract headings exist both as the visible heading title shown to the user, known as Original Heading, and as structural pointers in the database. The most important of these pointers are the mrcHeading which links the Line Item back to its purpose (Period, Insured etc) and the mrcSection which associates it with the contract section where it appears. An index controls the ordering. There is also a Name Variation which encapsulates certain agreed alternative terms for the heading, but this is less significant.
                  properties:
                    index:
                      type: integer
                      description: The ordinal position of the line item in the contract, starting from 1. Each index value should be a unique integer, and the values should be continuous across the contract
                      example: 5
                    mrcSection:
                      type: string
                      description: The title of the contract section, taken from an enumerated list
                      enum:
                      - BrokerRemunerationAndDeductions
                      - FiscalAndRegulatory
                      - Information
                      - RiskDetails
                      - SecurityDetails
                      - SubscriptionAgreement
                      - Endorsement
                      - ContractAdministrationAndAdvisory
                      - EndorsementData
                      - RiskAndEndorsementIdentificationDetails
                      - ContractChanges
                      - Agreement
