        type:
          type: string
          example: RWMultiSectionStorer
          description: The named JMRC type descriptor for this document
        associatedRootID:
          type: string
          example: IC43B9B6DA-6CE9-4BE3-A794-4A6DD02AB2A1
          description: The unique rootID of the contract that has been sectioned
    RWLineGuidanceSet:
      type: object
      properties:
        sections:
          type: array
