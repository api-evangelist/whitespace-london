      - _rev
      - line
      - channels
      - createdAt
      - provenance
      - type
      - updatedAt
    RWAttentionWanted:
      type: object
      description: An important event which requires action from a user. This schema holds the base properties of the document. There can be extra properties depending on the type of event.
      properties:
        _id:
          description: The unique ID of this document
          example: IC7B100AFD-BAA8-4B88-AB28-6B0FDA79FD81::AW::1995CA3B-965C-4F5B-AC61-1C2B30C52881
          type: string
        _rev:
          description: The revision number of this document
          type: string
          example: 1-e62b3252fab906502d50c44621920522
        action:
          description: The alert that is being shown
          type: string
          enum:
          - reviseWrittenLine
          - reviseWrittenLinePercentageResponse
          - reviseWrittenLineReferenceResponse
          - respondedToSubjectivity
          - wroteNoCoverGivenLine
          - editedLeadUnderwriterLineItem
          - updatedConditions
          - rejectedSubjectivityResponse
          - requestedSecondApproval
          - withdrawnSecondApproval
          - stampUpdateSubmitted
          - rollbackSignedRisk
          - lineRemovalRequest
          - lineRemovalAccepted
          - lineRemovalRejected
          - lineRemoved
        associatedRiskID:
          description: The unique ID of the risk instance that the alert applies to
          type: string
          example: IC7B100AFD-BAA8-4B88-AB28-6B0FDA79FD81::FO
        associatedRootID:
          description: The RootID of the risk
          type: string
          example: IC7B100AFD-BAA8-4B88-AB28-6B0FDA79FD81
        channels:
          description: The User IDs or team IDs of the users who can see the risk
          type: array
          items:
            type: string
            example: MU9FCFC64E-7694-420A-BE61-2ABEDB3E8F52
        createdAt:
          description: The creation time of this document
          type: string
          example: '2024-02-20 11:08:23'
        hasBeenCleared:
          description: Whether the alert notification has been cleared
          type: boolean
          example: false
        message:
          description: The description of the event triggering the alert
          example: Tony Wheeler has sent this contract for your internal review.
          type: string
        notes:
          description: Any extra notes related to the event
          type: string
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        recipientRole:
          description: The role of the alert recipient, either broker or underwriter
          type: string
          example: broker
        hasBeenRejected:
          type: boolean
          description: Whether the alert has been rejected
          example: false
        type:
          description: The named JMRC type descriptor for this document
          type: string
          example: RWAttentionWanted
        updatedAt:
          description: The date and time that this document was last updated
          type: string
          example: '2024-02-20 11:08:23'
      required:
      - _id
      - _rev
      - action
      - associatedRootID
      - channels
      - createdAt
      - hasBeenCleared
      - message
      - provenance
      - type
      - updatedAt
    RWCorrectionDetails:
      type: object
      properties:
        _id:
          type: string
          example: IC830CD992-A6F2-4C23-80AF-4FE20A14BFF3::CC1::OFFLINEBARANTSRE::ALL::CCD
        _rev:
          type: string
          example: 3-faf17c26015b60f71bd207549838f822
        channels:
          type: array
          items:
            type: string
            example: akhil_ALL
        createdAt:
          type: string
          example: '2024-06-24 11:04:10'
        details:
          type: object
          properties:
            approved:
              type: object
              properties:
                approvedAt:
                  type: string
                  example: '2024-06-24 11:05:54'
                  description: Time when the Contract Correction was approved in UTC
                approvedBy:
                  type: string
                  example: MU9FCFC64E-7694-420A-BE61-2ABEDB3E8F52
                  description: The unique ID of the approving underwriter
            declined:
