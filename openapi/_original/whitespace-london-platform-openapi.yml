          description: A confirmation of the saved data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The document ID of the updated risk.
                    example: IC442C1B93-DE19-4A52-A1D6-E3A4B47C4F6C
                  rev:
                    type: string
                    description: The revision number of the risk.
                    example: 6-50cb52029b9542862e014c296db45ae6
                  ok:
                    type: boolean
                    description: True if the data was saved
                    example: true
        '500':
          description: The data was not acceptable. We recommend calling the /api/v23.09/data/$RiskID/verify POST endpoint first which will report errors more clearly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  reason:
                    type: string
                    example: Something went wrong.
  /api/v23.09/data/{riskID}/tagset/{tagset}:
    get:
      summary: Gets all tagged data for a risk using an alternate set of data tags.
      description: <div>This endpoint returns the Defined Data for a risk using tag field names that are not the default Whitespace tags.</div>
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk
        example: IC442C1B93-DE19-4A52-A1D6-E3A4B47C4F6C
      - in: path
        name: tagset
        schema:
          type: string
