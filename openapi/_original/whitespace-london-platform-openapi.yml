  /api/overview/{rootID}:
    get:
      summary: Fetch documents of certain types related to a risk
      description: <p>This endpoint returns an array where each item is a different document and therefore has different contents from the one before it.</p> <p>The document types included are as listed below. All of them have schemas you can find at the bottom of the page. Note that this is not every  document. It is a set which we have found convenient to present together to give background information on a risk. Note particularly that it does not include the RWPlacing contract wording document.</p> <ul> <li>RWComment</li> <li>RWAttachment</li> <li>RWAttentionWanted</li> <li>RWMultiSectionStorer</li> <li>RWActivity</li> <li>RWEndorsementFollower</li> <li>RWFacilityGuidance</li> <li>RWLineGuidanceSet</li> <li>RWWrittenLineSet</li> <li>RWSignedLineSet</li> <li>RWSubjectivityResponse</li> <li>RWNoCoverGivenLine</li> <li>RWRiskAuthorisationState</li> <li>RWBindableQuoteGuidance</li> <li>RWQuotedLine</li> <li>RWQuotedFacilityGuidance</li> <li>RWBrokerMessage</li> <li>RWMRCValidationResults</li>
        <li>RWCorrectionDetails</li></ul>
      tags:
      - Overview
      parameters:
      - in: path
        name: rootID
        schema:
          type: string
        required: true
        description: The first part of the riskID, starting IC and stopping before any '::' delimiters
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      responses:
        '200':
          description: An array of different documents. In the example, covering 10 documents of 3 types - RWActivity, RWComment and RWLineGuidanceSet
