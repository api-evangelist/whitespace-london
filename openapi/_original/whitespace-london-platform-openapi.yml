  /api/showDeclarationToFacility:
    post:
      summary: Please use the showToFacility Endpoint instead, this is the old version - Broker Only
      description: <p>Options for this call are set via the JSON payload. If the facility has multiple members, then all underwriters must be included in the payload, even if you are not showing the contract to them. Note that the leader must write their line before you can show to agreement parties. When showing to the leader, set the "valueIsLeaderLineGuidance" key to true. This will mark the "value" key-pair as line guidance for the declaration. If this key is not set, "value" will be taken as the percentage of the facility line.
      tags:
      - Show Declaration to Facility
      requestBody:
        description: Data specifying the filters to be applied
        required: true
        content:
          application/json:
            examples:
              Leader Only:
                description: Showing to a leader-only facility. (Please note the "Message" object is optional.)
                value:
                  declarationID: IC97799647-4496-4760-B594-02AC726B0D7E::FO
                  facilityID: ICAAA8E1C7-07AB-49DE-B18C-58CB7661B0E8
                  sections:
                  - carriers:
                      tomyunderwriting_ALL:
                        role: leader
                        show: true
                        suggestedStampIDs: []
                        valueIsLeaderLineGuidance: true
                        value: '100'
                    leader: false
                  messages:
                  - channel: tomyunderwriting_ALL
                    elements:
                    - text: Please Agree
                      index: 0
                    greeting: Hello
                    closing: ''
                  _rev: 5-41117d3f92c39a4b7a957bbd627008e2
              Leader with Followers:
                description: Showing to the leader in a facility with one or more followers. (Please note the "Message" object is optional.)
                value:
                  declarationID: IC97799647-4496-4760-B594-02AC726B0D7E::FO
                  facilityID: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
                  sections:
                  - carriers:
                      offlineacquinex_ALL:
                        role: notifyParty
                        show: false
                        suggestedStampIDs: []
                        value: '12'
                      offlineallianzglobal_ALL:
                        role: agreementParty
                        show: false
                        suggestedStampIDs: []
                        value: '12'
                      offlineallianzuk_ALL:
                        role: agreementParty
                        show: false
                        suggestedStampIDs: []
                        value: '12'
                      tomyunderwriting_ALL:
                        role: leader
                        show: true
                        suggestedStampIDs: []
                        valueIsLeaderLineGuidance: true
                        value: '50'
                    leader: false
                  _rev: 7-27ece7da2a8b88e1c46ea2fbd4f129f1
              Sectioned Facility:
                description: Showing to section 1 in a leader-only facility. NOTE even though you aren''t showing to section 2 of the facility, you still need to provide the information and set show to false.
                value:
                  declarationID: ICC002A9C1-89C9-4B00-9807-4453DFA80853::FO
                  facilityID: ICD77B5FD4-0790-42B9-BC53-65242FB96558
                  sections:
                  - carriers:
                      tomyunderwriting_ALL:
                        role: leader
                        show: true
                        value: '100'
                    leader: false
                    facilitySectionID: '1'
                  - carriers:
                      tomyunderwriting_ALL:
                        role: leader
                        show: false
                    leader: false
                    facilitySectionID: '2'
                  attachments: []
                  _rev: 16-f9a515436bfd93678c1f91b82b2fb737
              Sectioned Declaration:
                description: Showing section 1 of a multi-section risk to a facility
                value:
                  declarationID: IC3394C8E3-6413-4F7D-95A1-050C77D23839::FO
                  facilityID: ICD1C4677F-B1AF-44C6-814A-0C81A761A0A6
                  sections:
                  - carriers:
                      tomyunderwriting_ALL:
                        role: leader
                        show: true
                        value: '100'
                      whitesails_MARINE:
                        role: agreementParty
                        show: false
                        value: '10'
                    leader: true
                    sectionID: '1'
                  - carriers:
                      tomyunderwriting_ALL:
                        role: leader
                        show: false
                      whitesails_MARINE:
                        role: agreementParty
                        show: false
                    leader: false
                    sectionID: '2'
                  messages: []
                  stampVisibility: AllStamps
                  _rev: 5-8c535aa2b11e954021a3e982caa00fac
            schema:
              type: object
              properties:
                _rev:
                  type: string
                  description: the revision number of the declaration
                  example: 1-de9bba4cb8ea75572af90209683166c6
                declarationID:
                  type: string
                  description: The ID of the declaration firm order
                  example: IC9BCF6396-725E-477D-A864-B98BDB240150::FO
                FacilityID:
                  type: string
                  description: The root ID of the facility agreement
                  example: IC1326C845-9E83-4636-A3F2-D6488881AE8D
                attachments:
                  type: array
                  items:
                    type: string
                  example: []
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      carriers:
                        type: object
                        properties:
                          tomyunderwriting_ALL:
                            type: object
                            properties:
                              role:
                                type: string
                                description: role, i.e "leader" or "agreementParty"
                                example: leader
                                enums:
                                - leader
                                - agreementParty
                                - notifyParty
                                - nonNotifyParty
                              show:
                                type: boolean
                                description: whether to show to carrier or not
                                example: true
                              suggestedStampIDs:
                                type: array
                                items:
                                  type: string
                                example: []
                              value:
                                type: string
                                description: a percentage value, as per call description above
                                example: '75'
                              valueIsLeaderLineGuidance:
                                type: boolean
                                description: Whether you want to show the leader their line guidance either as the literal percentage value listed (true), or as a percentage of the leader''s facility line (false). For example if the leader line on the facility is 80% and you show this dec with a value of 50, then if this field is true, the line guidance will be shown as 50% to the leader, but if not then the line guidance to the leader will be 50% of 80%, or 40%.
                          raji_AVIATION:
                            type: object
                            properties:
                              role:
                                type: string
                                description: role, i.e "leader" or "agreementParty"
                                example: agreementParty
                              show:
                                type: boolean
                                description: whether to show to carrier or not
                                example: false
                              suggestedStampIDs:
                                type: array
                                items:
                                  type: string
                                example: []
                              value:
                                type: string
                                description: a percentage value, as per call description above
                                example: '25'
                      leader:
                        type: boolean
                        example: false
                        description: Whether you want the leader of this Facility to be the overall contract/section leader
                      autoCascade:
                        type: boolean
                        description: Set Auto-Cascade to true or false when showing to leader
                        example: false
                      sectionID:
                        type: string
                        example: '1'
                        description: The sectionID of the risk to show to the Facility
                      facilitySectionID:
                        type: string
                        example: '1'
                        description: The sectionID of the Facility you want to show to
      responses:
        '200':
          description: successfully showed Declaration. Multiple doucments will be affected as a result so the response will show all of them
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: ID of the affected document
                      example: IC482AE651-226A-4D5B-9F04-7ACEAB8377F9::FO
                    rev:
                      type: string
                      example: 7-910378b8f2fdfc1093ee630ef3ef9810
                      description: the new revision of the affected document
  /api/user/colleagues:
    get:
      summary: List of all colleagues on the Corporate for the user
      description: <p>Note adding e.g. /Live to the URL lists those in a particular state
      tags:
      - User
      responses:
        '200':
          description: list of other users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorporateDetail/properties/members/items'
  /api/user/colleagues/{state}:
    get:
      summary: List of all colleagues on the Corporate for the user in a particular state
      tags:
      - User
      parameters:
      - in: path
        name: state
        schema:
          type: string
        required: true
        description: Live, Draft, Suspended etc
        example: Live
      responses:
        '200':
          description: list of other users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorporateDetail/properties/members/items'
  /api/user/myDetails:
    get:
      tags:
      - User
      summary: gets information about the logged-in user
      responses:
        '200':
          description: information about the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  companyId:
                    type: string
                    description: unique uppercase short name for the user's company
                    example: BLACKPOOL
                  username:
                    type: string
                    description: email address for the user
                    example: sarah.klau.blackpool@wspt.co.uk
                  companyName:
                    type: string
                    description: full name for the user's company
                    example: Blackpool Broking Ltd
                  uniqueID:
                    type: string
                    description: unique code, starting MU, which identifies the user
                    example: MU5F640CA3-FEEF-4E18-BAA0-EB9375824F68
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: team name
                          example: Marine Risks excl Liability
                        teamId:
                          type: string
                          description: uppercase short name for the team, used elsewhere as an identifier
                          example: MARINE
                        channel:
                          type: string
                          description: combination of lowercase companyId then teamId
                          example: blackpool_MARINE
  /api/version:
    get:
      summary: Version message for the latest build of the API library
      tags:
      - Version
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  revapiCommit:
                    type: string
                    description: commit of the api library
                    example: 7ace78cb91d72b7fba303ebe50cb0c1e720abd61
                  buildDate:
                    type: string
                    description: timestamp of the build
                    example: 2021-11-22@22:23:10
                  revapiCommitMessage:
                    type: string
                    description: commit message
                    example: Merge pull request 112
                  riskLibraryCommit:
                    type: string
                    description: commit of the underlying business logic library
                    example: 7ace78cb91d72b7fba303ebe50cb0c1e720abd61
          description: Version message for the latest build of the API library
servers:
- description: Sandbox Environment
  url: https://sandbox.whitespace.co.uk/
- description: Tess Environment
  url: https://tess.whitespace.co.uk/
- description: Beta Environment
  url: https://beta.whitespace.co.uk/
- description: Staging Environment
  url: https://staging.whitespace.co.uk/
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Session token is either missing or invalid for the selected server
  schemas:
    ApprovedCarrierList:
      type: object
      properties:
        enabled:
          type: boolean
          description: Usually true, false allows the entire list to be suppressed
          example: true
        carriers:
          type: array
          description: A list of the approved carriers
          items:
            type: object
            properties:
              active:
                type: boolean
                description: Usually true, false allows the carrier to be suppressed temporarily or permanently
                example: true
              companyID:
                type: string
                description: Uppercase unique company ID for the carrier
                example: ACMEUNDERWRITING
              notes:
                type: string
                description: Optional notes about the status of the carrier
                example: TOBA since January 2021
              canSeeExtendedData:
                type: boolean
                example: true
                description: Whether the carrier can see a Q&A Extended Data Questionnaire on the risk if one is present
              approvedStamps:
                type: array
                items:
                  type: object
                  properties:
                    approved:
                      type: boolean
                      example: true
                      description: Whether the stamp is approved or not
                    stampID:
                      type: string
                      description: The ID of a stamp
                      example: ST0366B6B0-E2FD-44CC-AE40-6D5E6F50A08E
        companyID:
          type: string
          description: the unique uppercase ID of the broker
          example: BLACKPOOL
        channels:
          type: array
          description: array with just one item, the company shared channel
          items:
            type: string
            description: the companyID in lowercase followed by _COMPANY_SHARED
            example: blackpool_COMPANY_SHARED
        type:
          type: string
          description: must be RWApprovedCarrierList
          example: RWApprovedCarrierList
        _id:
          type: string
          description: 'the document name, being ACL:: followed by the broker company ID'
          example: ACL::BLACKPOOL
    CorporateDetail:
      type: object
      properties:
        admins:
          type: array
          description: List of user emails for administrators at the company
          items:
            type: string
            example: sarah.kay.blackpool@wspt.co.uk
        updatedAt:
          type: string
          description: The date and time the company's details were last updated
          example: '2020-02-24T15:32:50.000Z'
        teams:
          type: array
          items:
            type: object
            properties:
              teamId:
                type: string
                description: Team identifier using uppercase letters with no punctuation
                example: MARINECARGO
              secondApprovalReviewers:
                type: array
                items:
                  type: string
                  description: Deprecated (see permissions array below). This array will always be empty. Formerly held userIDs of users with Internal Reviewer permission
                  example: '-'
              secondApprovalSelfApprovers:
                type: array
                items:
                  type: string
                  description: Deprecated (see permissions array below). This array will always be empty. Formerly held userIDs of users with Self-Approver permission
                  example: '-'
              name:
                type: string
                description: The name of the team, usually relating to the class of business worked on
                example: Marine Cargo
              channel:
                type: string
                description: The system channel for the team, comprising a lowercase version of the company ID, followed by underscrore and the team id
                example: blackpool_MARINECARGO
              isInactive:
                type: boolean
                example: false
                description: True if the team has been marked as inactive
              classOfBusiness:
                type: array
                items:
                  type: string
                  example: Marine
                  description: The class(es) of business that are associated with the team
        createdAt:
          type: string
          description: Time and date of creation
          example: '2020-02-24 15:32:50'
        companyId:
          type: string
          description: Company identifier using uppercase letters with no punctuation
          example: OFFLINEBRITISHMARINE
        isTestOnly:
          type: boolean
          description: True if the company account is just a test account with no live database access
          example: false
        channels:
          type: array
          description: Array with just one item, shared channel
          items:
            type: string
            description: The value 'shared'
            example: shared
        stamps:
          type: array
          description: For (re)insurers, lists the stamps they have set up on the system. Empty for brokers
          items:
            type: object
            properties:
              bureauMarket:
                type: string
                example: Lloyd's
              bureauMarketCode:
                type: string
                example: '1444'
              bureauSubMarket:
                type: string
                example: PSM1
              businessUnit:
                type: string
                example: Lloyd's Syndicate No.1444
              stampType:
                type: string
                example: lloyds
              uniqueID:
                type: string
                example: ST1843A345-1F69-435D-84E9-187BB3DD0F23
        buttonStamps:
          type: object
          properties:
            active:
              type: boolean
              example: true
              description: True if the button stamp is available for users to apply
            bureauMarketCode:
              type: string
              example: 5307/5
            companyName:
              type: string
              example: Tomy
            iconOnStamp:
              type: boolean
              description: True if an icon of any type is shown on the stamp, icon type is specified by stampType
              example: true
            layout:
              type: object
              description: The placement of name, type, and code data on the button stamp, each appearing once across the bottom, center, and top slots of the stamp
              properties:
                bottom:
                  type: string
                  enum:
                  - name
                  - type
                  - code
                center:
                  type: string
                  enum:
                  - name
                  - type
                  - code
                top:
                  type: string
                  enum:
                  - name
                  - type
                  - code
            stampID:
              type: string
              example: BTN-BAB19551-5557-4E6B-888B-E3B1B6A0E982
              description: The unique ID of the button stamp, which always starts with BTN
            stampType:
              type: string
              description: The type of icon displayed on the stamp. Note that other indicates no icon
              enum:
              - lloyds
              - brexit
              - other
        settings:
          type: object
          properties:
            canViewOfflineTeams:
              type: boolean
              description: True if the broking organisation is configured to save off-platform lines
              example: false
            mandatoryAuthStages:
              type: array
              items:
                type: string
                description: The list of contract stages at which second approval is required before a contract can proceed
                example: brFirmOrder
            digitiseOnlyToTemplate:
              type: boolean
              example: true
              description: True if the broking organisation can only digitise imported contract files as templates
        isOffline:
          type: boolean
          description: True for company accounts that are offline placeholders for organisations not yet using the platform
          example: false
        _id:
          type: string
          description: Reference ID for this company document
          example: Corporate-BLACKPOOL
        _rev:
          type: string
          description: Currect revision ID for this document
          example: 3-a1df22093d0dc2978b87f396be3cd2fa
        name:
          type: string
          description: The name of the company
          example: Blackpool Insurance Brokers Ltd
        role:
          type: string
          description: The organisation's role on the platform, either 'broker' or 'underwriter'
          example: underwriter
        authorityDetails:
          type: array
          items:
            type: object
            properties:
              authority:
                type: string
                example: Lloyd's (Syndicate Number)
              pseudonymn:
                type: string
                example: '131'
              registrationNumber:
                type: string
                example: '12313'
        members:
          type: array
          items:
            type: object
            description: A user on the platform
            properties:
              name:
                type: string
                description: the user's name
                example: Sarah Kay
              email:
                type: string
                description: <p>email address for the user</p> <p>Note that for Data Protection reasons, the email is removed from some outputs, such as the /api/shared/corporate list. In these cases it can be removed by a call to /api/documents/Corporate-{CompanyID}.</p>
                example: sarah.kay.blackpool@wspt.co.uk
              currentState:
                type: string
                description: Live, Draft, Suspended etc
                example: Live
              uniqueID:
                type: string
                description: Live, Draft, Suspended etc
                example: MUDA8AF5A8-98DF-4EF2-B2B8-4E069EDB7E8C
              allowReporting:
                type: boolean
                description: whether or not the user may run the management reports
                example: true
              isOffPlatform:
                type: boolean
                description: indicates the user is "off platform"s
                example: false
              teams:
                type: array
                items:
                  type: string
                  description: list of teams the user belongs to
                example:
                - blackpool_MARINEHULL
                - blackpool_MARINECARGO
        permissions:
          type: object
          properties:
            secondApprovalReviewers:
              type: object
              properties:
                teams:
                  type: object
                  properties:
                    teamID:
                      type: array
                      description: PLEASE NOTE the key-value of teamID above is just an indicative placeholder and will in practice be the teamID of one of the organisation's teams
                      items:
                        type: string
                        example: MU6E391615-CFF5-4E8E-B9D2-B0DE03BACA0
                        description: The list of userID's of the team's members with Internal Reviewer permission
            secondApprovalSelfApprovers:
              type: object
              properties:
                teams:
                  type: object
                  properties:
                    teamID:
                      type: array
                      description: PLEASE NOTE the key-value of teamID above is just an indicative placeholder and will in practice be the teamID of one of the organisation's teams
                      items:
                        type: string
                        example: MU6E391615-CFF5-4E8E-B9D2-B0DE03BACA0
                        description: The list of userID's of the team's Internal Reviewers who also have the Self Approver permission
            templateManagers:
              type: object
              properties:
                teams:
                  type: object
                  properties:
                    teamID:
                      type: array
                      description: PLEASE NOTE the key-value of teamID above is just an indicative placeholder and will in practice be the teamID of one of the organisation's teams
                      items:
                        type: string
                        example: MU6E391615-CFF5-4E8E-B9D2-B0DE03BACA0
                        description: The list of userID's of the team's members who have the Template Manager permission. This permission is only available to broking organisations
        channelPrefix:
          type: string
          description: A lowercase version of companyId used for the beginning of team channels
          example: blackpool
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
    DefinedData:
      type: object
      properties:
        metadata:
          type: object
          description: metadata for the risk from which the defined data is taken
          properties:
            documentRevision:
              type: string
              example: 5-d5e0cc635b2d8ce4c07a7c9eda10baea
              description: this must be sent to the update POST endpoint
            userID:
              type: string
              example: MUB6A6C9F9-61C1-49EA-8C44-28EEAB3226F5
              description: the user who requested the data
            env:
              type: string
              example: apitest
              description: the environment from which the data came, to avoid confusion of sandbox versus production
            tagSet:
              type: string
              example: Whitespace
              description: by default Whitespace, but for instance ACORDCDR if called with the tagset option
            version:
              type: string
              example: '22.04'
              description: currently 22.04, to allow for a future new format
            fetchedAt:
              type: string
              example: '2022-05-27T13:35:24.000Z'
              description: date and time the data was fetched
            documentID:
              type: string
              example: IC442C1B93-DE19-4A52-A1D6-E3A4B47C4F6C
              description: the risk ID
        multiSectionDefinition:
          type: array
          items:
            type: object
            properties:
              sectionName:
                type: string
                description: the name of the section
                example: Hull
              sectionID:
                type: string
                description: the number of the section starting from 1
                example: '2'
        contractHeadigs:
          type: array
          items:
            type: object
            properties:
              lineItemIndex:
                type: number
                description: the numerical index of the JMRC line item
                example: 3
              mrcHeading:
                type: string
                description: the name of the heading
                example: contractType
              originalHeading:
                type: string
                description: the name of the heading as it will appear on the frontend
                example: 'TYPE:'
              section:
                type: string
                example: RiskDetails
                descritpion: the section the heading is in
        definedData:
          type: array
          items:
            type: object
            description: <div>The Data Point, containing a flat representation of each data value</div> <div>The version described is for the v22.04 release of Defined Data, accessed as /api/v22.04/data/$RiskID. It is a flat structure which repeats mrcHeading, originalHeading and lineItemIndex when the data is in the same line item of the risk. Within that, parentID is used to group related data values, to cover sectioned data or the rows of a table. </div> <div>We have versioned this as v22.04 to preserve it should a later format be required by our customers. Later versions will have vYY.MM instead.</div>
            properties:
              value:
                type: string
                description: the defined data value
                example: Acme Widgets Inc
              tag:
                type: string
                description: the tag that identifies the use of the data item
                example: Bad_Tag_Value
              mrcHeading:
                type: string
                description: the heading (from a fixed list) within the JMRC where the data item was located
                example: Insured
              originalHeading:
                type: string
                description: the heading visible to the user within the JMRC where the data item was located
                example: INSURED
              name:
                type: string
                description: the name of the defined data item's placeholder within the JMRC data
                example: DefinedData0
              parentID:
                type: string
                description: a code that links set of data tags within a heading
                example: Page:AB9B8D46-D6BC-442E-A01A-65E2F34096DF
              sectionIDs:
                type: array
                items:
                  type: string
                  description: section ID which links to the items in the multiSectionDefinition array
                  example: '2'
              vertical:
                type: object
                description: Info on any vertical if the tag is part of verticalised heading
                properties:
                  assignedCarrierPrefixes:
                    type: array
                    description: the channel prefixes of any carriers assigned to this vertical term
                    items:
                      type: string
                      example: whitesails
                  id:
                    type: string
                    example: V5A67D1D7-918D-4FEF-8B32-AF85A1B7F5A0_2
                    description: id of the vertical term
              lineItemIndex:
                type: number
                description: the numerical index of the JMRC line item where the data item was located
                example: 3
              controlled:
                type: boolean
                description: if included as true, indicates an item created through a controlled process as opposed to a broker manually tagging, such as Written or Signed Line values
                example: true
    RWPlacing:
      type: object
      description: <p>The MRCRisk obect contains the full text and structure of the JMRC Insurance Contract.</p> <p>It includes an MRCContract object where a set of MRCLineItem objects represent the headings and data in the contract, and an MRCRiskControl object which provides summary and meta data about the risk to enable the system's performance.</p>
      properties:
        _id:
          type: string
          example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
          description: unique document id for the risk
        _rev:
          type: string
          example: 1-141df67df9e5eaacd0830c65e47a0bf9
        createdAt:
          type: string
          example: '2021-08-04T15:18:02.000Z'
        updatedAt:
          type: string
          example: '2021-08-04T15:18:02.000Z'
        type:
          type: string
          example: RWPlacing
          description: RWPlacing in all cases
        control:
          type: object
          properties:
            status:
              type: string
              description: The current stage of the contract in the placing process, taken from an enumerated list containing stages such as Draft, Quoted, FirmOrder, etc
              example: FirmOrder
            insuranceType:
              type: string
              example: Insurance
              description: Either Insurance or ReInsurance, as specified at contract creation
            umr:
              type: string
              description: The Lloyd's Unique Market Reference number for the contract
              example: B0999JC201909241622
            insuredName:
              type: string
              example: Acme Widgets Inc
              description: The name given to the contract
            contractType:
              type: string
              example: Aviation Hull Cover
              description: The class of business that the contract falls under
            leadUnderwriterChannel:
              type: string
              example: messina_ALL
              description: The team channel name of the lead underwriter on the risk, once specified
            leadUnderwriter:
              type: string
              example: Messina All Risks
              description: The plaintext company and team name of the lead underwriter's team, once specified
            placingBrokerChannel:
              type: string
              example: ajc_ALL
              description: The team channel name of the contract's broker
            placingBroker:
              type: string
              example: AJC All Risks
              description: The plaintext company and team name of the broker's team
            limitSummary:
              type: string
              description: The limit of liability for the contract
            originalDocID:
              type: string
              description: The unique ID of the document this contract was created from, if any
              example: IC97799647-4496-4760-B594-02AC726B0D7E
            endorsementNumber:
              type: string
              example: '2'
              description: If this contract is an endorsement, its endorsement number is stored here
            endorsementType:
              type: string
              description: For endorsements, specifies whether the endorsement is a Mid-Term Participant Change or a standard endorsement
              enum:
              - standard
              - mtpc
            isFacility:
              type: boolean
              example: false
              description: True if this contract is a facility agreement
            associatedFacilityIDs:
              type: array
              items:
                type: string
                example: ICB1213647-4876-4760-B594-02AC7261312412
                description: If the contract is a declaration, this array lists the unique IDs of all facility agreeements it is attached to
            placementType:
              type: string
              enum:
              - FullContract
              - OffPlatform
              - Template
              description: The contract type. OffPlatform is for contracts backloaded to duplicate agreements conducted off-platform, Template is for contract templates, and FullContract is for all live contracts
            verticalVisibility:
              type: string
              enum:
              - OwnStampOnly
              - AllStamps
              - LeaderStamps
              description: If the risk has vertical terms, this string specifies which stamps underwriters can see.
            createdInVersion:
              type: number
              example: 21100
              description: Which version of the platform the risk was created in.
            isIndicative:
              type: boolean
              example: false
              description: True if the Indicative flag been toggled, indicating that the contract is not binding.
            submittedAsCopyOf:
              type: string
              example: ICD937404C-87A7-4408-BE4B-D449216F9A85
              description: If this contract is a placing document shared from another broker, the unique ID of the original producing broker's contract is held here.
            stampVisibility:
              type: string
              description: Decides whose stamps underwriters can see
              enum:
              - Allstamps
              - OwnStampsOnly
              - LeadersStamps
        MRCContract:
          type: object
          description: a top level object which currently contains only the array of line items
          properties:
            lineItems:
              type: array
              items:
                type: object
                $ref: '#/paths/~1api~1risks~1%7BriskID%7D~1lineitem~1%7BmrcHeading%7D/get/responses/200/content/application~1json/schema/items'
        channels:
          type: array
          items:
            type: string
    ExtendedMRC:
      type: object
      description: JSON returned by getExtendedMRC including the Risk and a broader range of data
      properties:
        createdAt:
          type: string
          example: '2021-08-04T15:18:02.000Z'
        updatedAt:
          type: string
          example: '2021-08-04T15:18:02.000Z'
        type:
          type: string
          example: RWPlacing
          description: RWPlacing in all cases
        control:
          $ref: '#/components/schemas/RWPlacing/properties/control'
        channels:
          type: array
          items:
            type: string
            example: ajc_ALL
        MRCContract:
          $ref: '#/components/schemas/RWPlacing/properties/MRCContract'
        questionnaire:
          type: object
          properties:
            questionnaire:
              type: object
              properties:
                questions:
                  type: array
                  items:
                    type: object
                    properties:
                      tag:
                        type: string
                        example: Pension_Or_Benefits_Plan_Company_Sponsor
                        description: name of the tag
                      text:
                        type: string
                        example: Does the company sponsor any pension or benefits plan?
                        description: The Question text
                      id:
                        type: string
                        example: Pension or Benefits Plan - Company Sponsor
                        description: the id of the question
                      hidden:
                        type: boolean
                        example: true
                        description: If the question is hidden or not, usually because the dependant question has not been answered
                      table:
                        type: array
                        items:
                          type: object
                          properties:
                            tag:
                              type: string
                              example: Asset_Amount_Year
                            text:
                              type: string
                              example: Year
                        required:
                        - tag
                        - text
                    required:
                    - text
                    - id
                    - tag
              required:
              - questions
          required:
          - questionnaire
        proposedEndorsementFollowers:
          type: object
          description: an object where the keys are the carrier team ids and the values are 'unchosen', 'leader', 'agreementParty', 'notifyParty', 'nonNotifyParty'
          properties:
            palermo_ALL:
              description: as an example, the follower status for the Palermo All Risks team
              type: string
              example: leader
        provenance:
          type: object
          description: Meta-data about the document to aid with auditing
          properties:
            version:
              type: string
              description: Version message of the platform system that created the document
              example: 2022-04-11@15:04:48
            dataHash:
              type: string
              description: Data hash of the activity document
              example: 485241de4e5bfc76a0e2ef8bab79350c02d3aa06846fd2996cbf9fc9a7840eb0
            system:
              type: string
              description: The internal name of the platform system
              example: LavAPI
            userID:
              type: string
              description: The user ID of the user whose action generated the document
              example: MUB980AB60-1C96-4092-A1B4-B8FB183360D1
            writtenAt:
              type: string
              description: The creation date of the document, in YYYY-MM-DD hh:mm:ss format
              example: '2022-05-09T11:44:41.000Z'
            provHash:
              type: string
              description: Provisioning hash of the document
              example: 76a209a16d8b9214e7a33483d78718cc1a7e7aed7047282d2c94417404558e2d
        accountDocID:
          type: string
          example: ''
        writtenLineSets:
          type: array
          description: the written lines on the contract
          items:
            $ref: '#/components/schemas/RWWrittenLineSet'
        signedLineSets:
          type: array
          description: the signed lines on the contract
          items:
            $ref: '#/components/schemas/RWSignedLineSet'
        platformReferences:
          type: object
          description: document and revision of the risk
          properties:
            RiskID:
              type: string
              description: the document ID of the risk
              example: IC08B5EC17-5486-4323-82FC-62CC8C410EA0::FO::EN1
            Revision:
              type: string
              description: the revision of the risk
              example: 4-b63141573da07d5316b7a2b4585fbd2b
    RWActivity:
      type: object
      description: The summary data associated with an individual activity document.
      properties:
        _id:
          type: string
          description: The RiskID of the activity document that this JSON object summarises
          example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO::ACTI::CARRIER::MARINECASUALTY::LGUS
        activity:
          type: string
          description: The live description of the action that created this document (which sometimes extends the "hardcodedActivity" value to be more explicit)
          example: Requested a Line
        apnsData:
          type: object
          $ref: '#/components/schemas/RWComment/properties/apnsData'
        channels:
          type: array
          description: A list of the user channels associated with the action that generated this activity document
          items:
            type: string
            description: The name of each channel
            example: carrier_MARINECASUALTY
        parentDocID:
          type: string
          description: The RiskID of the specific contract version associated with the activity document
          example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
        hardcodedActivity:
          type: string
          description: The hardcoded description of the action that created this document (which sometimes is augmented by the "activity" value)
          example: Line Written
        linkedArchiveID:
          type: string
          description: ID of the Archived document
        RWSignedLineSet:
          type: array
          items:
            type: object
            description: The data for the signed line
            properties:
              sectionIdentifiers:
                type: array
                description: the sections of the risk to which the signed line is attached
                items:
                  type: object
              businessUnit:
                type: string
                example: Catania Insurers Ltd
                description: the business unit for the underwriter who put down the line
              stampedAt:
                type: string
                description: The moment when the line was put down in YYYY-MM-DD hh:mm:ss format'
                example: '2019-10-01 09:31:43'
              subjectivities:
                type: array
                description: detail of any subjectivities added by the underwriter
                items:
                  type: object
              stamperChannel:
                type: string
                description: channel for the underwriter who put down the line
                example: catania_ALL
              contractArchiveID:
                type: string
                description: the archive of the risk document at the moment the line was put down
                example: IC9642312E-D0E2-46FE-8B08-9C3002C1DEC9::FO::CATANIA::ALL::ARCH::5A734DCC-98CC-4C41-A42F-3A43A5E44EE0
              toStand:
                type: boolean
                description: true if the underwriter has put down the stamp To Stand, i.e. may not be signed down
              impressions:
                type: array
                description: each item represents the use of an inked stamp to indicate the line being put down
                items:
                  type: object
                  properties:
                    riskCodes:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            example: H3
                            description: the risk code allocated to the written line
                          index:
                            type: string
                            description: the index order of the risk code
                            example: '0'
                    signedLinePercentageString:
                      type: string
                      description: the percentage signed by the broker, which may be less than the written line
                      example: '44.0272'
                    writtenLinePercentageString:
                      type: string
                      description: the percentage written by the underwriter
                      example: '45'
                    uwRefs:
                      type: array
                      items:
                        type: string
                        description: the code allocated by the underwriter, frequently limited to 12 letters and numbers
                        example: FHSDJFSDHFSD
                    tiltAngleString:
                      type: string
                      description: the angle of the stamp on the printed page, to give the appearance of manually stamped paper
                      example: '0.04264535201250923'
                    stamp:
                      type: object
                      properties:
                        bureauMarket:
                          type: string
                          description: the bureau market for the underwriting 'paper' used to provide cover
                          example: Lloyd's
                        uniqueID:
                          type: string
                          description: the platform's internal unique code for this stamp
                          example: STBA841D6D-EB9F-4729-96BA-67BE91C73CE8
                        businessUnit:
                          type: string
                          description: the business unit for the underwriting 'paper' used to provide cover
                          example: Lloyd's Syndicate 1314
                        stampType:
                          type: string
                          description: to distinguish between Lloyd's and the Company Market
                          example: lloyds
                        bureauMarketCode:
                          type: string
                          description: the bureau market code, which is the Syndicate Number within Lloyd's
                          example: '1314'
                        bureauSubMarket:
                          description: the bureau sub market for the underwriting 'paper' used to provide cover
                          type: string
                    stampIdentifiers:
                      type: array
                      items:
                        properties:
                          category:
                            type: string
                            description: the originating market that the bureau or syndicate belongs to
                            example: LloydsSyndicate
                          categoryNumber:
                            type: string
                            description: the bureau market code, Syndicate Number, or other unique identifier
                            example: '1314'
                          categoryExtra:
                            type: string
                            description: returned only for Lloyd's Syndicates and Lloyd's Brussels underwriters, listing their three-letter pseudonym
                            example: ASC
                          splitPercentage:
                            type: string
                            description: returned only for stamps that have a fixed split between multiple syndicates, listing the percentage falling under this syndicate. Split stamps have a separate stampIdentifiers block for each syndicate, and the combined splitPercentage totals 100%
                            example: 82%
              contractHash:
                type: string
                example: 81b7151e30ba40f098ab50cc3828e5ff6f5a725dbb76910416f018d3ca23638a
                description: a hash of the contract data to verify the text being agreed to
              stamperUserID:
                type: string
                example: MUB6090366-B15D-4C2B-BA54-EABE5F638FDF
                description: the unique platform code for the individual underwriter
              conditionsEnabled:
                description: true if conditions were attached to the written line
                type: boolean
              mode:
                type: string
                example: written
              lineConditions:
                type: array
                description: the set of line conditions added by the underwriter
                items:
                  type: object
              conditionsApproved:
                type: boolean
                description: true if the conditions applied have been approved
        createdAt:
          type: string
          description: The creation date of the activity document, in YYYY-MM-DD hh:mm:ss format
          example: '2021-07-28T13:15:12.000Z'
        userID:
          type: string
          description: The user ID of the user who took the action generating the activity document
          example: MUE516933D-D0B9-46C5-8D99-A4D5A6D9D37B
    RWEndorsementFollower:
      type: object
      properties:
        _id:
          type: string
          description: Unique ID for this endorsement follower document
          example: IC4E49E958-870A-41B3-B60B-B5AAC51F48A5::SIGNED::EN1::ENF::messina_ALL
        _rev:
          type: string
          description: Revision number for this document
          example: 3-a1df22093d0dc2978b87f396be3cd2fa
        agreement:
          type: object
          properties:
            dateOfAgreement:
              type: string
              description: Effective date of the endorsement in yyyy-mm-dd hh:mm:ss format
              example: '2021-08-06 08:15:28'
            followerType:
              type: string
              example: leader
              description: The role of this follower in the endorsement
              enum:
              - leader
              - agreementParty
              - notifyParty
              - nonNotifyParty
              - doesNotApply
              - unchosen
            instruction:
              type: string
              example: leaderOnly
              description: The parties the broker has selected as needing to agree the endorsement
              enum:
              - leaderOnly
              - none
              - leaderAndAgreementParties
              - allToAgree
            leader:
              type: string
              example: 'Yes'
              description: Set to Yes when the underwriter that this document details is the leader of the endorsement
            numberOfDaysToNotifyFollowers:
              type: string
              description: The number of days within which non-Agreement followers must be notified of the endorsement
              example: '7'
            user:
              type: string
              example: MUE8368329-A451-49D4-A385-915D421A4465
              description: The unique ID of the underwriter that this document details as a follower of the endorsement
            uwrChannel:
              type: string
              example: messina_ALL
              description: The team channel of the underwriter that this document details
            stampDescriptions:
              type: array
              items:
                type: object
                properties:
                  stampID:
                    type: string
                    example: ST213211241241
                    description: The ID of the stamp that the follower put down on the endorsement
                  desc:
                    type: string
                    example: 56 (added by Ascot Reinsurance Company Limited)
                    description: The brief description text field of the stamp identified above
            mtpcAgreement:
              type: array
              items:
                type: object
                properties:
                  type:
                    description: If the endorsement is a mid-term participant change, this specifies the category of participant change
                    enum:
                    - add
                    - modify
                    - remove
                    type: string
                  line:
                    $ref: '#/components/schemas/RWQuotedLine/properties/line/items'
        channels:
          type: array
          items:
            type: string
            description: A specific channel name identifying one of the entries in the array of team channels of the broker and all followers
            example: messina_ALL
        createdAt:
          type: string
          description: The date this document was created in yyyy-mm-dd hh:mm:ss format
          example: '2021-08-06 08:15:28'
        endorsementDocID:
          type: string
          example: IC4E49E958-870A-41B3-B60B-B5AAC51F48A5::SIGNED::EN1
          description: The unique ID of the endorsement that this RWEndorsementFollower document is associated with
        followerType:
          type: string
          example: leader
          description: The participation type of the follower
        version:
          type: integer
          description: The integer portion of the _ver value, identifying the sequential version number of this document
          example: 3
        type:
          type: string
          example: RWEndorsementFollower
          description: The JMRC document type of this document, which will always be RWEndorsementFollower
        updatedAt:
          type: string
          description: The date this document was last updated in yyyy-mm-dd hh:mm:ss format
          example: '2021-08-06 08:15:28'
        uwrChannel:
          type: string
          example: messina_ALL
          description: The team channel name of the follower's team
        template:
          type: string
          description: The category of agreement box displayed on the endorsement
          enum:
          - GUAStampA
          - GUAStampB
          - AVS100B
          - NonGUA
        mtpc:
          type: array
          items:
            type: object
            description: The details of the mid-term participant agreement, if the endorsement is of the MTPC type. Listed properties will change depending on whether the endorsement is adding, removing or modifying participants.
            properties:
              type:
                type: string
                enum:
                - add
                - remove
                - modify
                description: The type of change in participation
              sectionID:
                example: '1'
                description: The sectionID of the written line that is being modified/removed
                type: string
              setLeader:
                type: boolean
                example: true
                description: True if the MTPC is changing the leader
              guidance:
                type: object
                properties:
                  conditionsEnabled:
                    type: boolean
                    example: true
                    description: True if there are any conditions on the line guidance
                  sectionIdentifiers:
                    type: array
                    items:
                      type: string
                      example: '1'
                      description: The ID number of the section specifying the line guidance
                  maxString:
                    type: string
                    example: '40'
                    description: The maximum line percentage requested in the guidance
                  minString:
                    type: string
                    example: '30'
                    description: The minimum line percentage requested in the guidance
                  suggestedStamps:
                    $ref: '#/components/schemas/CorporateDetail/properties/stamps/items'
                  role:
                    description: The participation role of the follower
                    type: string
                    enum:
                    - leader
                    - agreementParty
                    - notifyParty
                    - nonNotifyParty
                    - doesNotApply
                  associatedFacilityId:
                    type: string
                    example: IC49BB5707-698B-4E51-B3C0-85FA763B94CC
                    description: The unique ID of the facility agreement, if any, that the declaration is attached to
                  associatedFacilitySectionID:
                    type: string
                    example: '1'
                    description: The sectionID of the section of the facility agreement, if any, that the declaration is attached to
              section:
                $ref: '#/components/schemas/RWLineGuidanceSet/properties/sections/items'
              facilityID:
                type: string
                example: IC4E49E958-870A-41B3-B60B-B5AAC51F48A5
                description: The unique ID of the facility agreement, if any, that the risk being endorsed is attached to one
              newPercentage:
                type: string
                example: '50'
                description: The new percentage value of the line if the MTPC is modifying a line
    RWLabel:
      type: object
      properties:
        _id:
          type: string
          description: the unique id of the label document
          example: IC7B4C4ECF-5340-4A88-B5BE-A4ECE8859B61::LBL::BLACKROBOT::AUTOAPIJENKINS201021::High-Priority::2021-11-23::08:36:55
        _rev:
          type: string
          description: the revision number of the document
          example: 1-9eb01c8b711503293b57aafa63aa70c4
        channels:
          type: array
          items:
            type: string
            description: channels for teams able to see the document
            example: carrier_MARINECASUALTY
        companyID:
          type: string
          description: the ID of the company
          example: BLACKROBOT
        createdAt:
          type: string
          description: the date and time the document was created
          example: '2021-11-23 08:36:55'
        rootID:
          type: string
          description: the rootID of the related risk
          example: IC7B4C4ECF-5340-4A88-B5BE-A4ECE8859B61
        teamID:
          type: string
          description: the ID of the team
          example: AUTOAPIJENKINS201021
        title:
          type: string
          description: the text of the label
          example: High Priority
        type:
          type: string
          description: the type of document
          example: RWLabel
    RWRiskSummary:
      type: object
      description: <p>The summary provides an array of documents related to a risk. The summary itself shows when it was updated and which filters it will be picked up by. </p>
      properties:
        _id:
          type: string
          description: document ID for the summary document
          example: RWRiskSummary::IC9E34C3AA-9F72-469B-BF2A-487578B10A5C::blackrobot_AUTOAPIJENKINS201021
        _rev:
          type: string
          description: the revision of the document
          example: 6-2f39c049dc3274caa11080936b448356
        rootID:
          type: string
          description: the rootID used by all documents for a given risk
          example: IC9E34C3AA-9F72-469B-BF2A-487578B10A5C
        updatedAt:
          type: string
          description: UTC date stamp for when the document was updated
          example: '2021-11-22T06:44:26.000Z'
        channels:
          type: array
          items:
            type: string
            description: channels for teams able to see the document
            example: carrier_MARINECASUALTY
        docs:
          type: array
          items:
            type: object
            description: <p>The document contents vary depending on the type. For instance, the RWPlacing type has several entries including insuredName and inceptionDate,  while the RWLineGuidanceSet type has very few.</p>
            properties:
              id:
                type: string
                description: The root ID of the risk, beginning IC
                example: IC9E34C3AA-9F72-469B-BF2A-487578B10A5C
              channels:
                type: array
                items:
                  type: string
                  description: The user channels of the teams able to see the document
                  example: carrier_MARINECASUALTY
              updatedAt:
                type: string
                description: The date and time that the document was last updated on
                example: '2021-11-22 06:44:20'
              createdAt:
                type: string
                description: The date and time that the document was created on
                example: '2021-11-22T06:44:20.000Z'
              type:
                type: string
                description: The type of document
                example: RWPlacing
              inceptionDate:
                type: number
                description: The risk''s inception date in unix epoch
                example: 1561939200
              insuredName:
                type: string
                description: The name of the risk
                example: Verticals
              lastModifiedBy:
                type: string
                description: The userID of the user who last modified this document
                example: MUB6A6C9F9-61C1-49EA-8C44-28EEAB3226F5
              leadUnderwriterChannel:
                type: string
                description: The team channel of the lead underwriter on the risk
                example: ''
              limitSummary:
                type: string
                description: The maximum limit of the risk
                example: USD 20,000,000
              placementType:
                type: string
                description: The document''s placement type, i.e FullContract, Template
                example: FullContract
              placingBrokerChannel:
                type: string
                description: The team channel of the broker on the risk
                example: blackrobot_AUTOAPIJENKINS201021
              rev:
                type: string
                description: The current revision number of the document
                example: 1-f93a2422aefaa252649c4a9471872b88
              status:
                type: string
                description: The stage the risk is at in the placement process
                example: NotFinalised
              umr:
                type: string
                description: The Unique Reference (formerly UMR) of the risk
                example: B0999MT2211064419
        filters:
          type: array
          items:
            type: string
          example:
          - status:FirmOrderPending
          - umr:b0999mt2211064419
          - status:FirmOrder
          - action:brReadyForSigning
          - ctype:Open Market
          - ptype:FullContract
          - owner:MUB6A6C9F9-61C1-49EA-8C44-28EEAB3226F5
          - name:verticals
          - status:FirmOrderPending
    RWSignedLineSet:
      type: object
      properties:
        _id:
          type: string
          example: ICD0645233-E126-4768-AB15-0A8828F5F08C::FO::TOMYUNDERWRITING::ALL::SILS
          description: The unique ID of this document
        _rev:
          example: 1-087952cf08f44dae740c1c001e2d5ab2
          type: string
          description: The revision number of this document
        channels:
          type: array
          items:
            type: string
            example: akhil_ALL
            description: The team channel names of the users who can see the risk these signed lines relate to
        createdAt:
          type: string
          example: '2024-02-21 15:05:47'
          description: The creation time of this document in YYYY-MM-DD HH:MM:SS format
        contents:
          type: array
          items:
            $ref: '#/components/schemas/RWQuotedLine/properties/line/items'
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        type:
          type: string
          description: The JMRC type name for this document. Always RWSignedLineSet
          example: RWSignedLineSet
        updatedAt:
          type: string
          example: '2024-02-21 15:05:47'
          description: The date and time that this document was last updated in YYYY-MM-DD HH:MM:SS format
        isOffline:
          type: boolean
          example: true
          description: True if the stamp is associated with an offline (re)insurer
        parentDocID:
          type: string
          example: ICD0645233-E126-4768-AB15-0A8828F5F08C::FO::TOMYUNDERWRITING::ALL
          description: The unique ID of the related RWPlacing document
      required:
      - _id
      - _rev
      - channels
      - createdAt
      - line
      - parentDocID
      - provenance
      - type
      - updatedAt
    RWFacilityGuidance:
      type: object
      properties:
        _id:
          type: string
          example: IC9A83BB04-83EA-4D91-8120-57A5FC13892D::FO::FGUI::ICD77B5FD4-0790-42B9-BC53-65242FB96558
          description: ID of the document
        _rev:
          type: string
          example: 1-4d2a2b5e6a7266885195e8b8fa178693
          description: revision number of the document
        channels:
          type: array
          items:
            type: string
            example: akhil_ALL
        createdAt:
          type: string
          example: '2024-02-21 14:18:10'
          description: date/time the document was created
        type:
          type: string
          example: RWFacilityGuidance
        updatedAt:
          type: string
          example: '2024-02-21 14:18:10'
          description: the date/time the document was updated.
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        roles:
          type: array
          items:
            type: object
            properties:
              additionalCarrierInfo:
                type: object
                properties:
                  carrier1_channel:
                    type: object
                    properties:
                      proposedLineGuidance:
                        type: number
                        description: The line percentage being offered to the carrier this array applies to
                        example: 50
                      proposedOwnerMemberID:
                        type: string
                        description: the uniqueID of the user that the declaration was sent to
                        example: MUEFBB586A-30D6-4D96-A696-21AA20AA757F
              sectionID:
                type: string
                description: The sequential number of the declaration contract section if it exists
                example: '1'
              state:
                enum:
                - notYetShown
                - shownToLeader
                - leaderWritten
                - notifyPartiesBound
                type: string
                description: The current agreement state of the facility agreement that the declaration is being sent under
              order:
                type: object
                properties:
                  max:
                    type: number
                    description: maximum order percentage permitted when declaring to the facility
                    example: 100
                  min:
                    type: number
                    description: minimum order percentage permitted when declaring to the facility
                    example: 100
              carriers:
                type: object
                properties:
                  carrier1_channel:
                    type: string
                    description: the declaration role of the carrier this array applies to. Note that carrier1_channel is a stock name, the key will differ for different channels
                    enum:
                    - leader
                    - agreementParty
                    - notifyParty
                    - nonNotifyParty
                    - doesNotApply
              shownToLeaderAt:
                type: string
                description: The data and time when the declaration was shown to the leader
                example: 2023-04-11@15:04:48
    RWRiskAuthorisationState:
      type: object
      properties:
        _id:
          description: The unique ID of this document
          type: string
          example: IC7B100AFD-BAA8-4B88-AB28-6B0FDA79FD81::RiskAuthState::akhil_ALL
        _rev:
          type: string
          description: The revision number of this document
          example: 1-5e141ce5388edccdef2e4193b0d319da
        channels:
          type: array
          items:
            type: string
            description: The team IDs of the users who can see the risk
            example: akhil_ALL
        createdAt:
          type: string
          example: '2021-11-23 08:36:55'
          description: The creation time of this document
        currentAuthRequest:
          type: object
          properties:
