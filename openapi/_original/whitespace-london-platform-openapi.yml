                      pageID: 9FA04CFC-EE83-45F5-BD50-9581A63DE206
                    attributes:
                      locked: false
                  - elements:
                    - text: '[[DefinedData0]]'
                      index: 0
                    placeholders:
                    - name: DefinedData0
