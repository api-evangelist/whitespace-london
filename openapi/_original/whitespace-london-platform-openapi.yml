          example: IC830CD992-A6F2-4C23-80AF-4FE20A14BFF3::CC1
          description: Unique ID of the Contract Correction document
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        type:
          type: string
          example: RWCorrectionDetails
        updatedAt:
          type: string
          example: '2024-06-24 11:04:10'
        uwrChannel:
          type: string
          example: offlinebarantsre_ALL
          description: The channel of the underwriter described by this object
      required:
      - _attachments
      - _id
      - _rev
      - channels
      - createdAt
      - details
      - parentDocID
      - provenance
      - type
      - updatedAt
      - uwrChannel
security:
