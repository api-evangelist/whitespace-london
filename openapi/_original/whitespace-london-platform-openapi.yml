    RWBrokerMessage:
      type: object
      properties:
        _id:
          type: string
          example: IC70DC4134-71CE-40E7-BFAE-223CCDCDA2C3::QR3::BrokerMessage::tomyunderwriting_ALL
          description: The unique ID of this document
        _rev:
          type: string
          example: 1-1b9f23f0c0658c23793959f12c119abc
          description: The revision number of this document
        associatedRiskID:
          type: string
          example: IC70DC4134-71CE-40E7-BFAE-223CCDCDA2C3::QR3
          description: The unique ID of the risk instance that the broker message applies to
        channels:
          type: array
          items:
            type: string
            example: akhil_ALL
            description: The team IDs of the users who can see the risk
        closing:
          type: string
          example: Best Regards
          description: The broker's closing salutation message
        createdAt:
          type: string
          example: '2024-02-21 13:21:24'
          description: The creation time of this document
        elements:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                example: 0
                description: The index number of the text string shown below
              text:
                type: string
                example: Please Agree
                description: The main body of the broker's message
            required:
            - index
            - text
        greeting:
          type: string
          example: Hello
          description: The broker's introduction message
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        type:
          type: string
          example: RWBrokerMessage
          description: The named JMRC type descriptor for this document
        updatedAt:
          type: string
          description: The date and time that this document was last updated
          example: '2024-02-21 13:21:24'
      required:
      - _id
      - _rev
      - associatedRiskID
      - channels
      - createdAt
      - elements
      - type
      - provenance
      - updatedAt
    RWMRCValidationResults:
      type: object
      properties:
        _id:
          type: string
          example: IC70DC4134-71CE-40E7-BFAE-223CCDCDA2C3::MRCValidation
          description: The unique ID of this document
        _rev:
          type: string
          example: 1-4d2a2b5e6a7266885195e8b8fa178693
          description: The revision number of this document
        channels:
          type: array
          items:
            type: string
            description: The team IDs of the users who can see the risk
            example: akhil_ALL
        createdAt:
          type: string
          example: '2024-02-21 14:18:10'
          description: The creation time of this document
        narrative:
          type: string
          example: Failed on 30 of 124 rules
          description: The summary of the validation results
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        riskStatus:
          type: string
          enum:
          - NotFinalised
          - MarketedOnly
          - QuotationRequest
          - QuotationInPreparation
          - QuotedByUnderwriter
          - BindableQuote
          - FirmOrder
          - Signed
          - EndorsementInPreparation
          - Endorsement
          - EndorsementFinalised
          - NotTakenUp
          - QuotationRequestDeclined
          - QuotationRequestWithdrawn
          - QuotationWithdrawn
          - BindableQuoteDeclined
          - BindableQuoteWithdrawn
          - BindableQuoteRejected
          - BindableQuoteNotTakenUp
          - FirmOrderWithdrawn
          - FirmOrderDeclined
          - EndorsementWithdrawn
          - EndorsementDeclined
          - FirmOrderRejected
          - Template
          description: The current contract status of the risk instance being validated
        rules:
          type: array
          items:
            type: object
            properties:
              failMessages:
                type: array
                items:
                  type: string
                  example: The \Broker Reference\ tag is missing. Ensure the tag is applied under the heading \Unique Market Reference\ within the Risk Details section.
                  description: Detailed text explaning one error in the validation
              fieldName:
                type: string
                example: Unique Market Reference
                description: The contract heading that the failure refers to.
              rawRiskValue:
                type: string
                example: UMR HAS TAG Broker_Reference
                description: The name of the rule being tested
              result:
                type: string
                enum:
                - PASS
                - FAIL
                - MISSING
                - NORULES
                - DOESNOTAPPLY
                - NYI
                description: The result of the rule test
              ruleID:
                type: string
                example: MRC-0002
                description: The ID number of the rule
              severity:
                type: string
                description: The severity level of failing the rule test
                example: optional
            required:
            - failMessages
            - fieldName
            - rawRiskValue
            - result
            - ruleID
            - severity
        type:
          type: string
          example: RWMRCValidationResults
          description: The named JMRC type descriptor for this document
        updatedAt:
          type: string
          example: '2024-02-21 14:18:10'
          description: The date and time that this document was last updated
      required:
      - _id
      - _rev
      - channels
      - createdAt
      - narrative
      - provenance
      - riskStatus
      - rules
      - type
      - updatedAt
