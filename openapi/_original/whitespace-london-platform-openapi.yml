  /api/risks/{riskID}/createContractCorrection:
    post:
      summary: Create a Contract Correction - Broker Only
      description: A Contract Correction can only be started at the Signed stage or at Firm Order if at least one written line is present and no line requests are outstanding. Other outstanding Actions will prevent correction, including (but not limited to) a line written with a subjectivity response that has not been agreed/rejected, an incomplete endorsement, an outstanding line removal request, and other unresolved contract-altering issues.
