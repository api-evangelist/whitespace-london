      required:
      - _id
      - _rev
      - channels
      - createdAt
      - line
      - parentDocID
      - provenance
      - type
      - updatedAt
    RWAttachmentCollection:
      type: object
      properties:
        _id:
          type: string
          example: IC1645BA8E-6E4B-4619-97B5-A2FF5ED30331::ATCH::tomyunderwriting_ALL
          description: Unique ID of this document
        _rev:
          example: 2-73d5bf3886f3c089b262634d5950a933
          type: string
          description: Revision number of this document
        channels:
          type: array
          items:
            type: string
            description: ID of the team/s with access to this document
            example: akhil_ALL
        createdAt:
          type: string
          example: '2024-02-20 13:35:27'
          description: Creation time of this document
        metadata:
          type: array
          items:
            type: object
            properties:
              attachedAt:
                type: string
                example: '2024-02-20 13:35:27'
                description: The date and time that the attachment was uploaded
              attachedByUser:
                type: string
                example: The uniqueID of the user who uploaded the attachment
                description: MU999AF919-3FDB-49F2-B4C5-D42614B02E70
              attachmentName:
                description: The file name of the attachment
                type: string
                example: testfile.pdf
              content_type:
                description: The file type of the attachment
                type: string
                example: application/pdf
              digest:
                type: string
                example: sha1-9SgDg2hqQE9US98xJEhGH+3nVME=
              identifier:
                description: The uniqueID of the attachment in the system
                type: string
                example: A-D0861C3D-45A0-4787-9482-2115C432035D
              length:
                description: The file size of the attachment in bytes
                type: integer
                example: 284884
              strongDigest:
                example: sqbw+jVYsy1aQzsAVG6kI2OkHU3F0sRYYOWUrxEQIKQ="
                type: string
              usesBlobStore:
                type: boolean
                example: true
                description: Whether the attachment file uses azure blob storage
              version:
                description: The sequential version number of the current file being used as the attachment, which increases when the attachment's file is replaced
                example: 1
                type: integer
              replaces:
                description: The unique ID of the attachment document that this new file is replacing, if any
                type: string
                example: A-AAEE8F8F-9EE9-40B5-9C53-3E427A798722
              replacedBy:
                description: The unique ID of the attachment document that this file is being replaced by, if any
                type: string
                example: A-AAEE8F8F-9EE9-40B5-9C53-3E427A798722
              linkedEndorsementNumbers:
                type: array
                items:
                  type: number
                  description: The endorsement numbers of any endorsements linked to this attachment
                  example: 3
            required:
            - attachedAt
            - attachedByUser
            - attachmentName
            - identifier
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        type:
          description: The named JMRC type descriptor for this document
          type: string
          example: RWAttachmentCollection
        updatedAt:
          description: The date and time that this document was last updated
          type: string
          example: '2024-02-20 13:35:27'
      required:
      - _id
      - _rev
      - channels
      - createdAt
      - provenance
      - type
      - updatedAt
    RWComment:
      type: object
      description: A document that represents one comment in a chat
      properties:
        _id:
          type: string
          description: unique document id for the comment
          example: IC2C2C364A-F483-48F3-A927-05BC703CFCE3::CHAT::901F20D1-6BC8-46C6-BAA4-92B64507D7A2
        apnsData:
          type: object
          description: data for notifications to be sent alerting users about the activity. NOTE - this is for internal Whitespace usage and so the data can be subject to change. Please do use this object for integration purposes
          properties:
            channels:
              type: array
              description: A list of the channels for users to receive the notification
              items:
                type: string
                description: the team channel
                example: carrier_MARINECASUALTY
            data:
              type: object
              properties:
                docId:
                  type: string
                  description: the risk root ID associated with the activity
                  example: IC6A318B90-C319-4D2A-9088-98AD1B313556
            dataForEmail:
              type: object
              properties:
                riskInformation:
                  type: array
                  items:
                    type: string
                    description: an array of text strings to be displayed in the notification message
                    example: Acme Widgets Inc USD 25,000,000 B0999JC2311220803
                userID:
                  type: string
                  description: the ID of the user whose action triggered the activity
                  example: MUB70853CF-3221-4FD4-8A30-12B05EAD2EA5
            subscriptionRootID:
              type: string
              description: the risk root ID associated with the activity
              example: IC6A318B90-C319-4D2A-9088-98AD1B313556
            subtitle:
              type: string
              description: text subtitle for the message
              example: 'Messina Insurance Co

                Aviation Hull and Liability Insurance'
            title:
              type: string
              description: text title for the message
              example: Declined Quote Request
        _rev:
          type: string
          example: 1-141df67df9e5eaacd0830c65e47a0bf9
        createdAt:
          type: string
          example: '2021-08-04 15:18:02'
        updatedAt:
          type: string
          example: '2021-08-04 15:18:02'
        type:
          type: string
          example: RWComment
          description: RWComment in all cases
        associatedRootID:
          type: string
          example: IC2C2C364A-F483-48F3-A927-05BC703CFCE3
          description: The root ID for the risk which the chat relates to
        channels:
          type: array
          description: The team channels of users allowed to see the document
          items:
            type: string
            example: blackpool_TERRORISM
        comment:
          type: string
          description: The text of the comment
          example: Is this within your risk criteria?
        brokerMessageDocID:
          example: IC09F74B05-AC0C-4FCA-A0C0-1FD94D4BEA2A::FO::BrokerMessage::tomyunderwriting_ALL
          type: string
          description: The ID of the broker message, if the comment was a broker message
        brokerMessageStage:
          type: string
          example: FirmOrder
          description: The stage of the risk when the broker message was shown
        user:
          type: string
          description: The ID of the user who sent the message
          example: MU9FCFC64E-7694-420A-BE61-2ABEDB3E8F52
        createdAtMilliseconds:
          type: integer
          example: 1709213501333
          description: The value of createdAt in miliseconds
        isInternal:
          type: boolean
          example: false
          description: True if the message is internal
    RWSubjectivityResponse:
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of this document
          example: ICFFCA06E9-AC1E-4CAF-8890-791E044B417E::FO::TOMYUNDERWRITING::ALL::WRLS::SUBJR::C3D58950-1C4F-46AD-8C5F-D5C6566F2CC8
        _rev:
          example: 2-73d5bf3886f3c089b262634d5950a933
          type: string
          description: The revision number of this document
        associatedAwDocID:
          type: string
          description: The unique ID of the associated RWAttentionWanted document, if it exists
        associatedFirmOrderDocID:
          type: string
          example: ICFFCA06E9-AC1E-4CAF-8890-791E044B417E::FO::TOMYUNDERWRITING::ALL
          description: The unique ID of the associated firm order or bindable quote document that this subjectivity response applies to.
        associatedNoCoverStorerDocID:
          type: string
          description: The unique ID of the associated No Cover document, if it exists
        associatedSetDocID:
          type: string
          example: ICFFCA06E9-AC1E-4CAF-8890-791E044B417E::FO::TOMYUNDERWRITING::ALL::WRLS
          description: The unique ID of the line set document for the associated risk
        attachmentsMetadata:
          type: array
          items:
            type: object
            properties:
              attachedAt:
                type: string
                example: '2024-02-20 13:35:27'
                description: The date and time that an attachment was uploaded
              attachedByUser:
                type: string
                example: The unique ID of the user who uploaded the attachment
                description: MU999AF919-3FDB-49F2-B4C5-D42614B02E70
              attachmentName:
                description: The file name of the attachment
                type: string
                example: testfile.pdf
              identifier:
                description: The uniqueID of the attachment in the system
                type: string
                example: A-D0861C3D-45A0-4787-9482-2115C432035D
              strongDigest:
                example: sqbw+jVYsy1aQzsAVG6kI2OkHU3F0sRYYOWUrxEQIKQ="
                type: string
              usesBlobStore:
                type: boolean
                example: true
                description: True if the attachment file uses azure blob storage
              version:
                description: The sequential version number of the file currently being used as this attachment, which increases when the attachment's file is replaced
                example: 1
                type: integer
            required:
            - attachedAt
            - attachedByUser
            - attachmentName
            - identifier
        cannotBeSatisfied:
          type: boolean
          example: false
          description: True if the broker has stated that they cannot satisfy the subjectivity requirement.
        channels:
          type: array
          items:
            type: string
            description: Channel ID of the team/s with access to this document
            example: akhil_ALL
        createdAt:
          type: string
          example: '2024-02-20 13:35:27'
          description: Creation time of this document
        isValid:
          type: boolean
          example: true
          description: False if the broker rejects the required subjectivity
        message:
          type: string
          example: Will satisy Subjectivity
          description: A text message from the Broker regarding satisfying the subjectivity
        mode:
          type: string
          example: holdingCover
          description: The type of subjectivity response, can be holdingCover or noCoverGiven
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        status:
          type: string
          example: awaiting
          description: The status of the underwriter's response to the broker's attempt to satisfy (or decline) the subjectivity
        subjectivity:
          type: object
          properties:
            approvedStatus:
              type: string
              enum:
              - notYetResponded
              - accepted
              - rejected
              - deadlineExpired
            deadline:
              type: string
              example: '1709596800.0'
              description: The response deadline in Unix Epoch format
            identifier:
              type: string
              example: E426767E-0852-4A18-8D98-5DD69060F40B
              description: The uniqueID of the subjectivity response document
            text:
              type: string
              example: Please satisfy
              description: The underwriter's description of the subjectivity requirement
          required:
          - approvedStatus
          - deadline
          - text
        type:
          type: string
          description: The purpose of this document in the system - always RWSubjectivityResponse
          example: RWSubjectivityResponse
        updatedAt:
          description: The date and time that this document was last updated
          type: string
          example: '2024-02-20 13:35:27'
      required:
      - _id
      - _rev
      - associatedAwDocID
      - associatedFirmOrderDocID
      - associatedNoCoverStorerDocID
      - associatedSetDocID
      - cannotBeSatisfied
      - channels
      - createdAt
      - isValid
      - message
      - mode
      - provenance
      - status
      - subjectivity
      - type
      - updatedAt
    RWMultiSectionStorer:
