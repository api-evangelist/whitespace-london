                      version: '23.09'
                    multiSectionDefinition: []
  /api/v23.09/data/{riskID}/verify:
    post:
      summary: Verifies the data payload to check that it will be accepted by an update POST, and explains errors in detail.
      description: <div>This endpoint describes any problems with a data payload that is to be sent to the POST /api/v23.09/data/$RiskID call.</div> <div>Unlike an update POST operation, it provides verbose error descriptions rather than a simple failure notification. <div>Please note that this call is solely for verification, it <b>does not</b> save any data.</div>
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk
        example: IC442C1B93-DE19-4A52-A1D6-E3A4B47C4F6C
      tags:
      - Data
      requestBody:
        content:
          application/json:
            example:
              metadata:
                tagSet: Whitespace
                documentRevision: 2-f19731b1229504652807f093a8179dbf
                env: apitest
                fetchedAt: '2023-11-27 10:51:29'
                documentID: ICA18B8998-6A42-45EF-BD9F-F8F58B182B99::DR2
                version: '23.09'
                userID: MU9FCFC64E-7694-420A-BE61-2ABEDB3E8F52
              definedData:
              - originalHeading: PERIOD
                value: 41 August 2022
                phType: Date
                mrcHeading: Period
                name: DefinedData1
                tag: Expiry_Date
                parentID: Page:17D6A8C3-4C32-4E5D-AD1D-0A7321C66535
                lineItemIndex: 4
                section: RiskDetails
              multiSectionDefinition: []
            schema:
              $ref: '#/components/schemas/DefinedData'
      responses:
        '200':
          description: An array of all problems encountered when attempting to process the data. If this array is empty, the data will be accepted correctly if sent to a POST update.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    error:
                      type: string
                      description: Problems encountered while processing the data
                      example: Tags do not match input.
                    datapoints:
                      type: array
                      items:
                        type: object
                        description: The data point, containing a flat representation of each data value
                        properties:
                          value:
                            type: string
                            description: The value to be tagged as data
                            example: Acme Widgets Inc
                          tag:
                            type: string
                            description: The defined data tag that identifies the purpose of the value
                            example: Insured_Name
                          mrcHeading:
                            type: string
                            description: The standard Lloyd's MRC name for the contract heading that the data item falls under
                            example: Insured
                          originalHeading:
                            type: string
                            description: The contract heading that the data item falls under as displayed in the contract
                            example: INSURED
                          name:
                            type: string
                            description: The name of the placeholder used to locate the precise position of the data item in the contract text
                            example: DefinedData0
                          parentID:
                            type: string
                            description: The reference identifying the page (or group) of data tags under a contract heading that the data item is part of
                            example: Page:AB9B8D46-D6BC-442E-A01A-65E2F34096DF
                          sectionIDs:
                            type: array
                            items:
                              type: string
                              description: The section ID which links to the items in the multiSectionDefinition array
                              example: '2'
                          lineItemIndex:
                            type: number
                            description: The numerical index specifying the position in the document of the contract heading containing the data item
                            example: 3
                          controlled:
                            type: boolean
                            description: When true, this flag indicates that the data item was created through a controlled process, for example Written Line or Signed Line percentages
                            example: true
              example:
              - error: The tag Expiry_Date did not pass validation.
                datapoints:
                - tag: Expiry_Date
                  lineItemIndex: 4
                  value: 41 August 2022
                  originalHeading: PERIOD
                  name: DefinedData1
                  phType: Date
                  mrcHeading: Period
                  parentID: Page:17D6A8C3-4C32-4E5D-AD1D-0A7321C66535
                  section: RiskDetails
  /api/declarations/{riskID}/showToFacility/{facilityID}:
    post:
      summary: Sends a firm order declaration to a facility - Broker Only
      description: This is the new endpoint for showing a Firm Order or Bindable Quoteto a Facility. It has better error handling and you no longer are required to send in information for sections that you are not showing. You also no longer need to use valueIsLeaderLineGuidance, as by default it will use the given line guidance for the leader. As before you can grab the list of markets avaiable to show on the facility by getting the Facility Id and use /combinedSets.
      tags:
      - Show Declaration to Facility
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the Firm Order or Bindable Quote that you want to show to the Facility
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
      - in: path
        name: facilityID
        schema:
          type: string
        required: true
        description: The root ID of the facility you are showing to
        example: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
      requestBody:
        description: Data specifying the filters to be applied
        required: true
        content:
          application/json:
            examples:
              Leader with Followers:
                description: Showing to the leader in a facility with one or more followers. (Please note the "Message" object is optional.)
                value:
                  declarationID: IC3972977E-4C37-4404-BF49-FC337528D3CB::FO
                  facilityID: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
                  sections:
                  - carriers:
                      offlineacquinex_ALL:
                        role: leader
                        show: true
                        value: '6'
                      offlineallianzglobal_ALL:
                        role: agreementParty
                        show: false
                        value: '6'
                      offlineallianzuk_ALL:
                        role: agreementParty
                        show: false
                        value: '6'
                      tomyunderwriting_ALL:
                        role: agreementParty
                        show: false
                        ownerMemberID: MU999AF919-3FDB-49F2-B4C5-D42614B02E70
                        value: '7'
                    leader: false
                    autoCascade: true
                  messages: []
                  stampVisibility: OwnStampOnly
                  _rev: 1-c11c5f27d3602e85309717a21084bb2f
              Sectioned Declaration to Sectioned Facility:
                description: Showing seperate sections on a declaration to a multi section facility
                value:
                  declarationID: IC36CC1CFA-EF65-40B6-8120-576BC8081E43::FO
                  facilityID: ICD77B5FD4-0790-42B9-BC53-65242FB96558
                  sections:
                  - carriers:
                      tomyunderwriting_ALL:
                        role: leader
                        show: true
                        ownerMemberID: MU999AF919-3FDB-49F2-B4C5-D42614B02E70
                        value: '100'
                    leader: false
                    autoCascade: false
                    orderToFacility: '100'
                    sectionID: '1'
                    facilitySectionID: '1'
                  - carriers:
                      tomyunderwriting_ALL:
                        role: leader
                        show: true
                        ownerMemberID: MU999AF919-3FDB-49F2-B4C5-D42614B02E70
                        value: '100'
                    leader: false
                    autoCascade: false
                    orderToFacility: '100'
                    sectionID: '2'
                    facilitySectionID: '2'
                  attachments: []
                  messages: []
                  stampVisibility: AllStamps
                  _rev: 3-0cdff721f029e535d3a6d4d9b9a0fcce
            schema:
              type: object
              properties:
                _rev:
                  type: string
                  description: the revision number of the declaration
                  example: 1-de9bba4cb8ea75572af90209683166c6
                declarationID:
                  type: string
                  description: The ID of the declaration firm order
                  example: IC9BCF6396-725E-477D-A864-B98BDB240150::FO
                FacilityID:
                  type: string
                  description: The root ID of the facility agreement
                  example: IC1326C845-9E83-4636-A3F2-D6488881AE8D
                attachments:
                  type: array
                  items:
                    type: string
                  example: []
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      carriers:
                        type: object
                        properties:
                          tomyunderwriting_ALL:
                            type: object
                            properties:
                              role:
                                type: string
                                description: role, i.e "leader" or "agreementParty"
                                example: leader
                                enums:
                                - leader
                                - agreementParty
                                - notifyParty
                                - nonNotifyParty
                              show:
                                type: boolean
                                description: whether to show to carrier or not
                                example: true
                              suggestedStampIDs:
                                type: array
                                items:
                                  type: string
                                example: []
                              value:
                                type: string
                                description: a percentage value, as per call description above
                                example: '75'
                          raji_AVIATION:
                            type: object
                            properties:
                              role:
                                type: string
                                description: role, i.e "leader" or "agreementParty"
                                example: agreementParty
                              show:
                                type: boolean
                                description: whether to show to carrier or not
                                example: false
                              suggestedStampIDs:
                                type: array
                                items:
                                  type: string
                                example: []
                              value:
                                type: string
                                description: a percentage value, as per call description above
                                example: '25'
                      leader:
                        type: boolean
                        example: false
                        description: Whether you want the leader of this Facility to be the overall contract/section leader
                      autoCascade:
                        type: boolean
                        description: Set Auto-Cascade to true or false when showing to leader
                        example: false
                      sectionID:
                        type: string
                        example: '1'
                        description: The sectionID of the risk to show to the Facility
                      facilitySectionID:
                        type: string
                        example: '1'
                        description: The sectionID of the Facility you want to show to
      responses:
        '200':
          description: successfully showed Declaration. Multiple doucments will be affected as a result so the response will show all of them
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
