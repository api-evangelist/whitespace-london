              description: Empty Payload
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Contract Correction Created
                    description: A message indicating success
  /api/risks/{riskID}/contractAttributes:
    post:
      tags:
      - Risks
      summary: Edit an attribute of the entire contract. Currently limited to text-locking options - Broker Only
      description: <ul> <li>lockAll - lock all text and tagged data</li> <li>lockTextonly - lock normal text but allow tagged data to be edited</li> <li>lockAllTemplate - Template Only - locks all text and tagged data, can only be removed by a Template Manager, same locking is applied to any risks cloned from the template</li> <li>lockTextOnlyTemplate - Template Only - lock normal text but allow tagged data to be editable, can only be removed by a Template Manager, same locking is applied to any risks cloned from the template</li></ul>
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      requestBody:
        content:
          application/json:
            schema:
              properties:
                isLocked:
                  type: boolean
                  description: Either true or false
                  example: true
                lockType:
                  type: string
                  description: Mandatory, if isLocked is True
                  example: lockAll
                  enum:
                  - lockAll
                  - lockTextOnly
                  - lockTextOnlyTemplate
                  - lockAllTemplate
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                properties:
                  rev:
                    description: revision of the new risk
                    example: 10-849b76541bfc6683d15208ea4ebe43c5
                    type: string
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: string
                    example: IC9326FED7-A802-4C86-B625-6E078470CA83
                    description: ID of thr risk/template
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/setTemplateChannels:
    post:
      tags:
      - Risks
      summary: Set the teams that a template is visible to - Broker Only
      description: Share or unshare a template with other teams. The user can share templates with teams that they are not a member of. NOTE that this does not create a copy of the shared template, it opens the shared template to multiple user teams, so any changes made by users in other teams will affect all users.
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the template
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  type: array
                  items:
                    type: string
                  description: A definitive list of the channels of the teams who can access the template, including the original team it was created in. To unshare the template, remove the team from the list. The list must contain at least one active team.
