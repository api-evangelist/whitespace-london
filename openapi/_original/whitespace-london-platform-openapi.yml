                        appendixDescription:
                          type: string
                          example: Inline Attachment Example
                          description: Contains the optional description text, if any, added below appendixTitle to describe the attachment when it is set to export after the contract. Blank if not provided or if prepend is TRUE
                        prepend:
                          type: boolean
                          example: true
                          description: True if the attachment has been set to appear at the front of the contract when exporting
                    image:
                      description: If the line item is an inline image, its data will be stored in this array.
                      type: object
                      properties:
                        docID:
