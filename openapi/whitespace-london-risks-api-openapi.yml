  /api/risks/{EndorsementID}/showEndorsement:
    post:
      tags:
      - Risks
      summary: Show an endorsement to underwriters - Broker Only
      parameters:
      - in: path
        name: EndorsementID
        schema:
          type: string
        required: true
        description: The unique ID of the Endorsement
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO::EN1
      requestBody:
        description: Can only show to "leader" or "agreementParty"
        content:
          application/json:
            schema:
              type: object
              properties:
                carriers:
                  type: array
                  description: The carrier team/s to be shown the risk
                  items:
                    type: object
                    properties:
                      channel:
                        type: string
                        example: whitesails_ALL
                      role:
                        type: string
                        example: leader
      responses:
        '200':
          description: successfully showed endorsement
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Shown.
                    description: Success is confirmed by the message 'Shown.'
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{EndorsementID}/acceptEndorsement:
    post:
      summary: Accept an endorsement as an underwriter - Underwriter Only
      tags:
      - Risks
      parameters:
      - in: path
        name: EndorsementID
        schema:
          type: string
          example: ICF1317DDA-50DB-4611-8253-D3DA499F861C::FO::EN1
        required: true
        description: The unique ID of the endorsement, starting IC and having parts delimited by '::'. This must be an endorsement, so the riskID will end ENx where x is 1, 2...
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - channel
              properties:
                channel:
                  type: string
                  description: the channel for the underwriter's team
                  example: palermo_ALL
                instruction:
                  type: string
                  description: For leaders only -- set to specify the underwriters who must agree the endorsement -- one of leaderOnly, leaderAndAgreementParties or allToAgree, otherwise omit the value
                  example: leaderOnly
                notify_days:
                  type: string
                  description: leader only, optional -- the number of days the broker has to notify following parties
                  example: '7'
      responses:
        '200':
          description: The full JMRC of the risk. In the JSON, .control.isIndicative will be updated to the new true/false value (not shown in the example).
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: an acceptance message
                    example: accepted
  /api/risks/changeRiskName/{rootID}:
    post:
      summary: Change the name of the risk - Broker Only
      description: Risk name can only be changed if the risk has not been shown to any markets.
      parameters:
      - in: path
        name: rootID
        schema:
          type: string
        required: true
        description: The unique root ID of the risk
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      tags:
      - Risks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newName:
                  type: string
                  description: The new name of the risk
                  example: Acme Widgets
      responses:
        '200':
          description: A confirmation of the saved data
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: Message to confirm that the risk name has been updated
                    example: Updated Risk Name
  /api/risks/{quoteID}/createDraftFromQuote:
    post:
      summary: Create an editable draft from a quote - Broker Only
      description: Broker accounts only. Duplicates an underwriter''s quote as a new editable draft under the same risk. This is only possible for risks that have not yet progressed to the firm order stage.
      tags:
      - Risks
      parameters:
      - in: path
        name: quoteID
        schema:
          type: string
        required: true
        description: The unique document ID of the quote, starting IC and ending ::UQx, where x is the number of the quote in order of quotes recieved, ie. 1, 2, 3 etc
        example: ICD77B5FD4-0790-42B9-BC53-65242FB96558::MU438E3843-63ED-47AD-9059-11E6FD1D000D::UQ1
      responses:
        '200':
          description: successfully created Draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: a message showing that the draft has been created
                    example: Draft created
  /api/risks/{riskID}/lineItemAttributes:
    post:
      tags:
      - Risks
      summary: Edit an attribute of a line item -- that is, one contract heading and its associated text -- such as locking the text to prevent further editing, or adding a page break
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique  ID of the risk
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      requestBody:
        content:
          application/json:
            examples:
              Add/Remove Page Break:
                description: Add or remove a page break to a heading
                value:
                  index: 3
                  hasPageBreak: true
              Lock Text:
                description: Lock the text in a heading, Locktype options are "lockTextOnly", "lockAll", "lockTextOnlyTemplate", "lockAllTemplate"
                value:
                  index: 3
                  lockType: lockTextOnly
                  locked: true
            schema:
              properties:
                lockType:
                  type: string
                  description: required to be 'edit'
                  example: edit
                hasPageBreak:
                  type: boolean
                  description: choose to add page break to heading or not
                  example: true
                index:
                  type: number
                  description: the index of the line item to be changed
                  example: 6
                locked:
                  type: boolean
                  description: choose whether to lock or not
                  example: true
      responses:
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/getQuoteDetails:
    get:
      tags:
      - Risks
      summary: Returns any information entered by the underwriter into a quote's 'Quote Details' panel. Underwriters are not required to use this panel when quoting, so some (or all) information may be blank.
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the quote, ending in ::UQ# (where
        example: ICCFD2A903-08B1-4E52-BD9B-57268B9723F8::MU999AF919-3FDB-49F2-B4C5-D42614B02E70::UQ1
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  buttonStampDetails:
                    type: object
                    properties:
                      stampID:
                        type: string
                        example: BTN-BAB19551-5557-4E6B-888B-E3B1B6A0E982
                        description: The unique ID of the button stamp added by the underwriter
                  validityPeriod:
                    type: number
                    description: The valdity period of the quote
                    example: 7
                  notes:
                    type: string
                    example: Notes for the Quote
                    description: Free-text notes added by the underwriter
                  reference:
                    type: string
                    example: '123123123'
                    description: The underwriter's reference number for the quote
                  quotedLineSize:
                    type: string
                    example: '15'
                    description: The quoted line percentage
                  conditions:
                    type: string
                    example: Line To Stand
                    description: Any subjectivities or conditions that the underwriter requires when writing a line on this contract
                  indicatedStamps:
                    type: array
                    items:
                      type: string
                      example: Lloyds Syndicate 1256
                      description: The stamp that the underwriter is considering using when writing the line
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/saveQuoteDetails:
    post:
      summary: Edit and Save Quote Details - Underwriter Only
      description: Can edit the quote reference, any subjectivites/line conditions, notes, and the quote''s validity period, as well as indicate line stamps to use when writing and/or add button stamps
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
          example: ICB2906C80-AC59-4B3A-B4AC-643E340D5B30::MUD10D799A-7AEB-4F84-A4D9-9FDA73D057DE::UQ
        required: true
        description: The unique ID of the quote in preparation, starting IC and having parts delimited by ::, ending with UQ# where '#' is 1,2,3 etc
      requestBody:
        description: Payload only needs to be complete if you want to edit every detail, otherwise remove irrelvant fields
        required: true
        content:
          application/json:
            schema:
              properties:
                reference:
                  type: string
                  description: Quote Reference
                  example: '121232131'
                conditions:
                  type: string
                  description: Subjectivites/ Line Conditions
                  example: Line To Stand
                notes:
                  type: string
                  description: Notes
                  example: Prefer to be leader
                validityPeriod:
                  type: number
                  description: Validity period in days
                  example: 12
                indicatedStamps:
                  type: array
                  description: Indication of the full stamp likely to be used when writing a line
                  items:
                    type: string
                    example: Lloyds 1234
                buttonStampDetails:
                  type: object
                  description: Button stamp details
                  properties:
                    stampID:
                      type: string
                      description: ID of the Button Stamp
                      example: BTN-BAB19551-5557-4E6B-888B-E3B1B6A0E982
                    showOnEditedHeadings:
                      type: boolean
                      example: false
                quotedLineSize:
                  type: string
                  description: Quoted line percentage
                  example: '12'
      responses:
        '200':
          description: successfully saved quote details
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: A message indicating success
                    example: Successfully updated quote details.
