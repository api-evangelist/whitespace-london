                        example: 392ccf6c3b8bcba72027b4fbb0882aab74579063a9132b269803fa612f4c14ab
                      provHash:
                        type: string
                        example: 54c906ca1b32c13e33224580e562b20752576a1becaa97df48d21a396ebdfa34
                      system:
                        type: string
                        example: LaVAPI
                      writtenAt:
                        type: string
                        example: '2025-05-23 08:50:29'
                      userID:
                        type: string
                        example: MU9FCFC64E-7694-420A-BE61-2ABEDB3E8F52
                  updatedAt:
                    type: string
                    example: '2025-05-23 08:50:29'
                  _rev:
                    type: string
                    example: 9-ff211010ac83c76c5f76b31b2f87a3e6
                  createdAt:
                    type: string
                    example: '2024-06-11 11:11:46'
                  version:
                    type: integer
                    example: 21700
                  template:
                    type: string
                    example: GUAStampB
                  uwrChannel:
                    type: string
                    example: offlinearielrebda_ALL
                  channels:
                    type: array
                    items:
                      type: string
                    example:
                    - akhil_ALL
                    - offlinearielrebda_ALL
                  type:
                    type: string
