                                  description: details of any no deadline subjectivities
                            leadUnderwriter:
                              type: boolean
                              description: are they the lead underwriter or not
                            writtenDate:
                              type: integer
                              example: 1747654790
                              description: Date in unix epoch time
                      uwrChannel:
                        type: string
                        example: offlineblenheimsyndicate_ALL
                      saveStamps:
                        type: boolean
                        description: Choose whether to save a stamp. Only works for off-platform entities.
      responses:
