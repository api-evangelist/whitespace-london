                  - elements:
                    - text: Broker Limited will submit de-linked accounts to Xchanging Ins-Sure Services Ltd (XIS) where possible.
                    - text: 'In respect of any PPW, PPC, PPD or SDD the following apply:'
                    - text: Premium payment requirements are deemed met by presentation of premium/accounts to XIS on or before the SDD and will not be recorded as a late signing or payment;
                    - text: The SDD is deemed in all instances to be the same as the PPW, PPC or PPD due date;
                    - text: Where the PPW, PPC or PPD has been updated then the SDD shall be deemed to be updated in parallel, unless otherwise stated to the contrary;
                    - text: The PPW, PPC, PPD or SDD shall not be deemed to be breached if the original presentation of the electronic submission to XIS is in time, but subsequently
                    - text: amendments to the electronic submission are notified as being required to enable the premium signing to be completed. In such event Broker Limited shall have an additional period of seven days from such notification to complete the amendments and resubmit the electronic submission to XIS;
                    - text: Where a PPW, PPC, PPD or SDD falls on a weekend or public holiday, presentation to XIS on the next working day will be deemed in compliance with the PPW, PPC, PPD or SDD.
                    - text: (Re)insurer(s) hereby agree that any premium payable in instalments under this contract will be processed as
                    - text: delinked Additional Premium entries other than when submitted under the Deferred Account Scheme. However, any annual instalments to be allocated to respective year of account.
                    - text: (Re)insurer(s) authorise XIS to issue separate signing numbers and dates for their participations only and issue a single claims FDO signing where applicable.
                    - text: Where payments are received by Broker Limited in convertible currencies, (re)insurer(s) agree to accept/settle accounts at rate(s) of exchange obtained by Broker Limited.
                    - text: In respect of convertible currencies, (re)insurer(s) instruct XIS to accept settlement in any valid settlement currency as determined by Broker Limited.
                    - text: In the event of this contract stating multiple insurance and/or reinsurance premiums (each to be paid from a different source); and/or separate entries/sections for taxation/regulation reporting purposes, XIS are instructed to leave the premium advice notes ungrouped so that each can be released separately once paid by the respective client.
                    - text: In the event of partial premium received by Broker Limited, (re)insurer(s) agree to accept premium as paid to and endorsed by Broker Limited.
                    - text: XIS are authorised to sign premium from individual Insureds / territories / sections separately as and when received by Broker Limited.
                    - text: (Re)insurers agree that Broker Limited may settle
                    - text: premiums for this contract/release de-linked premium for this contract into settlement at different times.
