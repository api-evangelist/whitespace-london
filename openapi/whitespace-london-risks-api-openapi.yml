                  - elements:
                    - index: 0
                      text: 'Premium Payment Clause:'
                    - index: 1
                      text: Notwithstanding any provision to the contrary within this contract or any endorsement hereto, in respect of non-
                    - index: 2
                      text: payment of premium only the following clause will apply. The (Re)Insured undertakes that premium will be paid in full to (Re)Insurers within [[DefinedData0]] of this contract (or, in respect of instalment premiums, when due).
                    - index: 3
                      text: If the premium due under this contract has not been so paid to (Re)Insurers by the 90th day from the inception of this contract (and, in respect of instalment premiums, by the date they are due) (Re)Insurers shall have the right to cancel this contract by notifying the (Re)Insured via the broker in writing. In the event of cancellation, premium is due to (Re)Insurers on a pro rata basis for the period that (Re)Insurers are on risk but the full contract premium shall be payable to (Re)Insurers in the event of a loss or occurrence prior to the date of
                    - index: 4
                      text: termination which gives rise to a valid claim under this
                    - index: 5
                      text: contract.
                    - index: 6
                      text: It is agreed that (Re)Insurers shall give not less than Thirty days prior notice of cancellation to the (Re)Insured via the broker. If premium due is paid in full to (Re)Insurers before the notice period expires, notice of cancellation shall automatically be revoked. If not, the contract shall automatically terminate at the end of the notice period.
                    - index: 7
                      text: If any provision of this clause is found by any court or
                    - index: 8
                      text: administrative body of competent jurisdiction to be invalid or unenforceable, such invalidity or unenforceability will not affect the other provisions of this clause which will remain in full force and effect.
                    - index: 9
                      text: '[[DefinedData1]]'
