                    headingAlign:
                      type: string
                      description: The alignment of the heading on the page, either left or centre
                      example: left
                    tagPages:
                      type: array
                      description: The pages (aka groups) of Defined Data tags associated with the line item. Empty if there is no tagged data in the line item
                      items:
                        $ref: '#/paths/~1api~1risks~1%7BriskID%7D~1editLineItem/post/requestBody/content/application~1json/schema/properties/tagPages/items'
                    placeholders:
                      type: array
                      description: The array of placeholders which specify the location of the line item's tagged data values. Each item of tagged data has its own placeholder
                      items:
                        $ref: '#/paths/~1api~1risks~1%7BriskID%7D~1editLineItem/post/requestBody/content/application~1json/schema/properties/placeholders/items'
                    elements:
                      type: array
                      description: The array of individual pieces of text held in the line item
                      items:
                        $ref: '#/paths/~1api~1risks~1%7BriskID%7D~1editLineItem/post/requestBody/content/application~1json/schema/properties/elements/items'
                    potentialSection:
                      type: string
                      description: The MRC name of the contract section where the current mrcHeading is normally expected, if different to the actual mrcSection. This string is rarely used
                      example: RiskDetails
                    fragments:
                      type: array
                      deprecated: true
                      description: A deprecated array which should be left empty
                      items:
                        type: object
                    subItems:
                      type: array
                      deprecated: true
                      description: A deprecated array which should be left empty
                      items:
                        type: object
                    vertical:
                      type: object
                      properties:
                        id:
                          type: string
                          description: If the line item is a vertical term, this contains the unique ID of the vertical
                          example: VDCD69D9B-7195-4021-927E-43B9F1F9AEDD_2
                        assignedCarrierPrefixes:
                          type: array
                          items:
                            type: string
                            example: toymunderwriting
                            description: The channel prefix (the first section of the channel name) of carrier/s assigned this version of the vertical term
  /api/risks/{riskID}/markAsFirmOrder:
    post:
      summary: The broker converts a quoted risk into a firm order - Broker Only
      description: An empty payload of {} is required for this endpoint
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
          example: ICB2906C80-AC59-4B3A-B4AC-643E340D5B30::MUD10D799A-7AEB-4F84-A4D9-9FDA73D057DE::UQ
        required: true
        description: The unique ID of the risk, starting IC and having parts delimited by '::'
      requestBody:
        description: Please add an empty payload of {}
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Empty Payload
      responses:
        '200':
          description: successfully marked as Firm Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: A message indicating success
                    example: doc with id ICB2906C80-AC59-4B3A-B4AC-643E340D5B30::MUD10D799A-7AEB-4F84-A4D9-9FDA73D057DE::UQ1 successfully marked as firm order
  /api/risks/{riskID}/markAsIndicative:
    post:
      summary: The underwriter sets or unsets the indicative flag for an Underwriter Quotation ::UQx
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
          example: ICB2906C80-AC59-4B3A-B4AC-643E340D5B30::MUD10D799A-7AEB-4F84-A4D9-9FDA73D057DE::UQ1
        required: true
        description: The unique ID of the risk, starting IC and having parts delimited by '::'. This must be an underwriter quotation, so the riskID will end UQx where x is 1, 2...
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                indicative:
                  type: boolean
                  description: true if the quotation is indicative, false if it is noe
                  example: true
      responses:
        '200':
          description: The full JMRC of the risk. In the JSON, .control.isIndicative will be updated to the new true/false value (not shown in the example).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RWPlacing'
  /api/risks/{riskID}/requestWrittenLineSets:
    post:
      summary: Sends a Firm Order/Bindable Quote risk to a carrier for a Written Line - Broker Only
      description: <p>The payload covers various options which the broker can set, including the percentage range for the Written Line and the Stamp to be used. Multiple carriers can be approached with one endpoint call.</p>
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk, starting IC and having parts delimited by '::'
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                _rev:
                  type: string
                  description: the revision number for the risk
                  example: 1-de9bba4cb8ea75572af90209683166c6
                stampVisibility:
                  type: string
                  description: Only set for the first underwriter you show to. Decides whose stamps underwriters can see. Allstamps is the default if stampVisibility is not included in payload.
                  enum:
                  - Allstamps
                  - OwnStampsOnly
                  - LeadersStamps
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      channel:
                        type: string
                        description: channel of underwriter you are sending message to
                        example: tomyunderwriting_ALL
                      elements:
                        type: array
                        items:
                          type: object
                          description: main body of the message
                          properties:
                            text:
                              type: string
                              example: Please Accept
                            index:
                              type: integer
                              example: 0
                      greeting:
                        type: string
                        description: The header of the message
                        example: Hello
                      closing:
                        type: string
                        example: The Closing statement
                        description: Best Regards
                contents:
                  type: array
                  items:
                    type: object
                    properties:
                      teamId:
                        type: string
                        example: MARINEHULL
                        description: the broker or carrier team, all uppercase no spaces
                      companyId:
                        type: string
                        example: WHITECLIFFS
                        description: the broker or carrier company, all uppercase no spaces
                      userId:
                        type: string
                        description: unique identifier for the individual user at a company, starting MU
                        example: MUD10D799A-7AEB-4F84-A4D9-9FDA73D057DE
                      sections:
                        type: array
                        items:
                          type: object
                          properties:
                            min:
                              type: number
                              description: the minimum percentage line allowed
                              example: 33.33
                            max:
                              type: number
                              description: the maximum percentage line allowed
                              example: 66.67
                            leader:
                              type: boolean
                              description: true if the underwriter is to be the lead on the risk
                              example: false
                            stamps:
                              type: array
                              description: leave empty to allow the underwriter to choose from all available stamps
                              items:
                                $ref: '#/components/schemas/CorporateDetail/properties/stamps/items'
                            sectionID:
                              type: string
                              description: Only needed if risk is sectioned. ID of the section you are showing to
                              example: '1'
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      docID:
                        type: string
                        description: docId of the attahcment you want to send
                        example: ICD543E41B-D57A-4F82-921B-2955107A328F::ATCH::A-2DD69B77-97CB-4956-8905-A0B045798BED
                      attachID:
                        type: string
                        description: ID of the attachment
                        example: A-2DD69B77-97CB-4956-8905-A0B045798BED
                      channels:
                        type: array
                        items:
                          type: string
                          description: channels of the carrier you want to send attachment to
                          example: whitesails_MARINE
      responses:
        '200':
          description: successfully requested a line
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Line guidances sent.
                    description: A message indicating success
  /api/risks/{riskID}/showQuoteToBroker:
    post:
      summary: The Underwriter sends an Underwriter Quotation back to the Broker - Underwriter Only
      description: No payload is required for this endpoint
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk, starting IC and expected to end ::UQx where x is 1, 2, 3 etc
        example: IC8F2D09C8-A220-4DD6-9E14-77AFF7A617AC::MU71BA6F2F-FFD1-4A92-86AC-5277FEAF3012::UQ4
      responses:
        '200':
          description: successfully quoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: a message showing a successful result
                    example: doc with id IC8F2D09C8-A220-4DD6-9E14-77AFF7A617AC::MU71BA6F2F-FFD1-4A92-86AC-5277FEAF3012::UQ4 successfully shown to broker
  /api/risks/{riskID}/showToLeadUnderwriter:
    post:
      summary: Shows a draft risk to an underwriter for quoting - Broker Only
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The root ID of the risk, starting IC and stopping before any '::' delimiters. The POST payload has several optional parameters -- 'userId' specifies the uniqueID of a specific user to show the draft to, 'messages' includes a broker's message with the contract, and 'attachments' identifies attachments to show.
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  description: The carrier team to show the draft to. All uppercase, no spaces
                  example: MARINEHULL
                companyId:
                  type: string
                  description: The carrier company to show the draft to. All uppercase, no spaces
                  example: WHITECLIFFS
                userId:
                  type: string
                  description: Optional. Include to specify the MU identifier of the individual underwriter to show the draft to
                  example: MUD10D799A-7AEB-4F84-A4D9-9FDA73D057DE
                facilityID:
                  type: string
                  description: Required if the risk is a declaration. Specifies the facility agreement that the draft is being shown under
                  example: ICCDA7C650-47DB-40E5-B8C0-588867E6BB6D
                messages:
                  type: array
                  description: Optional. Include to provide an accompanying broker's message
                  items:
                    type: object
                    properties:
                      channel:
                        type: string
                        description: The receipient's channel ID
                        example: whitecliffs_MARINEHULL
                      elements:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                              example: Please agree
                              description: The body of the message
                            index:
                              type: integer
                              example: 0
                      greeting:
                        type: string
                        example: Hello
                        description: The header text of the message
                      closing:
                        type: string
                        example: Best regards
                        description: The footer text of the message
                attachments:
                  type: array
                  description: Optional. Include to specify attachment/s to show with the draft
                  items:
                    type: object
                    properties:
                      attachID:
                        type: string
                        example: A-77C8A342-DCDA-410B-9292-B3CD3105FC10
                        description: The ID of the attachment
                      docID:
                        type: string
                        example: IC2B5E02ED-FF47-4BB6-98F5-8C85F1E052B5::ATCH::A-77C8A342-DCDA-410B-9292-B3CD3105FC10
                        description: The unique ID of the attachment document
                      channels:
                        type: array
                        items:
                          type: string
                          example: whitecliffs_MARINEHULL
                          description: The channel of the recipient to show the attachment to
      responses:
        '200':
          description: successfully showed the quote to an underwriter
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Shown ICC81F7C6D-90D8-430B-9514-30B9A2614612 to Underwriter MARINEHULL at WHITECLIFFS
  /api/risks/{riskID}/signSets:
    post:
      summary: Sign the written lines on a Firm Order, promoting the risk to signed status - Broker Only
      description: <p>The payload must include one written line set identifying the line or lines written by an underwriter, along with the percentage of the risk signed to that line. This set can include a section ID reference, and multiple sets may be written so long as the total percentage written does not exceed 100%.</p>
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk's firm order, starting with IC and having parts delimited by '::FO'
        example: ICEB56176E-D379-4B23-BD18-64EC5C841573::FO
      requestBody:
        description: JSON payload
        required: true
        content:
          application/json:
            schema:
              items:
                type: object
                properties:
                  wSetID:
                    type: string
                    description: The ID reference specifying a specific written line set.
                    example: IC733AB61B-75D0-4900-89EA-F059D7F57FE2::FO::PALERMO::ALL::WRLS
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sectionIDs:
                          type: array
                          description: The section number of the risk that the specified written line applies to.
                          items:
                            type: string
                            example: '1'
                        percentages:
                          type: array
                          description: The numeric percentage being signed to that written line.
                          items:
                            type: string
                            example: '60'
            examples:
              Open Market Simple:
                summary: A simple sign set example
                value:
                - wSetID: ICEB56176E-D379-4B23-BD18-64EC5C841573::FO::MESSINA::ALL::WRLS
                  items:
                  - sectionIDs: []
                    percentages:
                    - '100'
              Open Market Complex:
                summary: Open Market Complex Example
                value:
                - wSetID: IC733AB61B-75D0-4900-89EA-F059D7F57FE2::FO::MESSINA::ALL::WRLS
                  items:
                  - sectionIDs: []
                    percentages:
                    - '60'
                - wSetID: IC733AB61B-75D0-4900-89EA-F059D7F57FE2::FO::PALERMO::ALL::WRLS
                  items:
                  - sectionIDs: []
                    percentages:
                    - '22.2222'
                - wSetID: IC733AB61B-75D0-4900-89EA-F059D7F57FE2::FO::SIRACUSA::ALL::WRLS
                  items:
                  - sectionIDs: []
                    percentages:
                    - '17.7778'
              Declaration Shown to Multi Section Facility:
                summary: Multi-section facility
                value:
                - wSetID: ICC002A9C1-89C9-4B00-9807-4453DFA80853::FO::TOMYUNDERWRITING::ALL::WRLS
                  items:
                  - sectionIDs: []
                    percentages:
                    - '50'
                    associatedFacilityID:
                      facilityID: ICD77B5FD4-0790-42B9-BC53-65242FB96558
                      sectionID: '1'
      responses:
        '200':
          description: successfully signed lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Successfully signed lines!
                    description: Success is confirmed by the message 'Successfully signed lines!'
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/reSignSets:
    post:
      summary: Update the Signed Lines on a Signed Risk - Broker Only
      description: The payload must include one signed line set -- i.e docs ending with ::SILS -- identifying the line or lines written by an underwriter, along with the percentage of the risk signed to that line. This set can include a section ID reference, and multiple sets may be written. Total of signed lines cannot exceed total of written lines or 100%.
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the signed risk, starting with IC and having parts delimited by '::SIGNED'
        example: ICEB56176E-D379-4B23-BD18-64EC5C841573::SIGNED
      requestBody:
        description: JSON payload
        required: true
        content:
          application/json:
            schema:
              properties:
                wSetID:
                  type: string
                  description: ID of the signed line set
                  example: IC11FC73F5-402A-44CD-AA9B-633259574B90::FO::PALERMO::ALL::SILS
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      sectionIDs:
                        type: string
                        description: The number of the risk's section that the signed line applies to.
                        example: '1'
                      percentages:
                        type: string
                        description: The numeric percentage being signed to the written line.
                        example: '60'
            examples:
              simple:
                value:
                - wSetID: ICD875FA8F-F588-41FA-AA98-BE14A535B545::FO::TOMYUNDERWRITING::ALL::SILS
                  items:
                  - sectionIDs: []
                    percentages:
                    - '90'
              complex:
                value:
                - wSetID: IC11FC73F5-402A-44CD-AA9B-633259574B90::FO::PALERMO::ALL::SILS
                  items:
                  - sectionIDs:
                    - '1'
                    percentages:
                    - '80'
                  - sectionIDs:
                    - '2'
                    percentages:
                    - '83.3333'
                - wSetID: IC11FC73F5-402A-44CD-AA9B-633259574B90::FO::MESSINA::ALL::SILS
                  items:
                  - sectionIDs:
                    - '1'
                    percentages:
                    - '20'
                  - sectionIDs:
                    - '2'
                    percentages:
                    - '16.6667'
      responses:
        '200':
          description: successfully re-signed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    rev:
                      type: string
                      description: new revision number
                      example: 1-5e6cfb565e6c4457f9ddedf88442e878
                    id:
                      type: string
                      example: ID
                      description: Id of the changed document
                example:
                - rev: 1-5e6cfb565e6c4457f9ddedf88442e878
                  id: ICB333DE48-8A44-47A8-BBED-E80B78FB736D::RWResignedLines::1691753008::887A9F05-5745-44A6-9E02-9A0738976AA3
                - id: ICB333DE48-8A44-47A8-BBED-E80B78FB736D::FO::TOMYUNDERWRITING::ALL::SILS
                  rev: 2-53b67a68a4822f36e0c73b744bbaaed8
                - id: ICB333DE48-8A44-47A8-BBED-E80B78FB736D::SIGNED::TOMYUNDERWRITING::ALL
                  rev: 2-ffc29c3c3687e7da519a03083d630872
                - id: ICB333DE48-8A44-47A8-BBED-E80B78FB736D::SIGNED
                  rev: 2-f62ac6070164fc3dc527af9f4e432ab2
                - id: ICB333DE48-8A44-47A8-BBED-E80B78FB736D::SIGNED::ARCH::D8B3CD82-13C8-4F95-B32C-59FFAE1501EA
                  rev: 1-2cb2e9604aa2732c156d8c4952080ef2
                - id: ICB333DE48-8A44-47A8-BBED-E80B78FB736D::SIGNED::ACTI::A1E5D8E7-D2CB-497E-80DC-0ECA7FA5E8C8
                  rev: 1-fd42e2e456272f33005d436540c3c044
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/writeLine:
    post:
      summary: Writes a line to the risk - Underwriter Only
      description: <p>The payload must include one stamp detailed as line percentage, year and stamp ID, with references. It can optionally include section ID references, multiple stamps, and details of line conditions or subjectivities.</p>
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk's firm order, starting with IC and having parts delimited by '::FO::{COMPANYID}::{TEAMID}'
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO::TOMYUNDERWRITING::MARINE
      requestBody:
        description: JSON payload
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                _rev:
                  type: string
                  description: The system-generated version number of the firm order for the line to be written to. The number before the - is generated sequentially, starting at 1'
                  example: 1-a302cd4445e3d12c33fdabf467e2789b
                line:
                  type: object
                  properties:
                    sectionIDs:
                      type: array
                      description: The section number of the risk that the written line applies to.
                      items:
                        type: string
                        example: '1'
                    impressions:
                      type: array
                      items:
                        type: object
                        properties:
                          writtenPercentage:
                            type: string
                            description: The percentage of the risk to write as a line. This must meet the line guidance in the firm order.
                            example: '60'
                          stampID:
                            type: string
                            description: The document ID of the stamp to be used in writing the line, beginning with ST. A company''s stamp list can be retrieved using /documents/Corporate-{companyID}
                            example: ST1843A345-1F69-435D-84E9-187BB3DD0F23
                          yearOfAccount:
                            type: string
                            description: The year of accounting for the line. Only needed for the lead line.
                            example: '2022'
                          references:
                            type: array
                            items:
                              type: object
                              properties:
                                reference:
                                  type: string
                                  description: The underwriter''s reference code for the line.
                                  example: 22FB238273XX
                                riskCodes:
                                  type: string
                                  description: The category code describing the subject of the line.
                                  example: H3
                                description:
                                  type: string
                                  description: A free text comment field for the line.
                                  example: Ref:0023
                          mirrorStampData:
                            type: array
                            items:
                              type: object
                              properties:
                                mirrorStampReferences:
                                  type: array
                                  description: the mirror stamp reference code
                                  items:
                                    example: 22FB238
                                mirrorStampDescriptions:
                                  type: array
                                  description: A free text comment field for the mirror stamp.
                                  items:
                                    example: REF:025
                                    type: string
                                mirrorStampID:
                                  type: string
                                  example: STDECAA286-05B2-4FEA-942E-09A3EC352030
                                  description: The document ID of the stamp to be used as a mirror, beginning with ST. A company''s stamp list can be retrieved using /documents/Corporate-{companyID}
                                mirrorStampCustomDescription:
                                  type: string
                                  example: Applying to EEA risks
                                  description: The text description of the cover associated with the mirror stamp.
                    conditions:
                      type: object
                      properties:
                        lineConditions:
                          type: array
                          description: The set of line conditions added by the underwriter
                          items:
                            type: string
                            example: Line To stand
                        subjectivityMode:
                          type: string
                          enum:
                          - unchosen
                          - holdingCover
                          - noCoverGiven
                          description: Whether the line provides ongoing cover while the specified subjectivity requirements are being agreed
                        subjectivities:
                          type: array
                          description: Details of subjectivity requirements added by the underwriter
                          items:
                            type: object
                            properties:
                              deadline:
                                type: string
                                example: '1708560000.0'
                                description: The deadline for accepting the subjectivity response, in unix epoch time
                              identifier:
                                type: string
                                example: ''
                                description: The uniqueID of the subjectivity. Leave blank, as the platform will auto-generate this
                              text:
                                type: string
                                example: Sample Subjectivity
                                description: Text detailing the requirement of the subjectivity
                        subjectivitiesDeadlineNotRequired:
                          type: string
                          description: Text detailing any subjectivity requirements which do not have a deadline
            examples:
              simple:
                value:
                  _rev: 1-1fb5b6812cb938636e5b1a3de968ce6a
                  line:
                    sectionIDs: []
                    impressions:
                    - references:
                      - reference: 22FB238273XX
                        riskCodes: X1
                        description: Ref:0023
                      writtenPercentage: '100'
                      stampID: ST1843A345-1F69-435D-84E9-187BB3DD0F23
                      yearOfAccount: '2022'
                    conditions:
                      lineConditions: []
                      subjectivities: []
              conditionsAndSubjectivities:
                value:
                  _rev: 1-0f9d0731df4d917b0daba4974b7a647e
                  line:
                    sectionIDs: []
                    impressions:
                    - references:
                      - reference: LINECONSSUBS
                        riskCodes: ''
                        description: ''
                      writtenPercentage: '100'
                      stampID: ST1843A345-1F69-435D-84E9-187BB3DD0F23
                      yearOfAccount: '2022'
                    conditions:
                      lineConditions:
