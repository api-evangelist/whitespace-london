                  description: the type of agreement template for the endorsement
                  example: GUAStampA
                  enum:
                  - GUAStampA
                  - GUAStampB
                  - AVS100B
                  - NonGUA
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                type: object
                properties:
