    post:
      tags:
      - Risks
      summary: Edit an attribute of the entire contract. Currently limited to text-locking options - Broker Only
      description: <ul> <li>lockAll - lock all text and tagged data</li> <li>lockTextonly - lock normal text but allow tagged data to be edited</li> <li>lockAllTemplate - Template Only - locks all text and tagged data, can only be removed by a Template Manager, same locking is applied to any risks cloned from the template</li> <li>lockTextOnlyTemplate - Template Only - lock normal text but allow tagged data to be editable, can only be removed by a Template Manager, same locking is applied to any risks cloned from the template</li></ul>
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      requestBody:
        content:
          application/json:
            schema:
              properties:
                isLocked:
                  type: boolean
                  description: Either true or false
                  example: true
                lockType:
                  type: string
                  description: Mandatory, if isLocked is True
                  example: lockAll
                  enum:
                  - lockAll
                  - lockTextOnly
                  - lockTextOnlyTemplate
                  - lockAllTemplate
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                properties:
                  rev:
                    description: revision of the new risk
                    example: 10-849b76541bfc6683d15208ea4ebe43c5
                    type: string
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: string
                    example: IC9326FED7-A802-4C86-B625-6E078470CA83
                    description: ID of thr risk/template
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/setTemplateChannels:
    post:
      tags:
      - Risks
      summary: Set the teams that a template is visible to - Broker Only
      description: Share or unshare a template with other teams. The user can share templates with teams that they are not a member of. NOTE that this does not create a copy of the shared template, it opens the shared template to multiple user teams, so any changes made by users in other teams will affect all users.
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the template
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  type: array
                  items:
                    type: string
                  description: A definitive list of the channels of the teams who can access the template, including the original team it was created in. To unshare the template, remove the team from the list. The list must contain at least one active team.
                  example:
                  - blackpool_TEMPLATEMGRS
                  - blackpool_MARINE
                  - blackpool_AVIATION
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                properties:
                  msg:
                    description: A message indicating success
                    example: Template channels updated.
                    type: string
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/quoteOnRequest:
    post:
      tags:
      - Risks
      summary: Send a Quote back to the broker wihout making any alterations to the Quote Request received - Underwriter only
      description: This call allows an underwriter to return a Quote to the originating broker, provided that it is not necessary to make any changes to the broker''s Quote Request. If changes are required, then use /changeDraftNowQuoteInPreparation to create an editable quote document, edit that document, and then use /showQuoteToBroker to return the edited document as a Quote.
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the Quote Request
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::QR1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Empty Payload
      responses:
        '200':
          description: quoted successfully
          content:
            application/json:
              schema:
                properties:
                  msg:
                    description: A message indicating success
                    example: doc with id IC49675395-BE31-4CDC-8386-2FF664FA8B19::QR1 successfully quoted
                    type: string
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/deleteEndorsement:
    post:
      summary: Deletes a Draft Endorsement - Broker Only
      description: Deletes a specified endorsement. NOTE it is only possible to delete a endorsement if it has not been shared with any carriers.
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the Endorsement
        example: IC63D86D53-3B1F-459F-9D35-5C2D4F0E4854::FO::EN1
      requestBody:
        description: Please add an empty object of {}
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Empty Payload
      responses:
        '200':
          description: successfully deleted the endorsement
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: deleted
                    description: A message indicating success
  /bodapi/risks/from:
    post:
      tags:
      - Risks
      summary: Create a new risk/template using the Contract Library
      description: Uses blockIDs (The IDs of line items in the contract Library) to create a new risk or template. Currently you can grab these blockIDs by going through the process to create the contract in the UI Contract Library. Just before you publish it, you also get access to the 'API Call Preview' button which opens a window showing the exact payload needed to perform the same creation via API.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blockIDs:
                  type: array
                  items:
                    type: string
                    description: The ID of the Library block (line item) you want to use
                    example: Bod::8D4D3C79-0BFF-4C43-BBD7-D4177E5B884D::BB
                layoutID:
                  type: string
                  description: Optional. The ID of the Library layout guide (contract structure outline) you want to use
                  example: Bod::BA8E6129-7257-491F-B3D6-4FFA920A8569::LD
      parameters:
      - in: query
        required: true
        name: UMR
        description: Unique market reference (required if creating a risk, but optional for a template)
        example: B123123123123
        schema:
          type: string
      - in: query
        required: true
        name: insuranceType
        description: Type of insurance
        schema:
          type: string
          enum:
          - Insurance
          - Reinsurance
      - in: query
        required: true
        name: contractType
        description: Type of contract
        schema:
          type: string
          enum:
          - Open Market/ Declaration
          - FacilityAgreement
      - in: query
        required: true
        name: mode
        description: Is this a facility agreement?
        schema:
          type: string
          enum:
          - normal
          - facility
      - in: query
        required: true
        name: insuredName
        description: Name of the insured
        schema:
          type: string
          example: Acme Widgets Inc
      - in: query
        required: true
        name: teamChannel
        description: Whitespace team channel name
        example: lloydsbroker_AVIATION
        schema:
          type: string
      - in: query
        required: true
        name: placementType
        description: Is the contract a template or a risk?
        schema:
          type: string
          enum:
          - FullContract
          - Template
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: string
                    example: IC0000000-000-00
                  rev:
                    type: string
                    description: Revision number of the newly created Risk
                    example: 1-K23K2J2JL323IEOW
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/editLineItemWithBB:
    post:
      tags:
      - Risks
      summary: Add or edit a heading in a risk using a lineitem from the Clause Library
      description: Similar to the /editLineItem call except you use the bodleyID of the library line item rather than fill out the details of the line item yourself
      parameters:
      - in: path
        name: riskID
        required: true
        schema:
          type: string
          description: The unique ID of the risk document, starting with IC and having parts delimited by '::'
          example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
      requestBody:
        description: Data specifying the line item update
        required: true
        content:
          application/json:
            schema:
              properties:
                op:
                  type: string
                  description: select whether to insert or edit a line item in the risk
                  enum:
                  - insert
                  - edit
                rev:
                  type: string
                  description: the revision number of the risk document
                  example: 3-7984cfdf73dfca82ccd1178ec066b005
                index:
                  type: number
                  description: the index number of the risk line item to be changed
                  example: 6
                bodleyID:
                  type: string
                  description: the bodleyID of the Library line item you want to add
                  example: Bod::A0DAC989-CF7A-4D2C-9BA0-DE6EE5AB2460::BB
      responses:
        '200':
          description: successfully edited/added line item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RWPlacing'
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/recordLine:
    post:
      tags:
      - Risks
      summary: Record an off-platform line - Broker Only
      description: <p>You can use this call to record a line for an off-platform company on 'FullContracts' OR for an off-platform team of a live company on an off-platform contract.</p> <p>You can use an existing stamp or, for an off-platform carrier, create a new stamp yourself. If you want to use an existing stamp for an off-platform carrier, you can grab the list of existing stamps by calling /documents/{docID}, where docID in this case is Extra-{companyId}.</p> <p>Always set saveStamps as False.</p> <p>There are number of stamp types you can choose but for now via API we are only allowing nonBureau stamps. See example below</p>
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the Firm Order or Bindable Quote
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
      requestBody:
        content:
          application/json:
            examples:
              Non Bureau Stamp:
                description: Non-bureau stamp
                value:
                  _rev: 2-e61bf2c6aa5ff799b4e4e17b57c003ee
                  items:
                  - lines:
                    - sectionIDs: []
                      impressions:
                      - references:
                        - reference: AFFFFF
                          riskCodes: ''
                        writtenPercentage: '12'
                        stampID: ''
                        bureauMarket: ''
                        businessUnit: Non Bureau MGA Example
                        bureauMarketCode: ''
                        bureauSubMarket: ''
                        stampType: other
                        shortName: Non Bureau 5123
                        category: NonBureauMGA
                        splitStampData:
                        - code: '61232131'
                          pseudonym: ''
                        coverholder: false
                      conditions:
                        lineConditions: []
                        subjectivities: []
                      leadUnderwriter: false
                      writtenDate: 1748003486
                    uwrChannel: offlineberkshirehathaway_ALL
                    saveStamps: true
            schema:
              type: object
              properties:
                _rev:
                  type: string
                  example: 2-7066db9d64dbbe1dbf2a531bd33bf631
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            sectionIDs:
                              type: array
                              items:
                                type: string
                                example: 1
                            impressions:
                              type: array
                              items:
                                type: object
                                properties:
                                  references:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        reference:
                                          type: string
                                          example: DSFSDFSDF
                                        riskCodes:
                                          type: string
                                          example: ''
                                  writtenPercentage:
                                    type: string
                                    example: '100'
                                  stampID:
                                    type: string
                                    example: ST610A6AE7-A17F-47DE-9894-42B16B843733
                                  bureauMarket:
                                    type: string
                                    example: Lloyd''s
                                  businessUnit:
                                    type: string
                                    example: Lloyd''s Underwriter Syndicate No. 6543 BLE
                                  bureauMarketCode:
                                    type: string
                                    example: '6543'
                                  bureauSubMarket:
                                    type: string
                                    example: ''
                                  stampType:
                                    type: string
                                    example: lloyds
                                  shortName:
                                    type: string
                                    example: ''
                                  mirrorStampsData:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        references:
                                          type: array
                                          items:
                                            type: string
                                            example: FSDFSDF
                                        businessUnit:
                                          type: string
                                          example: Blenheim Underwriting Limited
                                        bureauMarket:
                                          type: string
                                          example: XIS
                                        bureauMarketCode:
                                          type: string
                                          example: B1234
                                        bureauSubMarket:
                                          type: string
                                          example: ''
                                        stampID:
                                          type: string
                                          example: ST4F172B8C-4860-49A3-B140-A17B804D220A
                                        stampType:
                                          type: string
                                          example: other
                                        shortName:
                                          type: string
                                          example: ''
                                        mirrorStampCustomDescription:
                                          type: string
                                          example: Custom
                            conditions:
                              type: object
                              properties:
                                lineConditions:
                                  type: array
                                  items: {}
                                  description: details of any line conditions
