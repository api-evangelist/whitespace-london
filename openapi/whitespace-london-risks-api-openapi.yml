  /api/risks/{riskID}/cloneDraft:
    post:
      summary: Clones an existing risk as a new draft, setting UMR and Insured - Broker Only
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: <p>The unique ID of the risk, starting with IC and having parts delimited by '::'. <b>NEW</b> in release 2.20 - If a template is in multiple teams, the channel field is mandatory in order to choose which team a risk is cloned to. Please make sure to use a channel that the template is in, otherwise it will return an error.
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - umr
              - insuredName
              properties:
                umr:
                  type: string
                  description: The UMR of the new risk.
                  example: B0999JC3011211103
                placementType:
                  type: string
                  description: 'The type of contract to create: FullContract or Template or OffPlatform. If not specified, will be the same as the source risk.'
                  example: FullContract
                insuredName:
                  type: string
                  description: The insured or reinsured for display within the Platform.
                  example: Acme Widgets Inc
                channel:
                  type: string
                  description: the channel of team you want to clone to. Mandatory IF template is in multiple teams.
                  example: blackpool_MARINE
                contractFontSize:
                  type: string
                  description: the font size you want the risk to have.
                  enum:
                  - 10pt
                  - 11pt
                  - 12pt
                  - 14pt
                  - 15pt
                  - 16pt
                  - 18pt
                  - 20pt
                contractDateFormat:
                  type: string
                  description: choose whether you want the date to be in GB or US format.
                  enum:
                  - en-GB
                  - en-US
        description: 'CloneDraftInput object. Optional item(s): placementType, contractFontSize, contractDateFormat, channel.'
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: message describing success
                    example: Draft clone created.
                  id:
                    type: string
                    description: The unique ID of the new risk, starting with IC. As it is a Draft, it will not have any '::' delimiters.
                    example: ICF9074CE2-4D25-4ECB-AE5D-27CEA1A25F9B
  /api/risks/{riskID}/declineQuoteRequest:
    post:
      summary: Called by the Underwriter to decline a quote request - Underwriter Only
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk, starting IC and expected to end ::QRx where x is 1, 2, 3 etc
        example: IC8F2D09C8-A220-4DD6-9E14-77AFF7A617AC::QR2
      requestBody:
        description: As of 3.3, we have introduced reasons for declining when declining quote requests
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reasons:
                  type: array
                  items:
                    type: string
                    description: The reason(s) for declining
                    example: CannotMeetSpecificationOrFormRequests
                    enums:
                    - AttachmentPointTooLow
                    - AuthorisedToAnotherBroker
                    - CannotMeetSpecificationOrFormRequests
                    - CatExposurePmlsTooHigh
                    - DeductiblesTooLow
                    - EngineeringRequirementsNotMet
                    - InadequateTimeToQuote
                    - InsufficientUnderwritingInformation
                    - LackOfCapacity
                    - LocationsOfRisk
                    - LossHistory
                    - NoAppetiteForThisClassOfBusiness
                    - NotAcceptableToReinsuranceTreaty
                    - OccupancyConcentration
                    - OccupancyEnvironmentalFactors
                    - OccupancyType
                    - PremiumInsufficientForRisk
                    - ReInsuredsFinancials
                    - Other
                notes:
                  type: string
                  description: any additonal notes you want to provide
                  example: Test note
                otherReason:
                  type: string
                  description: only if 'Other' was chosen as one of the reasons
                  example: Test Reason
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    description: a message showing that the quote has been declined
                    example: Quote Request IC8F2D09C8-A220-4DD6-9E14-77AFF7A617AC::QR2 successfully declined
