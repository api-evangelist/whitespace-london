            schema:
              properties:
                op:
                  type: string
                  description: requited to be 'edit'
                  example: edit
                rev:
                  type: string
                  description: the revision of the risk document
                  example: 3-7984cfdf73dfca82ccd1178ec066b005
                index:
                  type: number
                  description: the index of the line item to be changed
                  example: 6
                attributes:
                  type: object
                  properties:
                    locked:
                      type: boolean
                      description: true if the item is to be locked, ie not editable by the underwriter
                      example: false
                elements:
                  type: array
                  description: a set of elements containing the textual detail of the line item
                  items:
                    type: object
                    description: An element in the line item data, such as a paragraph of text or a table
                    properties:
                      index:
                        type: integer
                        description: Index controlling the order of elements, starting at 0, should be unique and consecutive integers
                        example: 2
                      indent:
                        type: integer
                        description: An optional integer to indicate a number of tabs from the left margin for a bulletValue paragraph
                        example: 0
                      bulletValue:
                        type: string
                        description: The bullet or numbering value for a list. Typically one of - 1. (a) i) etc
                        example: '1.'
                      text:
                        type: string
                        description: The raw text of the paragraph, including placeholder markers like [[Percentage1]], [[Amount2]], [[DefinedData3]]
                        example: Passenger Baggage [[Amount2]] any one claim.
                      html:
                        type: string
                        description: The text of the paragraph decorated with a subset of HTML attributes like &lt;i&gt; &lt;u&gt; and &lt;b&gt;
                        example: <b>New Zealand</b>
                      textArray:
                        type: array
                        description: When a bulleted value is to be split across paragraphs, but the second paragraph has no bullet, use textArray instead of text
                        items:
                          type: string
                          example: Second paragraph of text for a bulleted value
                      align:
                        type: string
                        enum:
                        - left
                        - centre
                        - right
                        description: How the text is aligned
                      table:
                        type: object
                        description: A table of data to be displayed under the contract heading
                        properties:
                          columnSpecs:
                            type: array
                            items:
                              type: object
                              properties:
                                x:
                                  type: integer
                                  description: Indent amount. Usually set to 0
                                  example: 0
                                alignment:
                                  type: string
                                  enum:
                                  - left
                                  - centre
                                  - right
                                  example: left
                                  description: The alignment of text in the column. Defaults to left
                          rows:
                            type: array
                            description: The rows of the table
                            items:
                              type: object
                              properties:
                                height:
                                  type: integer
                                  description: The height of the row. Defaults to 22
                                  example: 22
                                values:
                                  type: array
                                  description: The text to be displayed in each cell in the row
                                  items:
                                    type: string
                                    example: Peru
                                isHeaderRow:
                                  type: boolean
                                  example: true
                                  description: True if this is the header row
                                columnTag:
                                  type: string
                                  example: Insured_Item_Unique_Identifier
                                  description: The defined data tag assiciated with the column
                          rowsSpecs:
                            type: array
                            description: Reserved for future use to control layout of rows
                            items:
                              type: object
                              properties:
                                page:
                                  type: number
                                  example: 8
                                y:
                                  type: number
                                  example: 480
                          widths:
                            type: array
                            description: Relative widths of the columns. Set all to 1 to fit to contents
                            items:
                              type: integer
                              example: 1
                          orientation:
                            type: string
                            description: Orientation for the table. Defaults to auto
                            enum:
                            - portrait
                            - landscape
                            - auto
                            example: auto
                          tableSpecs:
                            type: object
                            properties:
                              noBorders:
                                type: boolean
                                example: true
                                description: Set as true to hide the borders on table
                              fontSize:
                                type: string
                                example: 8pt
                                description: Font size to use for the table
                tagPages:
                  type: array
                  description: tag pages used for Defined Data, which is optional and can be empty
                  items:
                    type: object
                    properties:
                      pageID:
                        type: string
                        description: UUID to uniquely identify the Tag page
                        example: A94A3316-F440-4D67-8B48-8C5A7EA01554
                      title:
                        type: string
                        description: optional string as a title for the page, can just be blank
                        example: Period tags
                      sectionIDs:
                        type: array
                        items:
                          type: string
                          description: the section IDs associated with the tag page, which can be empty for a non-sectioned policy
                          example: '1'
                placeholders:
                  type: array
                  description: a set of placeholders for data values picked out for the line item
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: a name, unique within the parent lineitem, of the form phType number, e.g. Amount1, DefinedData4
                        example: Amount1
                      phType:
                        type: string
                        enum:
                        - Amount
                        - Date
                        - Percentage
                        - Clause
                        - Email
                        - TimeDuration
                        - DefinedData
                        description: the phType chosen sets the allowed text that should be placed in value and originalValue
                        example: Amount
                      value:
                        type: string
                        description: e.g. USD 500,000 / 7 April 2021 / 23.5% / LMA3333 / anne.lister@xyz.com / 3 Months
                        example: USD 50,000
                      originalValue:
                        type: string
                        description: e.g. USD 500,000 / 7 April 2021 / 23.5% / LMA3333 / anne.lister@xyz.com / 3 Months
                        example: USD 50,000
                      tags:
                        type: array
                        description: <p>Tags were added in the Defined Data release to identify the specific use of a placeholder</p> <p>There will be a tag starting 'Page:' which is used to relate tags, for instance the lines of a table, or the terms of a section, or where there are multiple periods applying to the risk.</p> <p>There will also be one or more tags indicating the purpose of the defined data item - 'Insured_Name', 'Inception_Date', 'Premium_Amount' and so on. Multiple tags of this sort indicate that the same value applies. 'Inception_Time' and 'Expiry_Time', for instance, are often the same value.
                        items:
                          type: string
                          example: Premium_Amount
