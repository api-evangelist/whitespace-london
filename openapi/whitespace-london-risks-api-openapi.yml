  /api/risks/{riskID}/rollbackSigned:
    post:
      summary: Reverts a risk from signed to unsigned - Broker Only
      description: Removes the 'signed' status from the contract's written lines, reverting the contract back to the written firm order stage. No other changes are made. It is NOT possible to roll back the signed status of a facility agreement contract once a declaration has been shown to it.
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the signed contract document, starting IC and ending in '::SIGNED'
        example: IC63D86D53-3B1F-459F-9D35-5C2D4F0E4854::SIGNED
      requestBody:
        description: Please add an empty payload of {}
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Empty Payload
      responses:
        '200':
          description: successfully rolled back signed lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Signed risk rolled back to Firm Order.
                    description: A message indicating success
  /api/risks/{riskID}/createEndorsement:
    post:
      summary: Creates an endorsement - Broker Only
      description: Can only create an endorsement on a risk at the Signed or Firm Order stages. In the case of Firm Order, at least one line must have gone down. It is currently not possible to create Mid-Term Participant Change endorsements on risks with vertical terms.
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the Firm Order/Signed Risk
        example: IC63D86D53-3B1F-459F-9D35-5C2D4F0E4854::SIGNED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: number
                  example: 1
                  description: The number of the endorsement you want to create. Cannot duplicate the number of an already-exisitng endorsement.
                type:
                  type: string
                  example: standard
                  description: The type of endorsement - standard refers to a normal endorsement, mtpc refers to a Mid-Term Participant Change endorsement.
                  enum:
                  - standard
                  - mtpc
      responses:
        '200':
          description: successfully created Endorsement
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Created endorsement with docID ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81::SIGNED::EN2
                  docID:
                    type: string
                    example: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81::SIGNED::EN2
                    description: the ID of the newly created Endorsement
                  version:
                    type: string
                    example: '2.8'
