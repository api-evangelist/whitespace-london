  /api/risks/newDraft:
    post:
      tags:
      - Risks
      summary: Creates a draft risk using a simplified input format - Broker Only
      parameters:
      - in: query
        name: teamChannel
        required: true
        schema:
          type: string
        description: The team channel where the new Draft Risk is to be created. This string always takes the format "company_DEPARTMENT" and a full list of available channels for a user can be seen in the response to a GET request to /api/user/myDetails. This value is the equivalent of selecting a Team in the "Create for Team" dropdown box when creating a new Risk in the web UI
      requestBody:
        description: <p>An array of simplified line items. Note that each should have either text, for a single line, or array for several paragraphs. Dates, amounts etc will be picked out as placeholders if they follow our conventions. If both are supplied the array takes precedence.</p>
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  heading:
                    type: string
                    description: the heading for the line item
                    example: Insured
                  text:
                    type: string
                    description: a single line of text for the line item detail
                    example: GBP 250,000
                  array:
                    type: array
                    description: one line per paragraph for the line item detail
                    items:
                      type: string
                    example:
                    - From 1 April 2020
                    - To 31 March 2021
            example:
            - heading: UMR
              text: B0999JC0212211614
            - heading: Insured
              text: Swagger Widgets Inc
            - heading: Contract Type
              text: Cyber Insurance
            - heading: Period
              array:
              - From 1 April 2021
              - To 31 March 2022
            - heading: Premium
              text: USD 25,000
            - heading: Limit of Liability
              text: USD 40,000,000
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                id: IC4F06B6BD-20EE-41BC-87F7-1292B7750C9B
                rev: 1-141df67df9e5eaacd0830c65e47a0bf9
                ok: true
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/root/{rootID}:
    get:
      tags:
      - Risks
      summary: Get a list of documents associated with a risk
      parameters:
      - in: path
        name: rootID
        schema:
          type: string
        required: true
        description: 'The root ID of the risk, stopping before the :: suffix'
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::QR1
                      description: The full ID of the document
                    type:
                      type: string
                      example: RWPlacing
                      description: The type of the document, which will always be RWPlacing
                    channels:
                      type: array
                      items:
                        type: string
                      description: The channels of the user teams that can see the document
                      example:
                      - ajc_ALL
                      - messina_ALL
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{rootID}/related/{type}:
    get:
      tags:
      - Risks
      summary: returns documents of a certain type for a risk
      parameters:
      - in: path
        name: rootID
        schema:
          type: string
        required: true
        description: 'The root ID of the risk, stopping before the :: suffix'
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
      - in: path
        name: type
        schema:
          type: string
        required: true
        description: The document type to be fetched, for instance RWComment, RWLineGuidanceSet, RWWrittenLineSet, RWSignedLineSet
        example: RWComment
      responses:
        '200':
          description: An array of documents for the required type
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: documents of the specified type
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
