  /api/risks/{riskID}/declineFirmOrder:
    post:
      summary: Declines a firm order - Underwriter Only
      description: An underwriter may only decline a firm order before adding a written line.
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The full unique ID of the firm order, ending in ::FO::{companyId}::{teamId}. Please make sure that the companyId and teamId are correct and relevant for the team you are declining for, as a broker may send a firm order on the same contract to multiple teams and/or Whitespace corporate accounts at your organisation.
        example: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL
      requestBody:
        description: Payload depends on the type of the contract and whether it is sectioned. See below for examples.
        required: true
        content:
          application/json:
            examples:
              Open Market/Facility:
                description: Open Market or Facility
                value:
                - {}
              Declaration:
                description: Declaration
                value:
                - associatedFacilityID:
                    facilityID: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
              Sectioned Open Market/Facility:
                description: Sectioned Open Market or Facility
                value:
                - sectionID: '1'
              Sectioned Declaration:
                description: Sectioned Declaration
                value:
                - sectionID: '1'
                  associatedFacilityID:
                    facilityID: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
            schema:
              type: array
              items:
                type: object
                example: {}
      responses:
        '200':
          description: succesfully declined Firm Order
          content:
            application/json:
              example:
              - rev: 1-f1363da19c65a9928ecce76a74a63bb8
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::ARCH::2E365330-46EB-4841-9ECC-431474D2BE8A
              - rev: 1-835f0c80fe9b8705f956a73a8d058320
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::ACTI::5E35C3E8-2D61-4BB9-BD84-0A09723E87F1
              - rev: 2-8d65daf913586207660d2570ee587970
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::LGUS
              - rev: 3-b376e2514217166c2ae6de972d603db8
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL
              - rev: 1-335ee730cde9c14ab513ebdbf9e4a733
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FOD::TOMYUNDERWRITING::ALL
  /api/risks/{riskID}/withdrawFirmOrder:
    post:
      summary: Withdraw a firm order from an underwriter - Broker Only
      description: Retract a request for a written line. A firm order can only be withdrawn before the underwriter writes a line.
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the firm order, starting with 'IC' and ending in '::FO'
        example: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO
      requestBody:
        description: The payload required varies by contract type and whether it is sectioned. See below for examples.
        required: true
        content:
          application/json:
            examples:
              Open Market/Facility:
                description: Unsectioned Open Market or Facility Agreement
                value:
                - channel: tomyunderwriting_ALL
              Sectioned Open Market/Facility:
                description: Sectioned Open Market or Facility Agreement
                value:
                - channel: tomyunderwriting_ALL
                  sectionID: '1'
              Declaration:
                description: Unsectioned Declaration
                value:
                - channel: tomyunderwriting_ALL
                  associatedFacilityID:
                    facilityID: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
              Sectioned Declaration:
                description: Sectioned Declaration
                value:
                - channel: tomyunderwriting_ALL
                  associatedFacilityID:
                    facilityID: ICE82100B0-2D8B-4DD5-883E-B3D2AC98DA81
                  sectionID: '1'
            schema:
              type: array
              items:
                type: object
                properties:
                  channel:
                    type: string
      responses:
        '200':
          description: successfully withdrew Firm Order
          content:
            application/json:
              example:
              - rev: 1-f1363da19c65a9928ecce76a74a63bb8
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::ARCH::2E365330-46EB-4841-9ECC-431474D2BE8A
              - rev: 1-835f0c80fe9b8705f956a73a8d058320
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::ACTI::5E35C3E8-2D61-4BB9-BD84-0A09723E87F1
              - rev: 2-8d65daf913586207660d2570ee587970
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL::LGUS
              - rev: 3-b376e2514217166c2ae6de972d603db8
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FO::TOMYUNDERWRITING::ALL
              - rev: 1-335ee730cde9c14ab513ebdbf9e4a733
                id: ICEB90F9F2-7B58-41FD-9160-528350E53EFE::FOD::TOMYUNDERWRITING::ALL
  /api/risks/{riskID}/saveVerticalLines:
    post:
      tags:
      - Risks
      summary: Sets the vertical terms for a specific heading on a risk. This operation can only be performed on contracts at the firm order or bindable quote stages - Broker Only
      parameters:
      - in: path
        name: riskID
        required: true
        schema:
          type: string
          description: The unique ID of the risk, starting IC and having parts delimited by '::'
          example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::FO
      requestBody:
        description: Data specifying the vertical terms
        required: true
        content:
          application/json:
            examples:
              Insured - a simple case:
                description: A simple case of adding three vertical terms for the Insured heading with no tagged data
                value:
                  verticalLines:
                  - elements:
                    - text: Acme Inc
                      index: 0
                    placeholders: []
                    attributes:
                      locked: false
                  - elements:
                    - text: Dalston Airways
                      index: 0
                    placeholders: []
                    attributes:
                      locked: false
                  - elements:
                    - text: Test Company
                      index: 0
                    placeholders: []
                    attributes:
                      locked: false
                  initialLineIndex: 9
                  _rev: 8-d3238cf5840b5a334e53062cbaa06b1b
              Premium - Defined Data:
                description: A more complicated case involving Defined Data tags
                value:
                  verticalLines:
                  - elements:
                    - text: '[[DefinedData0]]'
                      index: 0
                    placeholders:
                    - name: DefinedData0
                      value: GBP 10,500,000
                      phType: Amount
                      tags:
                      - Page:9FA04CFC-EE83-45F5-BD50-9581A63DE206
                      - Premium_Amount
                    tagPages:
                    - sectionIDs: []
                      title: ''
                      pageID: 9FA04CFC-EE83-45F5-BD50-9581A63DE206
                    attributes:
                      locked: false
                  - elements:
                    - text: '[[DefinedData0]]'
                      index: 0
                    placeholders:
                    - name: DefinedData0
                      value: GBP 13,500,000
                      phType: Amount
                      tags:
                      - Page:9FA04CFC-EE83-45F5-BD50-9581A63DE206
                      - Premium_Amount
                    tagPages:
                    - sectionIDs: []
                      title: ''
                      pageID: 9FA04CFC-EE83-45F5-BD50-9581A63DE206
                    attributes:
                      locked: false
                  - elements:
                    - text: '[[DefinedData0]]'
                      index: 0
                    placeholders:
                    - name: DefinedData0
                      value: GBP 15,000,000
                      phType: Amount
                      tags:
                      - Page:9FA04CFC-EE83-45F5-BD50-9581A63DE206
                      - Premium_Amount
                    tagPages:
                    - sectionIDs: []
                      title: ''
                      pageID: 9FA04CFC-EE83-45F5-BD50-9581A63DE206
                    attributes:
                      locked: false
                  initialLineIndex: 11
                  _rev: 1-74afa924b92ada72344dc7d1b219e0b4
            schema:
              properties:
                _rev:
                  type: string
                  description: the current revision of the risk document
                  example: 3-7984cfdf73dfca82ccd1178ec066b005
                initialLineIndex:
                  type: number
                  description: the index number of the line item for the heading that is receiving vertical terms
                  example: 6
                verticalLines:
                  type: array
                  items:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          locked:
                            type: boolean
                            description: true if the item is to be locked, ie not editable by the underwriter
                            example: false
                      elements:
                        type: array
                        description: the text of the vertical terms
                        items:
                          $ref: '#/paths/~1api~1risks~1%7BriskID%7D~1editLineItem/post/requestBody/content/application~1json/schema/properties/elements/items'
                      tagPages:
                        type: array
                        description: the data tag pages identifying the Defined Data sets associated with the terms. Can be empty
                        items:
                          $ref: '#/paths/~1api~1risks~1%7BriskID%7D~1editLineItem/post/requestBody/content/application~1json/schema/properties/tagPages/items'
                      placeholders:
                        type: array
                        description: the data value placeholders used in the line item
                        items:
                          $ref: '#/paths/~1api~1risks~1%7BriskID%7D~1editLineItem/post/requestBody/content/application~1json/schema/properties/placeholders/items'
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RWPlacing'
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
