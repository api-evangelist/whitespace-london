                    example: unchosen
        '401':
          $ref: '#/paths/~1api~1risks~1save/post/responses/401'
  /api/risks/{riskID}/completeEndorsement:
    post:
      tags:
      - Risks
      summary: Complete a Endorsement and bind any notify parties to it - Broker Only
      description: This endpoint can only be used once the Leader and any agreement parties on the endorsement (if they exist) have agreed to it. The normal payload accompanying the endorsement ID is just a blank object, but it can be used to share attachments with notify parties.
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the Endorsement
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::SIGNED::EN1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      docID:
                        type: string
                        example: IC6FD42DF7-989A-4AB4-8638-1EB5870E70CD::ATCH::A-68FDB77D-B32B-40CB-A6CC-258544DB0502
                        description: the docID of the attachment
                      attachID:
                        type: string
                        description: the attachmentID of the attachment
                        example: A-68FDB77D-B32B-40CB-A6CC-258544DB0502
                      channels:
                        type: array
                        description: the channels of the notify parties to share the attachment with
                        items:
                          type: string
                          example: whitesails_ALL
      responses:
        '200':
          description: successfully completed Endorsement
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Endorsement Completed
                    description: a message indicating success
components:
  schemas:
    ExtendedMRC:
      type: object
      description: JSON returned by getExtendedMRC including the Risk and a broader range of data
      properties:
        createdAt:
          type: string
          example: '2021-08-04T15:18:02.000Z'
        updatedAt:
          type: string
          example: '2021-08-04T15:18:02.000Z'
        type:
          type: string
          example: RWPlacing
          description: RWPlacing in all cases
        control:
          $ref: '#/components/schemas/RWPlacing/properties/control'
        channels:
          type: array
          items:
            type: string
            example: ajc_ALL
        MRCContract:
          $ref: '#/components/schemas/RWPlacing/properties/MRCContract'
        questionnaire:
          type: object
          properties:
            questionnaire:
              type: object
              properties:
                questions:
                  type: array
                  items:
                    type: object
                    properties:
                      tag:
                        type: string
                        example: Pension_Or_Benefits_Plan_Company_Sponsor
                        description: name of the tag
                      text:
                        type: string
                        example: Does the company sponsor any pension or benefits plan?
                        description: The Question text
                      id:
                        type: string
                        example: Pension or Benefits Plan - Company Sponsor
                        description: the id of the question
                      hidden:
                        type: boolean
                        example: true
                        description: If the question is hidden or not, usually because the dependant question has not been answered
                      table:
                        type: array
                        items:
                          type: object
                          properties:
                            tag:
                              type: string
                              example: Asset_Amount_Year
                            text:
                              type: string
                              example: Year
                        required:
                        - tag
                        - text
                    required:
                    - text
                    - id
                    - tag
              required:
              - questions
          required:
          - questionnaire
        proposedEndorsementFollowers:
          type: object
          description: an object where the keys are the carrier team ids and the values are 'unchosen', 'leader', 'agreementParty', 'notifyParty', 'nonNotifyParty'
          properties:
            palermo_ALL:
              description: as an example, the follower status for the Palermo All Risks team
              type: string
              example: leader
        provenance:
          type: object
          description: Meta-data about the document to aid with auditing
          properties:
            version:
              type: string
              description: Version message of the platform system that created the document
              example: 2022-04-11@15:04:48
            dataHash:
              type: string
              description: Data hash of the activity document
              example: 485241de4e5bfc76a0e2ef8bab79350c02d3aa06846fd2996cbf9fc9a7840eb0
            system:
              type: string
              description: The internal name of the platform system
              example: LavAPI
            userID:
              type: string
              description: The user ID of the user whose action generated the document
              example: MUB980AB60-1C96-4092-A1B4-B8FB183360D1
            writtenAt:
              type: string
              description: The creation date of the document, in YYYY-MM-DD hh:mm:ss format
              example: '2022-05-09T11:44:41.000Z'
            provHash:
              type: string
              description: Provisioning hash of the document
              example: 76a209a16d8b9214e7a33483d78718cc1a7e7aed7047282d2c94417404558e2d
        accountDocID:
          type: string
          example: ''
        writtenLineSets:
          type: array
          description: the written lines on the contract
          items:
            $ref: '#/components/schemas/RWWrittenLineSet'
        signedLineSets:
          type: array
          description: the signed lines on the contract
          items:
            $ref: '#/components/schemas/RWSignedLineSet'
        platformReferences:
          type: object
          description: document and revision of the risk
          properties:
            RiskID:
              type: string
              description: the document ID of the risk
              example: IC08B5EC17-5486-4323-82FC-62CC8C410EA0::FO::EN1
            Revision:
              type: string
              description: the revision of the risk
              example: 4-b63141573da07d5316b7a2b4585fbd2b
    RWQuotedLine:
      type: object
      properties:
        _id:
          type: string
          example: ICD0645233-E126-4768-AB15-0A8828F5F08C::BQ1::TOMYUNDERWRITING::ALL::BQL
          description: The unique ID of this document
        _rev:
          example: 1-087952cf08f44dae740c1c001e2d5ab2
          type: string
          description: The revision number of this document
        channels:
          type: array
          items:
            type: string
            example: akhil_ALL
            description: The team IDs of the users who can see the risk
        createdAt:
          type: string
          example: '2024-02-21 15:05:47'
          description: The creation time of this document
        line:
          type: array
          items:
            type: object
            description: The data for the line (Signed/Written/Quoted)
            properties:
              version:
                type: number
                example: 1
                description: Version number
              sectionIdentifiers:
                type: array
                description: The section/s of the risk to which the line is attached
                items:
                  type: string
                  example: '2'
                  description: The ID number of the section
              businessUnit:
                type: string
                example: Catania Insurers Ltd
                description: The business unit of the underwriter who put down the line
              stampedAt:
                type: string
                description: The date and time when the line was put down
                example: '2019-10-01 09:31:43'
              subjectivities:
                type: array
                description: Details of any subjectivities added by the underwriter
                items:
                  type: object
                  properties:
                    approvedStatus:
                      type: string
                      enum:
                      - notYetResponded
                      - accepted
                      - rejected
                      - deadlineExpired
                      description: Current status of the broker's response to the underwriter's subjectivity
                    deadline:
                      type: string
                      example: '1708560000.0'
                      description: The deadline for accepting the subjectivity response in unix epoch time
                    identifier:
                      type: string
                      example: 59F40DB9-557C-46F6-95A0-179270BD5A44
                      description: The uniqueID of the subjectivity
                    text:
                      type: string
                      example: Sample Subjectivity
                      description: Text detailing the requirement of the subjectivity
              subjectivityMode:
                type: string
                enum:
                - unchosen
                - holdingCover
                - noCoverGiven
                description: Whether this line provides cover whilst the subjectivity is being agreed
              subjectivitiesDeadlineNotRequired:
                type: string
                description: Details of any Subjectivites with no deadlines
              canUpdateConditions:
                type: boolean
                example: true
                description: Can line conditions be updated?
              stamperChannel:
                type: string
                description: The team channel of the underwriter who put down the line
                example: catania_ALL
              stamperEmail:
                type: string
                example: underwriter.messina@wspt.co.uk
                description: The email address of the underwriter who put down the line
              stamperName:
                type: string
                description: The name of the underwriter who put down the line
                example: Charles Messina
              role:
                type: string
                description: The facility participation role of the underwriter
                enum:
                - leader
                - agreementParty
                - notifyParty
                - nonNotifyParty
                - doesNotApply
              contractArchiveID:
                type: string
                description: The unique ID of the archived version of the risk document at the moment the line was put down
                example: IC9642312E-D0E2-46FE-8B08-9C3002C1DEC9::FO::CATANIA::ALL::ARCH::5A734DCC-98CC-4C41-A42F-3A43A5E44EE0
              toStand:
                type: boolean
                description: Whether the underwriter has marked the line To Stand, i.e. it may not be signed down
                example: true
              impressions:
                type: array
                description: Each item in the array represents an inked stamp detailing the line being put down.
                items:
                  type: object
                  properties:
                    riskCodes:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            example: H3
                            description: The risk code allocated to the written line
                          index:
                            type: string
                            description: The index order of the risk code
                            example: '0'
                    signedLinePercentageString:
                      type: string
                      description: The line percentage signed by the broker, which may be less than the underwriter's written line for SignedLineSets
                      example: '44.0272'
                    writtenLinePercentageString:
                      type: string
                      description: The line percentage written by the underwriter
                      example: '45'
                    uwRefs:
                      type: array
                      items:
                        type: string
                        description: The reference code assigned by the underwriter, which in many stamp types is limited to 12 alphanumeric characters
                        example: FHSDJFSDHFSD
                    descriptions:
                      type: array
                      items:
                        type: string
                    tiltAngleString:
                      type: string
                      description: The display angle used when rendering the stamp on the screen or printed page, used to give the appearance of manually stamped paper
                      example: '0.04264535201250923'
                    yearOfAccount:
                      type: string
                      example: '2024'
                      description: The year of account for the contract, if the stamp has been put down by the contract leader
                    stamp:
                      $ref: '#/components/schemas/CorporateDetail/properties/stamps/items'
                    stampIdentifiers:
                      type: array
                      items:
                        properties:
                          category:
                            type: string
                            description: The originating market or other authority that the stamp is put down under
                            example: LloydsSyndicate
                          categoryNumber:
                            type: string
                            description: The unique identifier of the capacity in the market, for example a bureau market code, Lloyds Syndicate Number, DUNS number, or other identifier
                            example: '1314'
                          categoryExtra:
                            type: string
                            description: The three-letter pseudonym of the Lloyd's of London or Lloyd's Brussels Syndicates that the underwriter belongs to, if any
                            example: ASC
                          splitPercentage:
                            type: string
                            description: If the stamp has been marked by the underwrite as split, this lists the line percentage falling under this particular syndicate or capacity. Split stamps have a separate stampIdentifiers array for each syndicate, and the combined splitPercentage values of all arrays in the split totals 100%
                            example: 82%
                          pseudonymn:
                            type: string
                            description: the pseudonymn used to identify the stamp
                          coverholder:
                            type: boolean
                            example: false
                            description: Whether the stamp is for a consortium
                    brexitData:
                      type: array
                      description: Defunct from version 2.18. This array used to appear if the line bore an EEA mirror stamp.
                      items:
                        type: object
                        properties:
                          stamp:
                            $ref: '#/components/schemas/CorporateDetail/properties/stamps/items'
                          references:
                            type: array
                            items:
                              type: string
                              description: The reference code assigned by the underwriter, which in many stamp types is limited to 12 alphanumeric characters
                              example: FHSDJFSDHFSD
                          descriptions:
                            type: array
                            items:
                              type: string
                              description: Any extra description added for the mirror stamp
                              example: This is a Description
                          customDescription:
                            type: string
                            example: Applying to EEA
                            description: Text appearing at the top of the mirror stamp
                          stampIdentifiers:
                            type: array
                            items:
                              properties:
                                category:
                                  type: string
                                  description: The originating market or other authority that the stamp is put down under
                                  example: LloydsSyndicate
                                categoryNumber:
                                  type: string
                                  description: The unique identifier of the capacity in the market, for example a bureau market code, Lloyds Syndicate Number, DUNS number, or other identifier
                                  example: '1314'
                                categoryExtra:
                                  type: string
                                  description: The three-letter pseudonym of the Lloyd''s of London or Lloyd''s Brussels Syndicates that the underwriter belongs to, if any
                                  example: ASC
                                splitPercentage:
                                  type: string
                                  description: If the stamp has been marked by the underwriter as split, this lists the line percentage falling under this particular syndicate or capacity. Split stamps have a separate stampIdentifiers array for each syndicate, and the combined splitPercentage values of all arrays in the split totals 100%
                                  example: 82%
                                pseudonymn:
                                  type: string
                                  description: The pseudonymn used to identify the stamp
                                coverholder:
                                  type: boolean
                                  example: false
                                  description: Whether the stamp is for a consortium
                    mirrorStamps:
                      type: array
                      description: This array only appears if the line bears one or more mirror stamps
                      items:
                        type: object
                        properties:
                          stamp:
                            $ref: '#/components/schemas/CorporateDetail/properties/stamps/items'
                          references:
                            type: array
                            items:
                              type: string
                              description: The reference code assigned by the underwriter, which in many stamp types is limited to 12 alphanumeric characters
                              example: FHSDJFSDHFSD
                          descriptions:
                            type: array
                            items:
                              type: string
                              description: Any extra description added for the mirror stamp
                              example: This is a Description
                          customDescription:
                            type: string
                            example: Contiguous 48 States only
                            description: Text appearing at the top of the mirror stamp
                          stampIdentifiers:
                            type: array
                            items:
                              properties:
                                category:
                                  type: string
                                  description: The originating market or other authority that the stamp is put down under
                                  example: LloydsSyndicate
                                categoryNumber:
                                  type: string
                                  description: The unique identifier of the capacity in the market, for example a bureau market code, Lloyd''s Syndicate Number, DUNS number, or other identifier
                                  example: '1314'
                                categoryExtra:
                                  type: string
                                  description: The three-letter pseudonym of the Lloyd''s of London or Lloyd''s Brussels Syndicates that the underwriter belongs to, if any
                                  example: ASC
                                splitPercentage:
                                  type: string
                                  description: If the stamp has been marked by the underwriter as split, this lists the line percentage falling under this particular syndicate or capacity. Split stamps have a separate stampIdentifiers array for each syndicate, and the combined splitPercentage values of all arrays in the split totals 100%
                                  example: 82%
                                pseudonymn:
                                  type: string
                                  description: The pseudonymn used to identify the stamp
                                coverholder:
                                  type: boolean
                                  example: false
                                  description: Whether the stamp is for a consortium
              contractHash:
                type: string
                example: 81b7151e30ba40f098ab50cc3828e5ff6f5a725dbb76910416f018d3ca23638a
                description: A hash of the contract data to verify the text being agreed to
              stamperUserID:
                type: string
                example: MUB6090366-B15D-4C2B-BA54-EABE5F638FDF
                description: The unique User ID of the underwriter
              conditionsEnabled:
                description: Whether conditions were attached to the written line
                type: boolean
                example: true
              mode:
                type: string
                example: quoted
              associatedFacilityId:
                type: string
                example: IC49BB5707-698B-4E51-B3C0-85FA763B94CC
                description: The unique ID of the facility agreement that the declaration is attached to
              associatedFacilitySectionID:
                type: string
                example: '1'
                description: The ID number of the section of the facility agreement that the declaration is attached to
              validityPeriod:
                type: string
                example: 60 Days
                description: The validity period of the quote in days (only for quoted lines)
              lineConditions:
                type: array
                description: The set of line conditions added by the underwriter
                items:
                  type: string
                  example: Line To stand
              conditionsApproved:
                type: boolean
                description: Whether the added line conditions have been agreed to by the broker
                example: true
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        type:
          type: string
          description: The named JMRC type descriptor for this document
          example: RWQuotedLine
        updatedAt:
          type: string
          description: The date and time that this document was last updated
          example: '2024-02-21 15:05:47'
        isOffline:
          type: boolean
          example: true
          description: Whether the line is assigned to an offline carrier.
        parentDocID:
          type: string
          example: ICD0645233-E126-4768-AB15-0A8828F5F08C::BQ1::TOMYUNDERWRITING::ALL
          description: The unique ID number of the related RWPlacing document
      required:
      - _id
      - _rev
      - channels
      - createdAt
      - line
      - parentDocID
      - provenance
      - type
      - updatedAt
    RWWrittenLineSet:
      type: object
      properties:
        _id:
          type: string
          example: ICD0645233-E126-4768-AB15-0A8828F5F08C::FO::TOMYUNDERWRITING::ALL::WRLS
          description: The unique ID of this document
        _rev:
          example: 1-087952cf08f44dae740c1c001e2d5ab2
          type: string
          description: The revision number of this document
        channels:
          type: array
          items:
            type: string
            example: akhil_ALL
            description: The team IDs of the users who can see the risk
        createdAt:
          type: string
          example: '2024-02-21 15:05:47'
          description: The creation time of this document
        contents:
          type: array
          items:
            $ref: '#/components/schemas/RWQuotedLine/properties/line/items'
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        type:
          type: string
          description: The named JMRC type descriptor for this document
          example: RWWrittenLineSet
        updatedAt:
          type: string
          example: '2024-02-21 15:05:47'
          description: The date and time that this document was last updated
        isOffline:
          type: boolean
          example: true
          description: Whether the stamp is associated with an offline carrier
        parentDocID:
          type: string
          example: ICD0645233-E126-4768-AB15-0A8828F5F08C::FO::TOMYUNDERWRITING::ALL
          description: The unique ID number of the related RWPlacing document
      required:
      - _id
      - _rev
      - channels
      - createdAt
      - line
      - parentDocID
      - provenance
      - type
      - updatedAt
    CorporateDetail:
      type: object
      properties:
        admins:
          type: array
          description: List of user emails for administrators at the company
          items:
            type: string
            example: sarah.kay.blackpool@wspt.co.uk
        updatedAt:
          type: string
          description: The date and time the company's details were last updated
          example: '2020-02-24T15:32:50.000Z'
        teams:
          type: array
          items:
            type: object
            properties:
              teamId:
                type: string
                description: Team identifier using uppercase letters with no punctuation
                example: MARINECARGO
              secondApprovalReviewers:
                type: array
                items:
                  type: string
                  description: Deprecated (see permissions array below). This array will always be empty. Formerly held userIDs of users with Internal Reviewer permission
                  example: '-'
              secondApprovalSelfApprovers:
                type: array
                items:
                  type: string
                  description: Deprecated (see permissions array below). This array will always be empty. Formerly held userIDs of users with Self-Approver permission
                  example: '-'
              name:
                type: string
                description: The name of the team, usually relating to the class of business worked on
                example: Marine Cargo
              channel:
                type: string
                description: The system channel for the team, comprising a lowercase version of the company ID, followed by underscrore and the team id
                example: blackpool_MARINECARGO
              isInactive:
                type: boolean
                example: false
                description: True if the team has been marked as inactive
              classOfBusiness:
                type: array
                items:
                  type: string
                  example: Marine
                  description: The class(es) of business that are associated with the team
        createdAt:
          type: string
          description: Time and date of creation
          example: '2020-02-24 15:32:50'
        companyId:
          type: string
          description: Company identifier using uppercase letters with no punctuation
          example: OFFLINEBRITISHMARINE
        isTestOnly:
          type: boolean
          description: True if the company account is just a test account with no live database access
          example: false
        channels:
          type: array
          description: Array with just one item, shared channel
          items:
            type: string
            description: The value 'shared'
            example: shared
        stamps:
          type: array
          description: For (re)insurers, lists the stamps they have set up on the system. Empty for brokers
          items:
            type: object
            properties:
              bureauMarket:
                type: string
                example: Lloyd's
              bureauMarketCode:
                type: string
                example: '1444'
              bureauSubMarket:
                type: string
                example: PSM1
              businessUnit:
                type: string
                example: Lloyd's Syndicate No.1444
              stampType:
                type: string
                example: lloyds
              uniqueID:
                type: string
                example: ST1843A345-1F69-435D-84E9-187BB3DD0F23
        buttonStamps:
          type: object
          properties:
            active:
              type: boolean
              example: true
              description: True if the button stamp is available for users to apply
            bureauMarketCode:
              type: string
              example: 5307/5
            companyName:
              type: string
              example: Tomy
            iconOnStamp:
              type: boolean
              description: True if an icon of any type is shown on the stamp, icon type is specified by stampType
              example: true
            layout:
              type: object
              description: The placement of name, type, and code data on the button stamp, each appearing once across the bottom, center, and top slots of the stamp
              properties:
                bottom:
                  type: string
                  enum:
                  - name
                  - type
                  - code
                center:
                  type: string
                  enum:
                  - name
                  - type
                  - code
                top:
                  type: string
                  enum:
                  - name
                  - type
                  - code
            stampID:
              type: string
              example: BTN-BAB19551-5557-4E6B-888B-E3B1B6A0E982
              description: The unique ID of the button stamp, which always starts with BTN
            stampType:
              type: string
              description: The type of icon displayed on the stamp. Note that other indicates no icon
              enum:
              - lloyds
              - brexit
              - other
        settings:
          type: object
          properties:
            canViewOfflineTeams:
              type: boolean
              description: True if the broking organisation is configured to save off-platform lines
              example: false
            mandatoryAuthStages:
              type: array
              items:
                type: string
                description: The list of contract stages at which second approval is required before a contract can proceed
                example: brFirmOrder
            digitiseOnlyToTemplate:
              type: boolean
              example: true
              description: True if the broking organisation can only digitise imported contract files as templates
        isOffline:
          type: boolean
          description: True for company accounts that are offline placeholders for organisations not yet using the platform
          example: false
        _id:
          type: string
          description: Reference ID for this company document
          example: Corporate-BLACKPOOL
        _rev:
          type: string
          description: Currect revision ID for this document
          example: 3-a1df22093d0dc2978b87f396be3cd2fa
        name:
          type: string
          description: The name of the company
          example: Blackpool Insurance Brokers Ltd
        role:
          type: string
          description: The organisation's role on the platform, either 'broker' or 'underwriter'
          example: underwriter
        authorityDetails:
          type: array
          items:
            type: object
            properties:
              authority:
                type: string
                example: Lloyd's (Syndicate Number)
              pseudonymn:
                type: string
                example: '131'
              registrationNumber:
                type: string
                example: '12313'
        members:
          type: array
          items:
            type: object
            description: A user on the platform
            properties:
              name:
                type: string
                description: the user's name
                example: Sarah Kay
              email:
                type: string
                description: <p>email address for the user</p> <p>Note that for Data Protection reasons, the email is removed from some outputs, such as the /api/shared/corporate list. In these cases it can be removed by a call to /api/documents/Corporate-{CompanyID}.</p>
                example: sarah.kay.blackpool@wspt.co.uk
              currentState:
                type: string
                description: Live, Draft, Suspended etc
                example: Live
              uniqueID:
                type: string
                description: Live, Draft, Suspended etc
                example: MUDA8AF5A8-98DF-4EF2-B2B8-4E069EDB7E8C
              allowReporting:
                type: boolean
                description: whether or not the user may run the management reports
                example: true
              isOffPlatform:
                type: boolean
                description: indicates the user is "off platform"s
                example: false
              teams:
                type: array
                items:
                  type: string
                  description: list of teams the user belongs to
                example:
                - blackpool_MARINEHULL
                - blackpool_MARINECARGO
        permissions:
          type: object
          properties:
            secondApprovalReviewers:
              type: object
              properties:
                teams:
                  type: object
                  properties:
                    teamID:
                      type: array
                      description: PLEASE NOTE the key-value of teamID above is just an indicative placeholder and will in practice be the teamID of one of the organisation's teams
                      items:
                        type: string
                        example: MU6E391615-CFF5-4E8E-B9D2-B0DE03BACA0
                        description: The list of userID's of the team's members with Internal Reviewer permission
            secondApprovalSelfApprovers:
              type: object
              properties:
                teams:
                  type: object
                  properties:
                    teamID:
                      type: array
                      description: PLEASE NOTE the key-value of teamID above is just an indicative placeholder and will in practice be the teamID of one of the organisation's teams
                      items:
                        type: string
                        example: MU6E391615-CFF5-4E8E-B9D2-B0DE03BACA0
                        description: The list of userID's of the team's Internal Reviewers who also have the Self Approver permission
            templateManagers:
              type: object
              properties:
                teams:
                  type: object
                  properties:
                    teamID:
                      type: array
                      description: PLEASE NOTE the key-value of teamID above is just an indicative placeholder and will in practice be the teamID of one of the organisation's teams
                      items:
                        type: string
                        example: MU6E391615-CFF5-4E8E-B9D2-B0DE03BACA0
                        description: The list of userID's of the team's members who have the Template Manager permission. This permission is only available to broking organisations
        channelPrefix:
          type: string
          description: A lowercase version of companyId used for the beginning of team channels
          example: blackpool
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
    RWPlacing:
      type: object
      description: <p>The MRCRisk obect contains the full text and structure of the JMRC Insurance Contract.</p> <p>It includes an MRCContract object where a set of MRCLineItem objects represent the headings and data in the contract, and an MRCRiskControl object which provides summary and meta data about the risk to enable the system's performance.</p>
      properties:
        _id:
          type: string
          example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57
          description: unique document id for the risk
        _rev:
          type: string
          example: 1-141df67df9e5eaacd0830c65e47a0bf9
        createdAt:
          type: string
          example: '2021-08-04T15:18:02.000Z'
        updatedAt:
          type: string
          example: '2021-08-04T15:18:02.000Z'
        type:
          type: string
          example: RWPlacing
          description: RWPlacing in all cases
        control:
          type: object
          properties:
            status:
              type: string
              description: The current stage of the contract in the placing process, taken from an enumerated list containing stages such as Draft, Quoted, FirmOrder, etc
              example: FirmOrder
            insuranceType:
              type: string
              example: Insurance
              description: Either Insurance or ReInsurance, as specified at contract creation
            umr:
              type: string
              description: The Lloyd's Unique Market Reference number for the contract
              example: B0999JC201909241622
            insuredName:
              type: string
              example: Acme Widgets Inc
              description: The name given to the contract
            contractType:
              type: string
              example: Aviation Hull Cover
              description: The class of business that the contract falls under
            leadUnderwriterChannel:
              type: string
              example: messina_ALL
              description: The team channel name of the lead underwriter on the risk, once specified
            leadUnderwriter:
              type: string
              example: Messina All Risks
              description: The plaintext company and team name of the lead underwriter's team, once specified
            placingBrokerChannel:
              type: string
              example: ajc_ALL
              description: The team channel name of the contract's broker
            placingBroker:
              type: string
              example: AJC All Risks
              description: The plaintext company and team name of the broker's team
            limitSummary:
              type: string
              description: The limit of liability for the contract
            originalDocID:
              type: string
              description: The unique ID of the document this contract was created from, if any
              example: IC97799647-4496-4760-B594-02AC726B0D7E
            endorsementNumber:
              type: string
              example: '2'
              description: If this contract is an endorsement, its endorsement number is stored here
            endorsementType:
              type: string
              description: For endorsements, specifies whether the endorsement is a Mid-Term Participant Change or a standard endorsement
              enum:
              - standard
              - mtpc
            isFacility:
              type: boolean
              example: false
              description: True if this contract is a facility agreement
            associatedFacilityIDs:
              type: array
              items:
                type: string
                example: ICB1213647-4876-4760-B594-02AC7261312412
                description: If the contract is a declaration, this array lists the unique IDs of all facility agreeements it is attached to
            placementType:
              type: string
              enum:
              - FullContract
              - OffPlatform
              - Template
              description: The contract type. OffPlatform is for contracts backloaded to duplicate agreements conducted off-platform, Template is for contract templates, and FullContract is for all live contracts
            verticalVisibility:
              type: string
              enum:
              - OwnStampOnly
              - AllStamps
              - LeaderStamps
              description: If the risk has vertical terms, this string specifies which stamps underwriters can see.
            createdInVersion:
              type: number
              example: 21100
              description: Which version of the platform the risk was created in.
            isIndicative:
              type: boolean
              example: false
              description: True if the Indicative flag been toggled, indicating that the contract is not binding.
            submittedAsCopyOf:
              type: string
              example: ICD937404C-87A7-4408-BE4B-D449216F9A85
              description: If this contract is a placing document shared from another broker, the unique ID of the original producing broker's contract is held here.
            stampVisibility:
              type: string
              description: Decides whose stamps underwriters can see
              enum:
              - Allstamps
              - OwnStampsOnly
              - LeadersStamps
        MRCContract:
          type: object
          description: a top level object which currently contains only the array of line items
          properties:
            lineItems:
              type: array
              items:
                type: object
                $ref: '#/paths/~1api~1risks~1%7BriskID%7D~1lineitem~1%7BmrcHeading%7D/get/responses/200/content/application~1json/schema/items'
        channels:
          type: array
          items:
            type: string
    RWEndorsementFollower:
      type: object
      properties:
        _id:
          type: string
          description: Unique ID for this endorsement follower document
          example: IC4E49E958-870A-41B3-B60B-B5AAC51F48A5::SIGNED::EN1::ENF::messina_ALL
        _rev:
          type: string
          description: Revision number for this document
          example: 3-a1df22093d0dc2978b87f396be3cd2fa
        agreement:
          type: object
          properties:
            dateOfAgreement:
              type: string
              description: Effective date of the endorsement in yyyy-mm-dd hh:mm:ss format
              example: '2021-08-06 08:15:28'
            followerType:
              type: string
              example: leader
              description: The role of this follower in the endorsement
              enum:
              - leader
              - agreementParty
              - notifyParty
              - nonNotifyParty
              - doesNotApply
              - unchosen
            instruction:
              type: string
              example: leaderOnly
              description: The parties the broker has selected as needing to agree the endorsement
              enum:
              - leaderOnly
              - none
              - leaderAndAgreementParties
              - allToAgree
            leader:
              type: string
              example: 'Yes'
              description: Set to Yes when the underwriter that this document details is the leader of the endorsement
            numberOfDaysToNotifyFollowers:
              type: string
              description: The number of days within which non-Agreement followers must be notified of the endorsement
              example: '7'
            user:
              type: string
              example: MUE8368329-A451-49D4-A385-915D421A4465
              description: The unique ID of the underwriter that this document details as a follower of the endorsement
            uwrChannel:
              type: string
              example: messina_ALL
              description: The team channel of the underwriter that this document details
            stampDescriptions:
              type: array
              items:
                type: object
                properties:
                  stampID:
                    type: string
                    example: ST213211241241
                    description: The ID of the stamp that the follower put down on the endorsement
                  desc:
                    type: string
                    example: 56 (added by Ascot Reinsurance Company Limited)
                    description: The brief description text field of the stamp identified above
            mtpcAgreement:
              type: array
              items:
                type: object
                properties:
                  type:
                    description: If the endorsement is a mid-term participant change, this specifies the category of participant change
                    enum:
                    - add
                    - modify
                    - remove
                    type: string
                  line:
                    $ref: '#/components/schemas/RWQuotedLine/properties/line/items'
        channels:
          type: array
          items:
            type: string
            description: A specific channel name identifying one of the entries in the array of team channels of the broker and all followers
            example: messina_ALL
        createdAt:
          type: string
          description: The date this document was created in yyyy-mm-dd hh:mm:ss format
          example: '2021-08-06 08:15:28'
        endorsementDocID:
          type: string
          example: IC4E49E958-870A-41B3-B60B-B5AAC51F48A5::SIGNED::EN1
          description: The unique ID of the endorsement that this RWEndorsementFollower document is associated with
        followerType:
          type: string
          example: leader
          description: The participation type of the follower
        version:
          type: integer
          description: The integer portion of the _ver value, identifying the sequential version number of this document
          example: 3
        type:
          type: string
          example: RWEndorsementFollower
          description: The JMRC document type of this document, which will always be RWEndorsementFollower
        updatedAt:
          type: string
          description: The date this document was last updated in yyyy-mm-dd hh:mm:ss format
          example: '2021-08-06 08:15:28'
        uwrChannel:
          type: string
          example: messina_ALL
          description: The team channel name of the follower's team
        template:
          type: string
          description: The category of agreement box displayed on the endorsement
          enum:
          - GUAStampA
          - GUAStampB
          - AVS100B
          - NonGUA
        mtpc:
          type: array
          items:
            type: object
            description: The details of the mid-term participant agreement, if the endorsement is of the MTPC type. Listed properties will change depending on whether the endorsement is adding, removing or modifying participants.
            properties:
              type:
                type: string
                enum:
                - add
                - remove
                - modify
                description: The type of change in participation
              sectionID:
                example: '1'
                description: The sectionID of the written line that is being modified/removed
                type: string
              setLeader:
                type: boolean
                example: true
                description: True if the MTPC is changing the leader
              guidance:
                type: object
                properties:
                  conditionsEnabled:
                    type: boolean
                    example: true
                    description: True if there are any conditions on the line guidance
                  sectionIdentifiers:
                    type: array
                    items:
                      type: string
                      example: '1'
                      description: The ID number of the section specifying the line guidance
                  maxString:
                    type: string
                    example: '40'
                    description: The maximum line percentage requested in the guidance
                  minString:
                    type: string
                    example: '30'
                    description: The minimum line percentage requested in the guidance
                  suggestedStamps:
                    $ref: '#/components/schemas/CorporateDetail/properties/stamps/items'
                  role:
                    description: The participation role of the follower
                    type: string
                    enum:
                    - leader
                    - agreementParty
                    - notifyParty
                    - nonNotifyParty
                    - doesNotApply
                  associatedFacilityId:
                    type: string
                    example: IC49BB5707-698B-4E51-B3C0-85FA763B94CC
                    description: The unique ID of the facility agreement, if any, that the declaration is attached to
                  associatedFacilitySectionID:
                    type: string
                    example: '1'
                    description: The sectionID of the section of the facility agreement, if any, that the declaration is attached to
              section:
                $ref: '#/components/schemas/RWLineGuidanceSet/properties/sections/items'
              facilityID:
                type: string
                example: IC4E49E958-870A-41B3-B60B-B5AAC51F48A5
                description: The unique ID of the facility agreement, if any, that the risk being endorsed is attached to one
              newPercentage:
                type: string
                example: '50'
                description: The new percentage value of the line if the MTPC is modifying a line
    RWSignedLineSet:
      type: object
      properties:
        _id:
          type: string
          example: ICD0645233-E126-4768-AB15-0A8828F5F08C::FO::TOMYUNDERWRITING::ALL::SILS
          description: The unique ID of this document
        _rev:
          example: 1-087952cf08f44dae740c1c001e2d5ab2
          type: string
          description: The revision number of this document
        channels:
          type: array
          items:
            type: string
            example: akhil_ALL
            description: The team channel names of the users who can see the risk these signed lines relate to
        createdAt:
          type: string
          example: '2024-02-21 15:05:47'
          description: The creation time of this document in YYYY-MM-DD HH:MM:SS format
        contents:
          type: array
          items:
            $ref: '#/components/schemas/RWQuotedLine/properties/line/items'
        provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        type:
          type: string
          description: The JMRC type name for this document. Always RWSignedLineSet
          example: RWSignedLineSet
        updatedAt:
          type: string
          example: '2024-02-21 15:05:47'
          description: The date and time that this document was last updated in YYYY-MM-DD HH:MM:SS format
        isOffline:
          type: boolean
          example: true
          description: True if the stamp is associated with an offline (re)insurer
        parentDocID:
          type: string
          example: ICD0645233-E126-4768-AB15-0A8828F5F08C::FO::TOMYUNDERWRITING::ALL
          description: The unique ID of the related RWPlacing document
      required:
      - _id
      - _rev
      - channels
      - createdAt
      - line
      - parentDocID
      - provenance
      - type
      - updatedAt
    RWLineGuidanceSet:
      type: object
      properties:
        sections:
          type: array
          items:
            type: object
            properties:
              index:
                type: number
                example: 1
              leadUnderwriterChannel:
                type: string
                example: offlineafricare_ALL
                description: The name of the leader's team channel
              multiSectionName:
                type: string
                description: The name of the section
                example: Hull
              multiSectionId:
                type: string
                description: The ID number of the section
                example: '1'
              leadUnderwriter:
                type: string
                example: OFFLINEAFRICANRE ALL
                description: The leader's company and team IDs
              leadUnderwriterFacility:
                type: string
                example: ICD77B5FD4-0790-42B9-BC53-65242FB96558
                description: The unique ID of the leader's facility agreement
        contents:
          type: array
          items:
            type: object
            properties:
              conditionsEnabled:
                type: boolean
                example: true
                description: Whether there are any conditions on the guidance
              sectionIdentifiers:
                type: array
                items:
                  type: string
                  example: '1'
                  description: The ID number of the section
              maxString:
                type: string
                example: '40'
                description: The maximum requested line percentage
              minString:
                type: string
                example: '30'
                description: The minimum requested line percentage
              suggestedStamps:
                $ref: '#/components/schemas/CorporateDetail/properties/stamps/items'
              role:
                description: Facility participation role
                type: string
                enum:
                - leader
                - agreementParty
                - notifyParty
                - nonNotifyParty
                - doesNotApply
              associatedFacilityId:
                type: string
                example: IC49BB5707-698B-4E51-B3C0-85FA763B94CC
                description: Unique ID of the facility agreement that the declaration is attached to.
              associatedFacilitySectionID:
                type: string
                example: '1'
                description: The sectionID of the section of the facility agreement, if any, that the declaration is attached to
        associatedPlacingID:
          type: string
          example: IC006DD9DA-A6EF-4320-BD23-C12D845282FF::FO
          description: The Unique ID of the Firm Order that this line guidance applies to
        _id:
          type: string
          description: The unique ID of this document
          example: IC006DD9DA-A6EF-4320-BD23-C12D845282FF::FO::CATANIA::ALL::LGUS
        _rev:
          type: string
          description: The revision number of this document
          example: 1-304aa44d6b3231c380ed83bbda5d8f08
        channels:
          type: array
          items:
            type: string
            example: catania_ALL
        Provenance:
          $ref: '#/components/schemas/ExtendedMRC/properties/provenance'
        type:
          type: string
          description: The named JMRC type descriptor for this document
          example: RWLineGuidance
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
