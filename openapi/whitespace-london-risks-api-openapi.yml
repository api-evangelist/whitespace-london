  /api/risks/{riskID}/forwardAsQuoteRequest:
    post:
      summary: Forwards a quote as a new quote request - Broker Only
      tags:
      - Risks
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The ID of the quote to forward. The POST payload has several optional parameters -- 'userId' specifies the uniqueID of a specific user to show the draft to, 'messages' includes a broker''s message with the contract, and 'attachments' identifies attachments to share with the request.
        example: ICD57AF686-6EB7-4D6B-A43A-5978F2C2681F::MU999AF919-3FDB-49F2-B4C5-D42614B02E70::UQ1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  description: The carrier team to send the quote request to. All uppercase, no spaces
                  example: MARINEHULL
                companyId:
                  type: string
                  description: The carrier company to send the quote request to. All uppercase, no spaces
                  example: WHITECLIFFS
                userId:
                  type: string
                  description: Optional -- include the MU identifier of an individual underwriter to send the quote request to them specifically
                  example: MUD10D799A-7AEB-4F84-A4D9-9FDA73D057DE
                facilityID:
                  type: string
                  description: Required if the risk is a declaration. Specifies the facility agreement that the quote request is being shown under.
                  example: ICCDA7C650-47DB-40E5-B8C0-588867E6BB6D
                messages:
                  type: array
                  description: Optional -- include to send an accompanying broker''s message
                  items:
                    type: object
                    properties:
                      channel:
                        type: string
                        description: The receipient''s channel ID
                        example: whitecliffs_MARINEHULL
                      elements:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                              example: Please agree
                              description: The body of the message
                            index:
                              type: integer
                              example: 0
                      greeting:
                        type: string
                        example: Hello
                        description: The header text of the message
                      closing:
                        type: string
                        example: Best regards
                        description: The footer text of the message
                attachments:
                  type: array
                  description: Optional -- include to specify the attachment/s to share along with the quote request
                  items:
                    type: object
                    properties:
                      attachID:
                        type: string
                        example: A-77C8A342-DCDA-410B-9292-B3CD3105FC10
                        description: The ID of the attachment
                      docID:
                        type: string
                        example: IC2B5E02ED-FF47-4BB6-98F5-8C85F1E052B5::ATCH::A-77C8A342-DCDA-410B-9292-B3CD3105FC10
                        description: The unique ID of the attachment document
                      channels:
                        type: array
                        items:
                          type: string
                          example: whitecliffs_MARINEHULL
                          description: The channel of the recipient to share the attachment with
      responses:
        '200':
          description: successfully forwarded the quote request
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: Forwarded
  /api/risks/{riskID}/setEndorsementFollowerRoles:
    post:
      tags:
      - Risks
      summary: Set the roles of carriers on a Endorsement - Broker Only
      description: A role assigned to a carrier cannot be changed once they have been shown the endorsement. Only carriers who have added a line on the firm order can be assigned a role, but all those carriers must have a role assigned.
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the Endorsement
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::SIGNED::EN1
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  channel:
                    type: string
                    example: whitesails_MARINE
                    description: the channel of the carrier
                  type:
                    type: string
                    description: the role to assign
                    example: leader
                    enum:
                    - leader
                    - agreementParty
                    - doesNotApply
                    - notifyParty
                    - nonNotifyParty
      responses:
        '200':
          description: successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    rev:
                      type: string
                      description: the new revision of the document that was updated
                      example: 5-79fc84132c7b0d9df26daecc84c21de9
                    id:
                      type: string
                      description: the id of the document that was updated
                      example: IC6FD42DF7-989A-4AB4-8638-1EB5870E70CD::SIGNED::EN3::ENF::offlineallianzglobal_ALL
  /api/risks/{riskID}/setEndorsementFollowerTemplate:
    post:
      tags:
      - Risks
      summary: Set the agreement template for an endorsement - Broker Only
      description: Choose between GUA - Marine (GUAStampA), GUA - Non Marine (GUAStampB), AVS100B - Aviation (AVS100B) and non-GUA (NonGUA). Can only be set once the Endorsement has been assigned a Leader.
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the endorsement
        example: IC213DA609-D6B5-4A05-86B8-3FD91E861F57::SIGNED::EN1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  example: whitesails_MARINE
                  description: the channel of the leader
                template:
