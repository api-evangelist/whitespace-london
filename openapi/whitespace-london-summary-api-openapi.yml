    post:
      summary: returns batches of risk summaries using filters in the POST payload
      description: <p>This endpoint returns 60 risks at a time.  Without parameters it will return the most recently changed risks.  The <b>last</b> and <b>from</b> query string parameters enable calls to page through all risks.</p>
      tags:
      - Summary
      parameters:
      - in: query
        required: false
        name: last
        description: The rootID for the last document returned by the previous call
        example: IC467868DE-2E64-4828-913B-A5789191CF3B
        schema:
          type: string
      - in: query
        required: false
        name: from
        description: The date for the last document returned by the previous call
        example: 2021-11-22%2006:37:49
        schema:
          type: string
      requestBody:
        description: Data specifying the filters to be applied
        required: true
        content:
          application/json:
            examples:
              Only Templates:
                description: Limit the summary to Template documents
                value:
                  statuses:
                  - Template
              Single UMR:
                description: Limit the summary to one UMR, not case sensitive.
                value:
                  umrSearch: B0999JC2001221026
              Name Only:
                description: Limit the summary to the name of the risks(s). Not case sensitive, but the search has to be the beginning of a word in the name.
                value:
                  nameSearch: Huston Holdings Ltd
              Owner:
                description: Limit the summary to who owns the risk, options are "My Risks", "Unassigned Risks", "Other Risks".
                value:
                  owner:
                  - My Risks
              Statuses:
                description: <p> Limit the summary by Status. Options are "Template", "NotFinalised", "MarketedOnly", "QuotationRequest", "QuotationInPreparation", "QuotedByUnderwriter", "FirmOrder", "FirmOrderPending", "Signed", "Endorsement", "EndorsementPending". </p>
                value:
                  statuses:
                  - FirmOrder
                  - Signed
              Types:
                description: Limit the summary to type of risk, i.e "Facilities", "Declarations", "Open Market".
                value:
                  types:
                  - Open Market
              Labels:
                description: Limit the summary to risks with a specifc label attached to them such as "High Priority"
                value:
                  labels:
                  - High Priority
              withActions:
                description: Limit the summary to risks with those that do/don't have Inbox Actions. Takes true/false vales
                value:
                  withActions: true
              Facilities:
                description: Limit the summary to Declarations which are attached to FacilityID(s) in question.
                value:
                  facilities:
                  - IC3A553C15-56D0-4C91-991B-B133DFDEFEFC
              RootID:
                description: Searches for a risk with the unique rootID.
                value:
                  rootIDs:
                  - ICFD1FD065-06D5-4E74-9E18-EFF713F0E2D2
            schema:
              properties:
                umrSearch:
                  type: string
                  description: the UMR to be retrieved
                  example: B0999JC2001221026
                statuses:
                  type: array
                  description: an array of risk statuses
                  items:
                    type: string
                  example:
                  - Template
      responses:
        '200':
          description: array of RWRiskSummary objects. See the GET /summary documentation for detailed examples.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RWRiskSummary'
  /api/summary/pinned:
    get:
      summary: returns summaries for all 'pinned' risks
      tags:
      - Summary
      responses:
        '200':
          description: array of RWRiskSummary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RWRiskSummary'
components:
  schemas:
    RWRiskSummary:
      type: object
      description: <p>The summary provides an array of documents related to a risk. The summary itself shows when it was updated and which filters it will be picked up by. </p>
      properties:
        _id:
          type: string
          description: document ID for the summary document
          example: RWRiskSummary::IC9E34C3AA-9F72-469B-BF2A-487578B10A5C::blackrobot_AUTOAPIJENKINS201021
        _rev:
          type: string
          description: the revision of the document
          example: 6-2f39c049dc3274caa11080936b448356
        rootID:
          type: string
          description: the rootID used by all documents for a given risk
          example: IC9E34C3AA-9F72-469B-BF2A-487578B10A5C
        updatedAt:
          type: string
          description: UTC date stamp for when the document was updated
          example: '2021-11-22T06:44:26.000Z'
        channels:
          type: array
          items:
            type: string
            description: channels for teams able to see the document
            example: carrier_MARINECASUALTY
        docs:
          type: array
          items:
            type: object
            description: <p>The document contents vary depending on the type. For instance, the RWPlacing type has several entries including insuredName and inceptionDate,  while the RWLineGuidanceSet type has very few.</p>
            properties:
              id:
                type: string
                description: The root ID of the risk, beginning IC
                example: IC9E34C3AA-9F72-469B-BF2A-487578B10A5C
              channels:
                type: array
                items:
                  type: string
                  description: The user channels of the teams able to see the document
                  example: carrier_MARINECASUALTY
              updatedAt:
                type: string
                description: The date and time that the document was last updated on
                example: '2021-11-22 06:44:20'
              createdAt:
                type: string
                description: The date and time that the document was created on
                example: '2021-11-22T06:44:20.000Z'
              type:
                type: string
                description: The type of document
                example: RWPlacing
              inceptionDate:
                type: number
                description: The risk''s inception date in unix epoch
                example: 1561939200
              insuredName:
                type: string
                description: The name of the risk
                example: Verticals
              lastModifiedBy:
                type: string
                description: The userID of the user who last modified this document
                example: MUB6A6C9F9-61C1-49EA-8C44-28EEAB3226F5
              leadUnderwriterChannel:
                type: string
                description: The team channel of the lead underwriter on the risk
                example: ''
              limitSummary:
                type: string
                description: The maximum limit of the risk
                example: USD 20,000,000
              placementType:
                type: string
                description: The document''s placement type, i.e FullContract, Template
                example: FullContract
              placingBrokerChannel:
                type: string
                description: The team channel of the broker on the risk
                example: blackrobot_AUTOAPIJENKINS201021
              rev:
                type: string
                description: The current revision number of the document
                example: 1-f93a2422aefaa252649c4a9471872b88
              status:
                type: string
                description: The stage the risk is at in the placement process
                example: NotFinalised
              umr:
                type: string
                description: The Unique Reference (formerly UMR) of the risk
                example: B0999MT2211064419
        filters:
          type: array
          items:
            type: string
          example:
          - status:FirmOrderPending
          - umr:b0999mt2211064419
          - status:FirmOrder
          - action:brReadyForSigning
          - ctype:Open Market
          - ptype:FullContract
          - owner:MUB6A6C9F9-61C1-49EA-8C44-28EEAB3226F5
          - name:verticals
          - status:FirmOrderPending
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
