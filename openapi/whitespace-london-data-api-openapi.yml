  /api/v22.04/data/{riskID}/verify:
    post:
      summary: Verifies the risk data to check that it is acceptable for the update POST
      description: <div>This endpoint describes any problems with the data that is intended to be sent to POST /api/v22.04/data/$RiskID.</div> <div>It just does a verify, it <b>does not</b> save any data.</div>
      parameters:
      - in: path
        name: riskID
        schema:
          type: string
        required: true
        description: The unique ID of the risk
        example: IC442C1B93-DE19-4A52-A1D6-E3A4B47C4F6C
      tags:
      - Data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinedData'
      responses:
        '200':
          description: An array of problems with the data. If an empty array, the data is acceptable
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    error:
                      type: string
                      description: what is wrong with the data
                      example: tags do not match input.
                    datapoints:
                      type: array
                      items:
                        type: object
                        description: the Data Point, containing a flat representation of each data value
                        properties:
                          value:
                            type: string
                            description: the defined data value
                            example: Acme Widgets Inc
                          tag:
                            type: string
                            description: the tag that identifies the use of the data item
                            example: Insured_Name
                          mrcHeading:
                            type: string
                            description: the heading (from a fixed list) within the JMRC where the data item was located
                            example: Insured
                          originalHeading:
                            type: string
                            description: the heading visible to the user within the JMRC where the data item was located
                            example: INSURED
                          name:
                            type: string
                            description: the name of the defined data item's placeholder within the JMRC data
                            example: DefinedData0
                          parentID:
                            type: string
                            description: a code that links set of data tags within a heading
                            example: Page:AB9B8D46-D6BC-442E-A01A-65E2F34096DF
                          sectionIDs:
                            type: array
                            items:
                              type: string
                              description: section ID which links to the items in the multiSectionDefinition array
                              example: '2'
                          lineItemIndex:
                            type: number
                            description: the numerical index of the JMRC line item where the data item was located
                            example: 3
                          controlled:
                            type: boolean
                            description: if included as true, indicates an item created through a controlled process, such as Written or Signed Line values
                            example: true
