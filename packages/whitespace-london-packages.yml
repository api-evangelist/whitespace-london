summary:
  registry_packages: 0
  source_distributions: 2
  note: >-
    Whitespace publishes NO client library to any public package registry. Searches of
    npm, PyPI, NuGet, Maven Central, pkg.go.dev, RubyGems, Packagist and crates.io return
    no first-party Whitespace Software Limited package (npm/NuGet hits for "whitespace"
    are unrelated string-utility libraries). What Whitespace does publish is first-party,
    MIT-licensed SOURCE on its GitHub organisation: a C# helper client plus command-line
    utilities, and a Node/Cucumber API test harness. Integrators are otherwise expected to
    generate a client from the OpenAPI at swagger.whitespace.co.uk or call the REST API
    with curl, per the Getting Started guide.
