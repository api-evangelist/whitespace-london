stages:
  source: https://apidocs.whitespace.co.uk/Risk_Stages.pdf
  observed_in_ids:
  - FO (Firm Order)
  narrative: >-
    The placing lifecycle runs draft -> quote request -> quote (or bindable quote) -> firm order
    -> written lines -> signed -> endorsement, each stage materialising a new instance document
    under the same root ID so no prior state is overwritten.
