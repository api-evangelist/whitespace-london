summary: >-
  Whitespace is a document store, not a relational API. Everything is a JSON platform document
  in Couchbase with a compound string _id, a _rev, a type discriminator (the RW* family), and a
  channels[] array that carries authorisation. There are no numeric foreign keys: relationships
  are expressed by embedding one document's _id inside another (parentDocID, associatedRootID,
  associatedPlacingID, endorsementDocID, linkedArchiveID) and, above all, by the ID itself —
  every document under a slip begins with that slip's 38-character root ID.
id_grammar:
  root: 'IC + 36 characters — the root risk (the whole slip, all stages and instances)'
  instance: '<rootID>::<STAGE> — a specific contract instance, e.g. <rootID>::FO'
  child: '<rootID>::<STAGE>::<TYPECODE>::<uuid> — a document under that instance'
  user: 'MU + 36 characters — permanent per corporate identity'
  separator: '::'
  known_segments:
  - code: FO
    meaning: Firm Order stage instance
  - code: ACTI
    meaning: Activity document
  - code: ARCH
    meaning: Archive document
  - code: ATCH
    meaning: Attachment document
  - code: LGUS
    meaning: Line guidance set
  note: >-
    Endpoints taking {rootID} accept only the root form; endpoints taking {riskID} or {docID}
    accept the full instance/child form. See conventions/whitespace-london-conventions.yml.
common_fields:
  _id: compound document identifier
  _rev: 'Couchbase revision, "<n>-<hash>"; must be current on write (optimistic concurrency)'
  type: document type discriminator (the RW* name)
  channels: array of companyid_TEAMID strings controlling visibility
  createdAt / updatedAt: '"YYYY-MM-DD HH:MM:SS" timestamps'
  provenance: '{dataHash, provHash, system, userID, version, writtenAt} write audit block'
entities:
- name: Risk (slip / RWPlacing)
  schema: RWPlacing
  id: rootID (IC...)
  description: >-
    The contract itself, carrying the MRCContract body plus control metadata. A risk moves
    through stages (draft, quote, bindable quote, firm order, signed, endorsement) and each
    stage is a separate instance document under the same root.
  operations:
  - GET /api/risks/{riskID}
  - POST /api/risks/save
  - POST /api/risks/newDraft
  - GET /api/risks/root/{rootID}
  - GET /api/risks/{rootID}/related/{type}
- name: ExtendedMRC
  schema: ExtendedMRC
  description: >-
    The enriched read model of a risk — MRCContract plus questionnaire, written and signed line
    sets, proposed endorsement followers, platform references and provenance.
  operations:
  - GET /api/risks/{riskID}/getExtendedMRC
- name: Activity
  schema: RWActivity
  id: <rootID>::<STAGE>::ACTI::<uuid>
  description: >-
    The append-only history record generated by every significant platform action; also the unit
    placed on the client's Azure Service Bus queue.
  operations:
  - GET /api/activities/{riskID}
  - GET /api/activities/{rootID}/full
  - POST /api/activities/filter
  - GET /api/activities/filter/help
- name: WrittenLineSet
