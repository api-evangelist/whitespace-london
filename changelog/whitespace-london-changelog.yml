- version: '3.4'
  type: major
  date: '2025-10-31'
  notes: https://www.whitespace.co.uk/media/a4pdr5mw/release-notes-3-4-0.pdf
  breaking: false
  highlights:
  - Import selected text or a table from a Word or PDF document directly into a contract heading
  - "'All Available Stamps' stamp group for the Approved (Re)Insurer functionality"
  - Draft contracts can import a Questionnaire from a Template
  - Full display of stamp addresses in the platform and optionally in exported contracts
  - Multiple email addresses for copying a user's notifications
  - Several export enhancements (per-section page numbering, in-line PDF attachments, per-participant stamp pages)
- version: '3.3'
  type: major
  date: '2025-09-04'
  notes: https://www.whitespace.co.uk/media/hwpaflis/release-notes-3-3.pdf
  breaking: false
  highlights:
  - "'Auto-Cascade', automatically progressing declarations when the facility leader writes their line"
  - A range of improvements to table formatting
  - Option to rename contract drafts
  - Contract Library and Contract Builder enhancements
  - New broker permissions and underwriter stamp address requirements
