scope: >-
  Whitespace publishes a single public, dated changelog for the whole platform — every major
  release, patch release and reference-data update back to 1.3, each linking a PDF of the full
  notes plus per-feature user guides. It is a product changelog rather than an API-only one:
  API-affecting changes appear inside the release-note PDFs, and the OpenAPI at
  swagger.whitespace.co.uk carries its own "Last update" date (29th May 2025) rather than a
  version history. The page warns that "some minor platform releases do not have a file
  published here. They are usually infrastructure changes to the platform."
verification:
  discovery_endpoint: GET /api/version
  anonymous: true
  returns: platformVersion, buildDate, revapiCommit, riskLibraryCommit, revapiCommitMessage
breaking_change_policy: >-
  Version-bearing API endpoints are never removed (see lifecycle/whitespace-london-lifecycle.yml);
  releases add capability rather than retire it, so the changelog records additions and
  enhancements rather than breaking changes.
