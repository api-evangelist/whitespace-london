apis:
- aid: whitespace-london:whitespace-platform-api
  name: Whitespace Platform API
  description: >-
    The Whitespace Platform API is a REST/JSON API over the full London-market subscription
    placing lifecycle, publicly described by an OpenAPI 3.0.0 document covering 113 endpoints
    across Risks, Data, Attachments, Documents, Activities, Comments, Labels, Lookup,
    Endorsements, Lines, Questionnaire, Summary, User and MI Report. It genuinely exposes
    QUOTE (quoteOnRequest, saveQuoteDetails, getQuoteDetails, showQuoteToBroker,
    declineQuoteRequest, markAsIndicative, notTakeUpQuotation) and BIND (createBindableQuote,
    draftToFirmOrder, markAsFirmOrder, writeLine, recordLine, requestWrittenLineSets,
    acceptWrittenLine, signSets, reSignSets) and ISSUE of the contract document
    (getExtendedMRC, export/pdf/{riskID}, documents/{docID}), plus post-bind endorsement
    handling. It does NOT cover FNOL or claims — Whitespace is a placing platform, not a
    claims system. The embedded Defined Data API (/api/v22.04/data and /api/v23.09/data)
    returns and verifies structured contract values tagged against MRC headings and an
    alternative ACORDGPM tagset. Documented servers are the Sandbox, Tess, Beta and Staging
    environments; production access is arranged separately with Whitespace Support.
    Authentication is HTTP bearer JWT using a service token issued by Whitespace Support to a
    contracted organisation, restricted to allowlisted IP addresses and expiring within one
    year — there is no self-serve key.
  humanURL: https://apidocs.whitespace.co.uk/
  baseURL: https://sandbox.whitespace.co.uk/
