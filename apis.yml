name: Whitespace
kind: company
description: >-
  Whitespace Software Limited is a London-based digital placing platform for the Lloyd's and
  London (re)insurance market, and one of only two electronic placing systems given fully
  recognised status by Lloyd's. Acquired by Verisk (via Sequel), Whitespace lets brokers and
  underwriters create, negotiate, quote, firm-order, line, sign and endorse fully digital
  subscription-market contracts in place of the traditional slip, across property and casualty,
  specialty, marine, aviation, energy and reinsurance business written in the United Kingdom
  and internationally. Its API posture is unusually strong for the insurance sector but only
  half open: the reference documentation is genuinely public and unauthenticated at
  apidocs.whitespace.co.uk, with a complete OpenAPI 3.0.0 description of 113 endpoints served
  through Swagger UI at swagger.whitespace.co.uk, yet there is no self-serve signup. Sandbox
  and production service tokens are issued by Whitespace Support to contracted broker,
  carrier and vendor organisations, are IP-allowlisted and expire within a year, so the
  integration surface itself is partner-gated. Whitespace is ACORD-native rather than merely
  ACORD-aware: it authored the JSON Market Reform Contract (JMRC) standard and donated it to
  ACORD for incorporation into the Global Reinsurance and Large Commercial data standards,
  and its Defined Data API returns contract values tagged with an ACORDGPM tagset alongside
  MRC headings. Event integration is delivered as per-client Azure Service Bus queues rather
  than webhooks, and no AsyncAPI, GraphQL or public Postman workspace is published.
