    description generated from the published queue guides.
- id: amqp
  conforms: true
  evidence: >-
    Events are delivered over Microsoft Azure Service Bus queues, consumed with the standard
    Azure Service Bus SDKs (.NET, Java, Python, JavaScript, TypeScript).
- id: al3
  conforms: false
  evidence: Not applicable — AL3/IVANS are US agency-download rails, not London-market ones.
